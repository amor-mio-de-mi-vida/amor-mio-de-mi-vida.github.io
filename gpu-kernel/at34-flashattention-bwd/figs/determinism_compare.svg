<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300">
<style>
  text{font-family:system-ui,sans-serif;font-size:12px;fill:#23272f}
  .title{font-size:12px;font-weight:700}
  .label{font-size:11px;fill:#6b7280}
  .code{font-family:ui-monospace,monospace;font-size:10.5px}
  .box{rx:5;ry:5;stroke-width:1.2}
</style>
<text x="350" y="18" text-anchor="middle" class="title">dQ Accumulation: Atomic vs Workspace</text>

<!-- Atomic approach -->
<rect x="20" y="35" width="320" height="230" class="box" fill="#fef2f2" stroke="#ef4444"/>
<text x="180" y="55" text-anchor="middle" class="title" fill="#dc2626">Approach A: atomicAdd</text>

<rect x="35" y="68" width="130" height="35" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
<text x="100" y="90" text-anchor="middle" class="code">CTA (j=0)</text>
<rect x="35" y="108" width="130" height="35" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
<text x="100" y="130" text-anchor="middle" class="code">CTA (j=1)</text>
<rect x="35" y="148" width="130" height="35" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
<text x="100" y="170" text-anchor="middle" class="code">CTA (j=2)</text>

<!-- Arrows to dQ in HBM -->
<rect x="210" y="100" width="115" height="50" rx="5" fill="#fde68a" stroke="#f59e0b" stroke-width="1.5"/>
<text x="267" y="120" text-anchor="middle" class="code">dQ [N,d]</text>
<text x="267" y="135" text-anchor="middle" class="label">(HBM)</text>

<line x1="165" y1="85" x2="210" y2="115" stroke="#ef4444" stroke-width="1"/>
<line x1="165" y1="125" x2="210" y2="125" stroke="#ef4444" stroke-width="1"/>
<line x1="165" y1="165" x2="210" y2="135" stroke="#ef4444" stroke-width="1"/>

<text x="188" y="98" class="code" fill="#dc2626" font-size="9">atomic</text>
<text x="188" y="128" class="code" fill="#dc2626" font-size="9">atomic</text>
<text x="188" y="158" class="code" fill="#dc2626" font-size="9">atomic</text>

<text x="40" y="205" class="label">&#x2713; Simple: one kernel</text>
<text x="40" y="220" class="label">&#x2713; No extra memory</text>
<text x="40" y="235" class="label" fill="#dc2626">&#x2717; Non-deterministic</text>
<text x="40" y="250" class="label" fill="#dc2626">&#x2717; Atomic contention</text>

<!-- Workspace approach -->
<rect x="370" y="35" width="310" height="230" class="box" fill="#dcfce7" stroke="#22c55e"/>
<text x="525" y="55" text-anchor="middle" class="title" fill="#16a34a">Approach B: Workspace + 2nd Kernel</text>

<rect x="385" y="68" width="110" height="35" rx="4" fill="#bbf7d0" stroke="#86efac"/>
<text x="440" y="90" text-anchor="middle" class="code">CTA (j=0)</text>
<rect x="385" y="108" width="110" height="35" rx="4" fill="#bbf7d0" stroke="#86efac"/>
<text x="440" y="130" text-anchor="middle" class="code">CTA (j=1)</text>
<rect x="385" y="148" width="110" height="35" rx="4" fill="#bbf7d0" stroke="#86efac"/>
<text x="440" y="170" text-anchor="middle" class="code">CTA (j=2)</text>

<!-- Workspace buffer -->
<rect x="520" y="68" width="65" height="35" rx="3" fill="#fef9c3" stroke="#fde047"/>
<text x="552" y="90" text-anchor="middle" class="code" font-size="9">ws[0]</text>
<rect x="520" y="108" width="65" height="35" rx="3" fill="#fef9c3" stroke="#fde047"/>
<text x="552" y="130" text-anchor="middle" class="code" font-size="9">ws[1]</text>
<rect x="520" y="148" width="65" height="35" rx="3" fill="#fef9c3" stroke="#fde047"/>
<text x="552" y="170" text-anchor="middle" class="code" font-size="9">ws[2]</text>

<line x1="495" y1="85" x2="520" y2="85" stroke="#22c55e" stroke-width="1" marker-end="url(#arr2)"/>
<line x1="495" y1="125" x2="520" y2="125" stroke="#22c55e" stroke-width="1" marker-end="url(#arr2)"/>
<line x1="495" y1="165" x2="520" y2="165" stroke="#22c55e" stroke-width="1" marker-end="url(#arr2)"/>

<!-- Sum kernel -->
<rect x="600" y="100" width="65" height="50" rx="5" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
<text x="632" y="118" text-anchor="middle" class="code" font-size="9">Kernel 2</text>
<text x="632" y="133" text-anchor="middle" class="code" font-size="9">&#x2211; ws</text>

<line x1="585" y1="85" x2="600" y2="110" stroke="#22c55e" stroke-width="1"/>
<line x1="585" y1="125" x2="600" y2="125" stroke="#22c55e" stroke-width="1"/>
<line x1="585" y1="165" x2="600" y2="140" stroke="#22c55e" stroke-width="1"/>

<text x="385" y="205" class="label" fill="#16a34a">&#x2713; Deterministic</text>
<text x="385" y="220" class="label" fill="#16a34a">&#x2713; No atomic contention</text>
<text x="385" y="235" class="label">&#x2717; Extra O(Nd&#xb7;T_c) memory</text>
<text x="385" y="250" class="label">&#x2717; Two kernel launches</text>

<defs><marker id="arr2" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
  <path d="M0,0 L6,2.5 L0,5" fill="#22c55e"/>
</marker></defs>
<text x="350" y="295" text-anchor="middle" font-size="10.5" fill="#aaa" font-style="italic">data-source: illustrative</text>
</svg>
