<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240">
<style>
  text{font-family:system-ui,sans-serif;font-size:12px;fill:#23272f}
  .title{font-size:11.5px;font-weight:700}
  .label{font-size:11px;fill:#6b7280}
  .code{font-family:ui-monospace,monospace;font-size:10.5px}
  .box{rx:5;ry:5;stroke-width:1.2}
</style>
<text x="340" y="18" text-anchor="middle" class="title">STAR Template for Kernel Optimization Projects</text>

<rect x="20" y="35" width="150" height="85" class="box" fill="#dcfce7" stroke="#22c55e"/>
<text x="95" y="55" text-anchor="middle" class="title" fill="#166534">S — Situation</text>
<text x="35" y="72" class="label">What kernel?</text>
<text x="35" y="87" class="label">What GPU / scale?</text>
<text x="35" y="102" class="label">What was the gap?</text>

<rect x="185" y="35" width="150" height="85" class="box" fill="#eff6ff" stroke="#3b82f6"/>
<text x="260" y="55" text-anchor="middle" class="title" fill="#3b82f6">T — Task</text>
<text x="200" y="72" class="label">Target latency?</text>
<text x="200" y="87" class="label">Constraints?</text>
<text x="200" y="102" class="label">Scope?</text>

<rect x="350" y="35" width="150" height="85" class="box" fill="#fef9c3" stroke="#eab308"/>
<text x="425" y="55" text-anchor="middle" class="title" fill="#854d0e">A — Action</text>
<text x="365" y="72" class="label">Profile &rarr; bottleneck</text>
<text x="365" y="87" class="label">Optimization steps</text>
<text x="365" y="102" class="label">Trade-offs made</text>

<rect x="515" y="35" width="145" height="85" class="box" fill="#fef2f2" stroke="#ef4444"/>
<text x="587" y="55" text-anchor="middle" class="title" fill="#ef4444">R — Result</text>
<text x="530" y="72" class="label">Speedup number</text>
<text x="530" y="87" class="label">Impact on system</text>
<text x="530" y="102" class="label">What you learned</text>

<!-- Example -->
<rect x="20" y="135" width="640" height="75" class="box" fill="#f3f4f6" stroke="#d1d5db"/>
<text x="340" y="155" text-anchor="middle" class="title">Example kernel project STAR</text>
<text x="35" y="173" class="label">S: LLM inference decode was bottlenecked by attention kernel on A100 (seq_len 32K, batch 64)</text>
<text x="35" y="191" class="label">A: Profiled with ncu &rarr; 45% HBM utilization; vectorized loads + online softmax &rarr; 82% utilization</text>
<text x="35" y="209" class="label">R: 1.8x speedup, reduced p99 latency from 12ms to 7ms, deployed to production serving 10K QPS</text>

<text x="340" y="237" text-anchor="middle" font-size="11" fill="#aaa" font-style="italic">data-source: illustrative</text>
</svg>
