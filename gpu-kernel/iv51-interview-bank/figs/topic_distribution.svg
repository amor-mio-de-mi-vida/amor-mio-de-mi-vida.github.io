<!-- Total -->
<text x="340" y="300" text-anchor="middle" class="title">Hypothetical split of a ~200-question bank (counts are not a survey)</text>

<text x="340" y="318" text-anchor="middle" font-size="11" fill="#aaa" font-style="italic">data-source: illustrative</text>
</svg>
