<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
<style>
  text{font-family:system-ui,sans-serif;font-size:12px;fill:#23272f}
  .title{font-size:11.5px;font-weight:700}
  .label{font-size:11px;fill:#6b7280}
  .code{font-family:ui-monospace,monospace;font-size:10.5px}
  .bar{rx:3;ry:3}
</style>
<text x="340" y="18" text-anchor="middle" class="title">GPU Kernel Interview Topics Distribution</text>

<!-- Bars -->
<rect x="180" y="35" width="320" height="22" class="bar" fill="#dcfce7" stroke="#22c55e" stroke-width="0.8"/>
