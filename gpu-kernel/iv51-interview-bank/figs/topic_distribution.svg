<text x="345" y="185" class="code">~20 questions</text>

<rect x="180" y="197" width="120" height="22" class="bar" fill="#f3f4f6" stroke="#9ca3af" stroke-width="0.8"/>
<text x="175" y="212" text-anchor="end" class="label">Profiling / Tools</text>
<text x="305" y="212" class="code">~15 questions</text>

<rect x="180" y="224" width="120" height="22" class="bar" fill="#f3f4f6" stroke="#9ca3af" stroke-width="0.8"/>
