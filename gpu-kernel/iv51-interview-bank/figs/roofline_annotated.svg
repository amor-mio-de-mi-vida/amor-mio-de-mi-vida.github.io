<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380">
<style>
  text{font-family:system-ui,sans-serif;font-size:12px;fill:#23272f}
  .title{font-size:12px;font-weight:700}
  .label{font-size:11px;fill:#6b7280}
  .code{font-family:ui-monospace,monospace;font-size:10.5px}
  .axis{stroke:#374151;stroke-width:1.5}
  .roof{stroke-width:2.5}
</style>
<text x="350" y="18" text-anchor="middle" class="title">Roofline Model: Memory-Bound vs Compute-Bound</text>

<!-- Axes -->
<line x1="80" y1="320" x2="660" y2="320" class="axis"/>
<line x1="80" y1="320" x2="80" y2="40" class="axis"/>
<text x="370" y="355" text-anchor="middle" class="label">Arithmetic Intensity (FLOP/Byte)</text>
<text x="30" y="180" text-anchor="middle" class="label" transform="rotate(-90,30,180)">Throughput (TFLOP/s)</text>

<!-- Axis ticks -->
<text x="80" y="338" text-anchor="middle" class="code" font-size="9">0.1</text>
<text x="180" y="338" text-anchor="middle" class="code" font-size="9">1</text>
<text x="280" y="338" text-anchor="middle" class="code" font-size="9">10</text>
<text x="380" y="338" text-anchor="middle" class="code" font-size="9">100</text>
<text x="480" y="338" text-anchor="middle" class="code" font-size="9">1000</text>

<text x="73" y="303" text-anchor="end" class="code" font-size="9">0.1</text>
<text x="73" y="243" text-anchor="end" class="code" font-size="9">1</text>
<text x="73" y="183" text-anchor="end" class="code" font-size="9">10</text>
<text x="73" y="123" text-anchor="end" class="code" font-size="9">100</text>
<text x="73" y="63" text-anchor="end" class="code" font-size="9">1000</text>

<!-- Memory roof (sloped line) -->
<line x1="80" y1="300" x2="360" y2="60" class="roof" stroke="#3b82f6"/>
<text x="190" y="145" class="title" fill="#3b82f6" transform="rotate(-42,190,145)">HBM BW: 2.0 TB/s</text>

<!-- Compute ceiling (horizontal) -->
<line x1="360" y1="60" x2="660" y2="60" class="roof" stroke="#dc2626"/>
<text x="510" y="52" class="title" fill="#dc2626">FP16 Tensor Core: 312 TFLOP/s</text>

<!-- Ridge point -->
<circle cx="360" cy="60" r="5" fill="#f59e0b"/>
<text x="370" y="85" class="title" fill="#a16207">Ridge: 156 FLOP/B</text>

<!-- Kernel points -->
<!-- Softmax: AI=0.625, ~1.25 TFLOP/s -->
<circle cx="140" cy="240" r="7" fill="#ef4444"/>
<text x="155" y="236" class="code" fill="#ef4444">Softmax</text>
<text x="155" y="250" class="label" font-size="9">AI=0.6, mem-bound</text>

<!-- LayerNorm: AI=1.3 -->
<circle cx="165" cy="220" r="7" fill="#f97316"/>
<text x="180" y="216" class="code" fill="#f97316">LayerNorm</text>
<text x="180" y="230" class="label" font-size="9">AI=1.3, mem-bound</text>

<!-- GEMV: AI=0.25 -->
<circle cx="110" cy="270" r="7" fill="#a855f7"/>
<text x="125" y="266" class="code" fill="#a855f7">GEMV</text>
<text x="125" y="280" class="label" font-size="9">AI=0.25, mem-bound</text>

<!-- GEMM 4096: AI=1431 -->
<circle cx="540" cy="80" r="7" fill="#22c55e"/>
<text x="555" y="76" class="code" fill="#22c55e">GEMM 4K</text>
<text x="555" y="90" class="label" font-size="9">AI=1431, compute-bound</text>

<!-- FlashAttn: AI ~d/4=32 -->
<circle cx="310" cy="100" r="7" fill="#06b6d4"/>
<text x="325" y="96" class="code" fill="#06b6d4">FlashAttn</text>
<text x="325" y="110" class="label" font-size="9">AI~32, borderline</text>

<!-- Memory-bound region -->
<rect x="85" y="325" width="270" height="16" rx="3" fill="#dbeafe" opacity="0.5"/>
<text x="220" y="337" text-anchor="middle" class="label" font-size="10" fill="#2563eb">Memory-Bound Region</text>

<!-- Compute-bound region -->
<rect x="365" y="325" width="290" height="16" rx="3" fill="#fee2e2" opacity="0.5"/>
<text x="510" y="337" text-anchor="middle" class="label" font-size="10" fill="#dc2626">Compute-Bound Region</text>

<text x="350" y="375" text-anchor="middle" font-size="10.5" fill="#aaa" font-style="italic">data-source: computed (A100, FP16 Tensor Core)</text>
</svg>
