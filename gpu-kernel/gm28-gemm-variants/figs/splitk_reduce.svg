<svg viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', sans-serif">
  <style>
    .title { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
    .label { font-size: 12px; fill: #1a1a1a; }
    .sublabel { font-size: 10px; fill: #666; }
    .box { rx: 6; ry: 6; stroke-width: 1.5; }
    .arrow { stroke-width: 1.5; fill: none; marker-end: url(#ah); }
  </style>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>

  <text x="360" y="24" text-anchor="middle" class="title">Split-K：沿 K 维度切分 + reduce</text>

  <!-- A matrix -->
  <rect x="20" y="50" width="60" height="120" class="box" fill="#E8F4FD" stroke="#0072B2"/>
  <text x="50" y="115" text-anchor="middle" class="label">A</text>
  <text x="50" y="130" text-anchor="middle" class="sublabel">M&times;K</text>

  <!-- K split lines -->
  <line x1="100" y1="60" x2="100" y2="160" stroke="#D55E00" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="160" y1="60" x2="160" y2="160" stroke="#D55E00" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Split-K slices -->
  <rect x="85" y="60" width="90" height="30" rx="3" fill="#FFF3E0" stroke="#D55E00"/>
  <text x="130" y="80" text-anchor="middle" class="sublabel">CTA z=0</text>

  <rect x="85" y="95" width="90" height="30" rx="3" fill="#FFF3E0" stroke="#D55E00"/>
  <text x="130" y="115" text-anchor="middle" class="sublabel">CTA z=1</text>

  <rect x="85" y="130" width="90" height="30" rx="3" fill="#FFF3E0" stroke="#D55E00"/>
  <text x="130" y="150" text-anchor="middle" class="sublabel">CTA z=2</text>

  <!-- B matrix -->
  <rect x="190" y="50" width="100" height="60" class="box" fill="#E8F5E9" stroke="#009E73"/>
  <text x="240" y="85" text-anchor="middle" class="label">B</text>
  <text x="240" y="100" text-anchor="middle" class="sublabel">K&times;N</text>

  <!-- Arrow to workspace -->
  <path d="M180,110 L310,110" class="arrow" stroke="#D55E00"/>

  <!-- Workspace -->
  <rect x="320" y="50" width="80" height="30" rx="3" fill="#FCE4EC" stroke="#CC79A7"/>
  <text x="360" y="70" text-anchor="middle" class="sublabel">partial C₀</text>

  <rect x="320" y="90" width="80" height="30" rx="3" fill="#FCE4EC" stroke="#CC79A7"/>
  <text x="360" y="110" text-anchor="middle" class="sublabel">partial C₁</text>

  <rect x="320" y="130" width="80" height="30" rx="3" fill="#FCE4EC" stroke="#CC79A7"/>
  <text x="360" y="150" text-anchor="middle" class="sublabel">partial C₂</text>

  <text x="360" y="180" text-anchor="middle" class="sublabel">workspace</text>

  <!-- Reduce arrow -->
  <path d="M410,110 L480,110" class="arrow" stroke="#CC79A7"/>
  <text x="445" y="100" text-anchor="middle" class="sublabel">reduce</text>

  <!-- Reduce kernel -->
  <rect x="490" y="75" width="100" height="50" class="box" fill="#F3E5F5" stroke="#CC79A7"/>
  <text x="540" y="97" text-anchor="middle" class="label">splitk_</text>
  <text x="540" y="112" text-anchor="middle" class="label">reduce</text>

  <!-- Final C -->
  <path d="M595,100 L640,100" class="arrow" stroke="#666"/>
  <rect x="650" y="75" width="55" height="50" class="box" fill="#E8F4FD" stroke="#0072B2"/>
  <text x="677" y="104" text-anchor="middle" class="label">C</text>

  <!-- Annotation -->
  <rect x="20" y="200" width="320" height="55" rx="4" fill="#FFFDE7" stroke="#F0E442" stroke-width="1"/>
  <text x="30" y="218" class="sublabel" fill="#D55E00" font-weight="600">grid = (M_tiles, N_tiles, split_k)</text>
  <text x="30" y="234" class="sublabel">当 M 小 &rarr; M_tiles 少 &rarr; Split-K 增加 z 维度并行度</text>
  <text x="30" y="248" class="sublabel">代价：workspace 内存 + reduce kernel launch</text>
</svg>
