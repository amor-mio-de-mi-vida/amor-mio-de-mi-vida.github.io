  <rect x="350" y="102" width="35" height="35" class="tile" fill="#D55E00" stroke="#993F00" opacity="0.6"/>
  <text x="367" y="124" text-anchor="middle" class="sublabel" fill="white">9</text>
  <rect x="310" y="142" width="35" height="35" class="tile" fill="#D55E00" stroke="#993F00" opacity="0.6"/>
