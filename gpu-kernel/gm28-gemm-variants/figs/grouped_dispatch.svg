  <rect x="350" y="142" width="35" height="35" class="tile" fill="#D55E00" stroke="#993F00" opacity="0.6"/>
  <text x="367" y="164" text-anchor="middle" class="sublabel" fill="white">11</text>
  <rect x="310" y="182" width="35" height="35" class="tile" fill="#D55E00" stroke="#993F00" opacity="0.6"/>
  <text x="327" y="204" text-anchor="middle" class="sublabel" fill="white">12</text>
  <rect x="350" y="182" width="35" height="35" class="tile" fill="#D55E00" stroke="#993F00" opacity="0.6"/>
  <text x="367" y="204" text-anchor="middle" class="sublabel" fill="white">13</text>

  <!-- Group 3: 2x2 tiles -->
  <text x="490" y="54" text-anchor="middle" class="label">Expert 3 (M=128)</text>
  <rect x="450" y="62" width="45" height="45" class="tile" fill="#CC79A7" stroke="#993366" opacity="0.6"/>
  <text x="472" y="88" text-anchor="middle" class="sublabel" fill="white">14</text>
  <rect x="500" y="62" width="45" height="45" class="tile" fill="#CC79A7" stroke="#993366" opacity="0.6"/>
