  <!-- Flat dispatch table -->
  <text x="360" y="240" text-anchor="middle" class="sublabel">TileInfo[18]: blockIdx.x &rarr; {group, tile_m, tile_n}，一次 launch 做完所有 expert</text>
</svg>
