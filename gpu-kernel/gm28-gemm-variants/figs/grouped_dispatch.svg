  <text x="215" y="54" text-anchor="middle" class="label">Expert 1 (M=64)</text>
  <rect x="170" y="62" width="45" height="45" class="tile" fill="#009E73" stroke="#005F48" opacity="0.6"/>
  <text x="192" y="88" text-anchor="middle" class="sublabel" fill="white">4</text>
  <rect x="220" y="62" width="45" height="45" class="tile" fill="#009E73" stroke="#005F48" opacity="0.6"/>
  <text x="242" y="88" text-anchor="middle" class="sublabel" fill="white">5</text>

  <!-- Group 2: 4x2 tiles -->
  <text x="380" y="54" text-anchor="middle" class="label">Expert 2 (M=256)</text>
  <rect x="310" y="62" width="35" height="35" class="tile" fill="#D55E00" stroke="#993F00" opacity="0.6"/>
  <text x="327" y="84" text-anchor="middle" class="sublabel" fill="white">6</text>
  <rect x="350" y="62" width="35" height="35" class="tile" fill="#D55E00" stroke="#993F00" opacity="0.6"/>
