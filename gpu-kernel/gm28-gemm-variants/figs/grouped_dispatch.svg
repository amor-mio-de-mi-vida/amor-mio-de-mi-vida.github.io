<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', sans-serif">
  <style>
    .title { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
    .label { font-size: 12px; fill: #1a1a1a; }
    .sublabel { font-size: 10px; fill: #666; }
    .box { rx: 6; ry: 6; stroke-width: 1.5; }
    .tile { rx: 3; ry: 3; stroke-width: 1; }
    .arrow { stroke-width: 1.5; fill: none; marker-end: url(#ah2); }
  </style>
  <defs>
    <marker id="ah2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>

  <text x="360" y="24" text-anchor="middle" class="title">Grouped GEMM：Tile 调度表</text>

  <!-- Group 0: 2x2 tiles -->
  <text x="80" y="54" text-anchor="middle" class="label">Expert 0 (M=128)</text>
  <rect x="30" y="62" width="45" height="45" class="tile" fill="#56B4E9" stroke="#0072B2" opacity="0.6"/>
  <text x="52" y="88" text-anchor="middle" class="sublabel" fill="white">0</text>
  <rect x="80" y="62" width="45" height="45" class="tile" fill="#56B4E9" stroke="#0072B2" opacity="0.6"/>
  <text x="102" y="88" text-anchor="middle" class="sublabel" fill="white">1</text>
  <rect x="30" y="112" width="45" height="45" class="tile" fill="#56B4E9" stroke="#0072B2" opacity="0.6"/>
  <text x="52" y="138" text-anchor="middle" class="sublabel" fill="white">2</text>
  <rect x="80" y="112" width="45" height="45" class="tile" fill="#56B4E9" stroke="#0072B2" opacity="0.6"/>
  <text x="102" y="138" text-anchor="middle" class="sublabel" fill="white">3</text>

