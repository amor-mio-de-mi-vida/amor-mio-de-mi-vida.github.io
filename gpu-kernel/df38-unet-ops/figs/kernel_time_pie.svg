<svg viewBox="0 0 720 180" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', sans-serif">
  <style>
    .title { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
    .label { font-size: 12px; fill: #1a1a1a; }
    .sublabel { font-size: 10px; fill: #666; }
    .pct { font-size: 13px; font-weight: 600; fill: white; }
  </style>

    <text x="360" y="22" text-anchor="middle" class="title">Diffusion 去噪步的算子分类（示意，不表示时间比例）</text>

  <rect x="40" y="45" width="145" height="50" rx="4" fill="#1976D2" opacity="0.85"/>
  <text x="112.5" y="75" text-anchor="middle" class="pct">卷积</text>
  <rect x="205" y="45" width="145" height="50" rx="4" fill="#388E3C" opacity="0.85"/>
  <text x="277.5" y="75" text-anchor="middle" class="pct">Attention</text>
  <rect x="370" y="45" width="145" height="50" rx="4" fill="#D55E00" opacity="0.85"/>
  <text x="442.5" y="75" text-anchor="middle" class="pct">GN + 激活</text>
  <rect x="535" y="45" width="145" height="50" rx="4" fill="#7B1FA2" opacity="0.6"/>
  <text x="607.5" y="75" text-anchor="middle" class="pct">其他</text>
  <text x="112.5" y="113" text-anchor="middle" class="sublabel" fill="#1976D2" font-weight="600">compute-bound</text>
  <text x="112.5" y="130" text-anchor="middle" class="sublabel">3&times;3 conv（Tensor Core</text>
  <text x="112.5" y="143" text-anchor="middle" class="sublabel">implicit GEMM）</text>
  <text x="277.5" y="113" text-anchor="middle" class="sublabel" fill="#388E3C" font-weight="600">compute/memory</text>
  <text x="277.5" y="130" text-anchor="middle" class="sublabel">self/cross-attention</text>
  <text x="277.5" y="143" text-anchor="middle" class="sublabel">（KV 很短时偏 memory）</text>
  <text x="442.5" y="113" text-anchor="middle" class="sublabel" fill="#D55E00" font-weight="600">memory-bound</text>
  <text x="442.5" y="130" text-anchor="middle" class="sublabel">GroupNorm、SiLU、</text>
  <text x="442.5" y="143" text-anchor="middle" class="sublabel">residual add</text>
  <text x="607.5" y="113" text-anchor="middle" class="sublabel" fill="#7B1FA2" font-weight="600">多为 memory-bound</text>
  <text x="607.5" y="130" text-anchor="middle" class="sublabel">upsample、elementwise、</text>
  <text x="607.5" y="143" text-anchor="middle" class="sublabel">timestep embed</text>

  <text x="360" y="170" text-anchor="middle" class="sublabel" fill="#999" font-style="italic">*各类的时间占比随模型、分辨率、batch size 和硬件变化，需用 profiler 实测</text>
</svg>
