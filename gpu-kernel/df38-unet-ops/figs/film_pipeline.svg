<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200">
<style>
  text{font-family:system-ui,sans-serif;font-size:12px;fill:#23272f}
  .title{font-size:12px;font-weight:700}
  .label{font-size:11px;fill:#6b7280}
  .code{font-family:ui-monospace,monospace;font-size:10.5px}
</style>
<text x="350" y="18" text-anchor="middle" class="title">FiLM Modulation: Timestep Injection into ResBlock</text>

<!-- Timestep embedding pipeline -->
<rect x="20" y="35" width="95" height="35" rx="5" fill="#fef9c3" stroke="#eab308"/>
<text x="67" y="57" text-anchor="middle" class="code">t (scalar)</text>

<line x1="115" y1="52" x2="135" y2="52" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="135" y="35" width="95" height="35" rx="5" fill="#fef9c3" stroke="#eab308"/>
<text x="182" y="57" text-anchor="middle" class="code">sin/cos</text>

<line x1="230" y1="52" x2="250" y2="52" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="250" y="35" width="95" height="35" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
<text x="297" y="57" text-anchor="middle" class="code">Linear+SiLU</text>

<line x1="345" y1="52" x2="365" y2="52" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="365" y="35" width="95" height="35" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
<text x="412" y="57" text-anchor="middle" class="code">Linear</text>

<line x1="460" y1="52" x2="480" y2="52" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="480" y="35" width="100" height="35" rx="5" fill="#dcfce7" stroke="#22c55e"/>
<text x="530" y="57" text-anchor="middle" class="code">[scale,shift]</text>

<!-- FiLM fusion -->
<rect x="80" y="100" width="130" height="40" rx="5" fill="#fef2f2" stroke="#ef4444"/>
<text x="145" y="125" text-anchor="middle" class="code">GroupNorm(x)</text>

<line x1="210" y1="120" x2="245" y2="120" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="245" y="100" width="200" height="40" rx="5" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
<text x="345" y="118" text-anchor="middle" class="code">scale&#xb7;GN(x) + shift</text>
<text x="345" y="132" text-anchor="middle" class="label" fill="#16a34a">FiLM modulation</text>

<line x1="445" y1="120" x2="480" y2="120" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="480" y="100" width="100" height="40" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
<text x="530" y="125" text-anchor="middle" class="code">SiLU(y)</text>

<!-- Fusion bracket -->
<rect x="78" y="95" width="510" height="50" rx="8" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4"/>
<text x="590" y="125" class="label" fill="#dc2626">fused</text>
<text x="590" y="138" class="label" fill="#dc2626">kernel</text>

<!-- scale/shift arrow down -->
<line x1="530" y1="70" x2="530" y2="100" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow2)"/>

<text x="350" y="170" text-anchor="middle" class="label">GN pass2 reads &#x3bc;/&#x3c3;&#xb2;, normalizes, applies scale/shift, then SiLU &#x2014; one kernel, one HBM round-trip</text>
<text x="350" y="188" text-anchor="middle" font-size="10.5" fill="#aaa" font-style="italic">data-source: illustrative</text>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
  </marker>
  <marker id="arrow2" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#22c55e"/>
  </marker>
</defs>
</svg>
