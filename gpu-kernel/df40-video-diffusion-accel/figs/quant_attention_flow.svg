<svg viewBox="0 0 700 280" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="13">
  <text x="350" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">量化 Attention 数据流（SageAttention2-8b 思路）</text>

  <!-- Stage 1: INT8 QK^T -->
  <text x="180" y="55" text-anchor="middle" font-size="12" fill="#e17055" font-weight="bold">Stage 1: INT8 QK^T</text>

  <rect x="20" y="65" width="80" height="32" rx="4" fill="#dfe6e9" stroke="#636e72"/>
  <text x="60" y="85" text-anchor="middle" font-size="11">Q (FP16)</text>

  <text x="115" y="85" text-anchor="middle" font-size="11" fill="#888">&rarr;</text>

  <rect x="130" y="65" width="100" height="32" rx="4" fill="#ffeaa7" stroke="#fdcb6e"/>
  <text x="180" y="85" text-anchor="middle" font-size="11">per-block quant</text>

  <text x="245" y="85" text-anchor="middle" font-size="11" fill="#888">&rarr;</text>

  <rect x="260" y="65" width="80" height="32" rx="4" fill="#74b9ff" stroke="#0984e3"/>
  <text x="300" y="85" text-anchor="middle" font-size="11" fill="#fff">Q_int8</text>

  <!-- K path -->
  <rect x="20" y="110" width="80" height="32" rx="4" fill="#dfe6e9" stroke="#636e72"/>
  <text x="60" y="130" text-anchor="middle" font-size="11">K (FP16)</text>

  <text x="115" y="130" text-anchor="middle" font-size="11" fill="#888">&rarr;</text>

  <rect x="130" y="110" width="100" height="32" rx="4" fill="#55efc4" stroke="#00b894"/>
  <text x="180" y="130" text-anchor="middle" font-size="11">−mean(K) + quant</text>

  <text x="245" y="130" text-anchor="middle" font-size="11" fill="#888">&rarr;</text>

  <rect x="260" y="110" width="80" height="32" rx="4" fill="#74b9ff" stroke="#0984e3"/>
  <text x="300" y="130" text-anchor="middle" font-size="11" fill="#fff">K_int8</text>

  <!-- INT8 GEMM -->
  <text x="400" y="105" text-anchor="middle" font-size="11" fill="#888">&rarr;</text>

  <rect x="420" y="80" width="120" height="40" rx="6" fill="#e17055" stroke="#d63031" stroke-width="1.5"/>
  <text x="480" y="98" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">INT8 GEMM</text>
  <text x="480" y="112" text-anchor="middle" font-size="10" fill="#fff">__dp4a / TC</text>

  <text x="555" y="105" text-anchor="middle" font-size="11" fill="#888">&rarr;</text>

  <rect x="570" y="85" width="110" height="30" rx="4" fill="#ffeaa7" stroke="#fdcb6e"/>
  <text x="625" y="105" text-anchor="middle" font-size="11">S = dequant()</text>

  <!-- Stage 2: Softmax + FP8 PV -->
  <text x="180" y="170" text-anchor="middle" font-size="12" fill="#6c5ce7" font-weight="bold">Stage 2: FP8 PV</text>

  <rect x="20" y="180" width="110" height="32" rx="4" fill="#ffeaa7" stroke="#fdcb6e"/>
  <text x="75" y="200" text-anchor="middle" font-size="11">softmax(S)</text>

  <text x="145" y="200" text-anchor="middle" font-size="11" fill="#888">&rarr;</text>

  <rect x="160" y="180" width="100" height="32" rx="4" fill="#ffeaa7" stroke="#fdcb6e"/>
  <text x="210" y="200" text-anchor="middle" font-size="11">quant to FP8</text>

  <text x="275" y="200" text-anchor="middle" font-size="11" fill="#888">&rarr;</text>

  <rect x="290" y="180" width="70" height="32" rx="4" fill="#a29bfe" stroke="#6c5ce7"/>
  <text x="325" y="200" text-anchor="middle" font-size="11" fill="#fff">P_fp8</text>

  <!-- V path -->
  <rect x="290" y="220" width="70" height="32" rx="4" fill="#a29bfe" stroke="#6c5ce7"/>
  <text x="325" y="240" text-anchor="middle" font-size="11" fill="#fff">V_fp8</text>

  <!-- FP8 GEMM -->
  <text x="400" y="215" text-anchor="middle" font-size="11" fill="#888">&rarr;</text>

  <rect x="420" y="195" width="120" height="40" rx="6" fill="#6c5ce7" stroke="#5f27cd" stroke-width="1.5"/>
  <text x="480" y="213" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">FP8 GEMM</text>
  <text x="480" y="227" text-anchor="middle" font-size="10" fill="#fff">WGMMA / TC</text>

  <text x="555" y="215" text-anchor="middle" font-size="11" fill="#888">&rarr;</text>

  <rect x="570" y="200" width="110" height="30" rx="4" fill="#dfe6e9" stroke="#636e72"/>
  <text x="625" y="219" text-anchor="middle" font-size="11">O (FP16)</text>

  <!-- Annotation -->
  <text x="350" y="270" text-anchor="middle" font-size="11" fill="#888">H100 / HGX B200 稠密峰值：INT8 = FP8 = 2 × FP16 Tensor Core</text>
</svg>
