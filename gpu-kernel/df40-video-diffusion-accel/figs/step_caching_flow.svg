<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260">
<style>
  text{font-family:system-ui,sans-serif;font-size:12px;fill:#23272f}
  .title{font-size:12px;font-weight:700}
  .label{font-size:11px;fill:#6b7280}
  .code{font-family:ui-monospace,monospace;font-size:10.5px}
</style>
<text x="350" y="18" text-anchor="middle" class="title">Step Caching: DeepCache / TeaCache</text>

<!-- Timeline -->
<line x1="40" y1="60" x2="660" y2="60" stroke="#888" stroke-width="1"/>

<!-- Steps -->
<rect x="50" y="45" width="60" height="30" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2"/>
<text x="80" y="64" text-anchor="middle" class="code" font-size="10">Step 0</text>
<text x="80" y="85" text-anchor="middle" class="label">Full fwd</text>

<rect x="130" y="45" width="60" height="30" rx="4" fill="#fef9c3" stroke="#eab308" stroke-width="1.2"/>
<text x="160" y="64" text-anchor="middle" class="code" font-size="10">Step 1</text>
<text x="160" y="85" text-anchor="middle" class="label" fill="#a16207">Cache</text>

<rect x="210" y="45" width="60" height="30" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2"/>
<text x="240" y="64" text-anchor="middle" class="code" font-size="10">Step 2</text>
<text x="240" y="85" text-anchor="middle" class="label">Full fwd</text>

<rect x="290" y="45" width="60" height="30" rx="4" fill="#fef9c3" stroke="#eab308" stroke-width="1.2"/>
<text x="320" y="64" text-anchor="middle" class="code" font-size="10">Step 3</text>
<text x="320" y="85" text-anchor="middle" class="label" fill="#a16207">Cache</text>

<rect x="370" y="45" width="60" height="30" rx="4" fill="#fef9c3" stroke="#eab308" stroke-width="1.2"/>
<text x="400" y="64" text-anchor="middle" class="code" font-size="10">Step 4</text>
<text x="400" y="85" text-anchor="middle" class="label" fill="#a16207">Cache</text>

<rect x="450" y="45" width="60" height="30" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2"/>
<text x="480" y="64" text-anchor="middle" class="code" font-size="10">Step 5</text>
<text x="480" y="85" text-anchor="middle" class="label">Full fwd</text>

<text x="560" y="64" text-anchor="middle" class="code">...</text>

<!-- Cache reuse arrows -->
<path d="M110,60 Q120,38 130,45" fill="none" stroke="#eab308" stroke-width="1" marker-end="url(#ca)"/>
<path d="M270,60 Q285,35 290,45" fill="none" stroke="#eab308" stroke-width="1" marker-end="url(#ca)"/>
<path d="M350,60 Q360,38 370,45" fill="none" stroke="#eab308" stroke-width="1" marker-end="url(#ca)"/>

<!-- DeepCache box -->
<rect x="40" y="105" width="300" height="90" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
<text x="190" y="125" text-anchor="middle" class="title" fill="#2563eb">DeepCache (Fixed Skip)</text>
<text x="55" y="145" class="label">Every 2nd step: reuse prev features</text>
<text x="55" y="162" class="code" font-size="10">if step % 2 == 1: out = cached_features</text>
<text x="55" y="179" class="label">Saves ~50% of DiT compute</text>

<!-- TeaCache box -->
<rect x="370" y="105" width="290" height="90" rx="5" fill="#fef9c3" stroke="#eab308" stroke-width="1.2"/>
<text x="515" y="125" text-anchor="middle" class="title" fill="#a16207">TeaCache (Adaptive Skip)</text>
<text x="385" y="145" class="label">Measure feature distance to prev step</text>
<text x="385" y="162" class="code" font-size="10">if dist(feat_t, feat_{t-1}) &lt; thr: skip</text>
<text x="385" y="179" class="label">Early steps: skip more (noise similar)</text>

<!-- Legend -->
<rect x="210" y="215" width="14" height="14" rx="2" fill="#dcfce7" stroke="#22c55e"/>
<text x="230" y="227" class="label">Full forward</text>
<rect x="320" y="215" width="14" height="14" rx="2" fill="#fef9c3" stroke="#eab308"/>
<text x="340" y="227" class="label">Reuse cached features</text>

<defs>
<marker id="ca" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#eab308"/></marker>
</defs>
<text x="350" y="255" text-anchor="middle" font-size="10.5" fill="#aaa" font-style="italic">data-source: illustrative</text>
</svg>
