<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="13">
  <text x="350" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">3D Token Tile 排布与稀疏 Attention Mask</text>

  <!-- Left: 3D tile grid -->
  <text x="160" y="50" text-anchor="middle" font-size="12" fill="#666">视频 token 分成 3D tile</text>

  <!-- Layer 0 (t=0) -->
  <g transform="translate(30,60)">
    <text x="-5" y="40" text-anchor="end" font-size="10" fill="#888">t=0</text>
    <rect x="10" y="5" width="55" height="35" rx="3" fill="#74b9ff" stroke="#0984e3" stroke-width="1.5"/>
    <text x="37" y="27" text-anchor="middle" font-size="10" fill="#fff">T0</text>
    <rect x="70" y="5" width="55" height="35" rx="3" fill="#a29bfe" stroke="#6c5ce7" stroke-width="1.5"/>
    <text x="97" y="27" text-anchor="middle" font-size="10" fill="#fff">T1</text>
    <rect x="130" y="5" width="55" height="35" rx="3" fill="#fd79a8" stroke="#e84393" stroke-width="1.5"/>
    <text x="157" y="27" text-anchor="middle" font-size="10" fill="#fff">T2</text>
    <rect x="10" y="45" width="55" height="35" rx="3" fill="#55efc4" stroke="#00b894" stroke-width="1.5"/>
    <text x="37" y="67" text-anchor="middle" font-size="10" fill="#333">T3</text>
    <rect x="70" y="45" width="55" height="35" rx="3" fill="#ffeaa7" stroke="#fdcb6e" stroke-width="1.5"/>
    <text x="97" y="67" text-anchor="middle" font-size="10" fill="#333">T4</text>
    <rect x="130" y="45" width="55" height="35" rx="3" fill="#fab1a0" stroke="#e17055" stroke-width="1.5"/>
    <text x="157" y="67" text-anchor="middle" font-size="10" fill="#333">T5</text>
  </g>

  <!-- Layer 1 (t=1) -->
  <g transform="translate(50,150)">
    <text x="-25" y="40" text-anchor="end" font-size="10" fill="#888">t=1</text>
    <rect x="10" y="5" width="55" height="35" rx="3" fill="#74b9ff" fill-opacity="0.6" stroke="#0984e3" stroke-width="1.5"/>
    <text x="37" y="27" text-anchor="middle" font-size="10" fill="#0984e3">T6</text>
    <rect x="70" y="5" width="55" height="35" rx="3" fill="#a29bfe" fill-opacity="0.6" stroke="#6c5ce7" stroke-width="1.5"/>
    <text x="97" y="27" text-anchor="middle" font-size="10" fill="#6c5ce7">T7</text>
    <rect x="130" y="5" width="55" height="35" rx="3" fill="#fd79a8" fill-opacity="0.6" stroke="#e84393" stroke-width="1.5"/>
    <text x="157" y="27" text-anchor="middle" font-size="10" fill="#e84393">T8</text>
    <rect x="10" y="45" width="55" height="35" rx="3" fill="#55efc4" fill-opacity="0.6" stroke="#00b894" stroke-width="1.5"/>
    <text x="37" y="67" text-anchor="middle" font-size="10" fill="#00b894">T9</text>
    <rect x="70" y="45" width="55" height="35" rx="3" fill="#ffeaa7" fill-opacity="0.6" stroke="#fdcb6e" stroke-width="1.5"/>
    <text x="97" y="67" text-anchor="middle" font-size="10" fill="#333">T10</text>
    <rect x="130" y="45" width="55" height="35" rx="3" fill="#fab1a0" fill-opacity="0.6" stroke="#e17055" stroke-width="1.5"/>
    <text x="157" y="67" text-anchor="middle" font-size="10" fill="#e17055">T11</text>
  </g>

  <!-- Arrows showing spatial + temporal structure -->
  <text x="110" y="270" text-anchor="middle" font-size="10" fill="#888">每个 tile 含 block_h &times; block_w 个 token</text>
  <text x="110" y="285" text-anchor="middle" font-size="10" fill="#888">两层 = 两个时间步</text>

  <!-- Right: sparse attention mask -->
  <text x="510" y="50" text-anchor="middle" font-size="12" fill="#666">稀疏 Attention Mask</text>

  <g transform="translate(370,60)">
    <!-- Grid 6x6 (tiles T0-T11 simplified to 6 for one frame) -->
    <!-- Row/column headers -->
    <text x="15" y="-5" text-anchor="middle" font-size="9" fill="#888">T0</text>
    <text x="55" y="-5" text-anchor="middle" font-size="9" fill="#888">T1</text>
    <text x="95" y="-5" text-anchor="middle" font-size="9" fill="#888">T2</text>
    <text x="135" y="-5" text-anchor="middle" font-size="9" fill="#888">T3</text>
    <text x="175" y="-5" text-anchor="middle" font-size="9" fill="#888">T6</text>
    <text x="215" y="-5" text-anchor="middle" font-size="9" fill="#888">T7</text>

    <text x="-8" y="20" text-anchor="end" font-size="9" fill="#888">T0</text>
    <text x="-8" y="56" text-anchor="end" font-size="9" fill="#888">T1</text>
    <text x="-8" y="92" text-anchor="end" font-size="9" fill="#888">T2</text>
    <text x="-8" y="128" text-anchor="end" font-size="9" fill="#888">T3</text>
    <text x="-8" y="164" text-anchor="end" font-size="9" fill="#888">T6</text>
    <text x="-8" y="200" text-anchor="end" font-size="9" fill="#888">T7</text>

    <!-- Diagonal: self-attention (always) -->
    <rect x="0" y="3" width="30" height="30" fill="#0984e3"/>
    <rect x="40" y="39" width="30" height="30" fill="#0984e3"/>
    <rect x="80" y="75" width="30" height="30" fill="#0984e3"/>
    <rect x="120" y="111" width="30" height="30" fill="#0984e3"/>
    <rect x="160" y="147" width="30" height="30" fill="#0984e3"/>
    <rect x="200" y="183" width="30" height="30" fill="#0984e3"/>

    <!-- Spatial neighbors -->
    <rect x="40" y="3" width="30" height="30" fill="#74b9ff"/>
    <rect x="0" y="39" width="30" height="30" fill="#74b9ff"/>
    <rect x="80" y="39" width="30" height="30" fill="#74b9ff"/>
    <rect x="40" y="75" width="30" height="30" fill="#74b9ff"/>
    <rect x="120" y="3" width="30" height="30" fill="#74b9ff"/>
    <rect x="0" y="111" width="30" height="30" fill="#74b9ff"/>
    <rect x="200" y="147" width="30" height="30" fill="#74b9ff"/>
    <rect x="160" y="183" width="30" height="30" fill="#74b9ff"/>

    <!-- Temporal neighbors (same spatial, next time) -->
    <rect x="160" y="3" width="30" height="30" fill="#55efc4" fill-opacity="0.7"/>
    <rect x="200" y="39" width="30" height="30" fill="#55efc4" fill-opacity="0.7"/>
    <rect x="0" y="147" width="30" height="30" fill="#55efc4" fill-opacity="0.7"/>
    <rect x="40" y="183" width="30" height="30" fill="#55efc4" fill-opacity="0.7"/>

    <!-- Empty cells (skipped) -->
    <rect x="80" y="3" width="30" height="30" fill="#f5f5f5" stroke="#ddd" stroke-width="0.5"/>
    <rect x="120" y="39" width="30" height="30" fill="#f5f5f5" stroke="#ddd" stroke-width="0.5"/>
    <rect x="0" y="75" width="30" height="30" fill="#f5f5f5" stroke="#ddd" stroke-width="0.5"/>
    <rect x="120" y="75" width="30" height="30" fill="#f5f5f5" stroke="#ddd" stroke-width="0.5"/>
    <rect x="80" y="111" width="30" height="30" fill="#f5f5f5" stroke="#ddd" stroke-width="0.5"/>
    <rect x="80" y="147" width="30" height="30" fill="#f5f5f5" stroke="#ddd" stroke-width="0.5"/>
    <rect x="120" y="147" width="30" height="30" fill="#f5f5f5" stroke="#ddd" stroke-width="0.5"/>
    <rect x="80" y="183" width="30" height="30" fill="#f5f5f5" stroke="#ddd" stroke-width="0.5"/>
    <rect x="120" y="183" width="30" height="30" fill="#f5f5f5" stroke="#ddd" stroke-width="0.5"/>

    <!-- Grid lines -->
    <rect x="0" y="3" width="230" height="210" fill="none" stroke="#999" stroke-width="1"/>
  </g>

  <!-- Legend -->
  <g transform="translate(370,280)">
    <rect x="0" y="0" width="14" height="14" fill="#0984e3"/>
    <text x="20" y="12" font-size="10" fill="#666">自身</text>
    <rect x="65" y="0" width="14" height="14" fill="#74b9ff"/>
    <text x="85" y="12" font-size="10" fill="#666">空间邻居</text>
    <rect x="160" y="0" width="14" height="14" fill="#55efc4"/>
    <text x="180" y="12" font-size="10" fill="#666">时间邻居</text>
    <rect x="250" y="0" width="14" height="14" fill="#f5f5f5" stroke="#ddd"/>
    <text x="270" y="12" font-size="10" fill="#666">跳过</text>
  </g>
</svg>
