<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300">
<style>
  text{font-family:system-ui,sans-serif;font-size:12px;fill:#23272f}
  .title{font-size:12px;font-weight:700}
  .label{font-size:11px;fill:#6b7280}
  .code{font-family:ui-monospace,monospace;font-size:10.5px}
</style>
<text x="350" y="18" text-anchor="middle" class="title">Sequence Parallelism: Ulysses vs Ring Attention</text>

<!-- Ulysses (left) -->
<rect x="20" y="35" width="320" height="245" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
<text x="180" y="55" text-anchor="middle" class="title" fill="#2563eb">Ulysses (DeepSpeed)</text>

<rect x="35" y="68" width="65" height="28" rx="3" fill="#dbeafe" stroke="#93c5fd"/>
<text x="67" y="86" text-anchor="middle" class="code" font-size="10">GPU 0</text>
<rect x="110" y="68" width="65" height="28" rx="3" fill="#dbeafe" stroke="#93c5fd"/>
<text x="142" y="86" text-anchor="middle" class="code" font-size="10">GPU 1</text>
<rect x="185" y="68" width="65" height="28" rx="3" fill="#dbeafe" stroke="#93c5fd"/>
<text x="217" y="86" text-anchor="middle" class="code" font-size="10">GPU 2</text>
<rect x="260" y="68" width="65" height="28" rx="3" fill="#dbeafe" stroke="#93c5fd"/>
<text x="292" y="86" text-anchor="middle" class="code" font-size="10">GPU 3</text>

<text x="35" y="114" class="code" font-size="10">Q[:L/4] K[:L/4] V[:L/4]</text>

<text x="180" y="135" text-anchor="middle" class="label" fill="#2563eb">&#x2193; All-to-All &#x2193;</text>
<rect x="35" y="142" width="290" height="22" rx="3" fill="#bbf7d0" stroke="#86efac"/>
<text x="180" y="157" text-anchor="middle" class="code" font-size="10">Each GPU gets full seq, H/4 heads</text>

<text x="180" y="180" text-anchor="middle" class="label">FlashAttention (full seq, partial heads)</text>

<text x="180" y="200" text-anchor="middle" class="label" fill="#2563eb">&#x2193; All-to-All &#x2193;</text>
<rect x="35" y="207" width="290" height="22" rx="3" fill="#fde68a" stroke="#fde047"/>
<text x="180" y="222" text-anchor="middle" class="code" font-size="10">Each GPU gets L/4 output, all heads</text>

<text x="35" y="248" class="label">Comm: 2&#xd7; All-to-All (Q/K/V + O)</text>
<text x="35" y="265" class="label">Compute: full seq &#xd7; H/P heads per GPU</text>

<!-- Ring Attention (right) -->
<rect x="370" y="35" width="310" height="245" rx="5" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2"/>
<text x="525" y="55" text-anchor="middle" class="title" fill="#16a34a">Ring Attention</text>

<rect x="385" y="68" width="65" height="28" rx="3" fill="#dbeafe" stroke="#93c5fd"/>
<text x="417" y="86" text-anchor="middle" class="code" font-size="10">GPU 0</text>
<rect x="460" y="68" width="65" height="28" rx="3" fill="#dbeafe" stroke="#93c5fd"/>
<text x="492" y="86" text-anchor="middle" class="code" font-size="10">GPU 1</text>
<rect x="535" y="68" width="65" height="28" rx="3" fill="#dbeafe" stroke="#93c5fd"/>
<text x="567" y="86" text-anchor="middle" class="code" font-size="10">GPU 2</text>
<rect x="610" y="68" width="55" height="28" rx="3" fill="#dbeafe" stroke="#93c5fd"/>
<text x="637" y="86" text-anchor="middle" class="code" font-size="9">GPU 3</text>

<text x="385" y="114" class="code" font-size="10">Q[:L/4]  (fixed on GPU)</text>
<text x="385" y="130" class="code" font-size="10">KV[:L/4] &#x2192; ring pass &#x2192;</text>

<rect x="385" y="140" width="280" height="50" rx="3" fill="#bbf7d0" stroke="#86efac"/>
<text x="395" y="158" class="code" font-size="10">Round 0: FA(Q_local, KV_local)</text>
<text x="395" y="175" class="code" font-size="10">Round k: FA(Q_local, KV_from_GPU_k)</text>

<text x="525" y="205" text-anchor="middle" class="label" fill="#16a34a">KV blocks circulate in a ring</text>
<text x="525" y="220" text-anchor="middle" class="label" fill="#16a34a">P-1 rounds, comm overlaps compute</text>

<text x="385" y="248" class="label">Comm: P-1 &#xd7; send/recv KV blocks</text>
<text x="385" y="265" class="label">Compute: full seq &#xd7; all heads per GPU</text>

<text x="350" y="296" text-anchor="middle" font-size="10.5" fill="#aaa" font-style="italic">data-source: illustrative</text>
</svg>
