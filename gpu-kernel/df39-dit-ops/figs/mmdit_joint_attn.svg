<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280">
<style>
  text{font-family:system-ui,sans-serif;font-size:12px;fill:#23272f}
  .title{font-size:12px;font-weight:700}
  .label{font-size:11px;fill:#6b7280}
  .code{font-family:ui-monospace,monospace;font-size:10.5px}
</style>
<text x="350" y="18" text-anchor="middle" class="title">MMDiT Joint Attention vs Cross Attention</text>

<!-- Cross Attention (left) -->
<rect x="20" y="35" width="310" height="220" rx="5" fill="#fef2f2" stroke="#ef4444" stroke-width="1.2"/>
<text x="175" y="55" text-anchor="middle" class="title" fill="#dc2626">Cross Attention (UNet-style)</text>

<rect x="35" y="68" width="90" height="28" rx="3" fill="#dbeafe" stroke="#93c5fd"/>
<text x="80" y="87" text-anchor="middle" class="code" font-size="10">Img Q</text>
<rect x="140" y="68" width="90" height="28" rx="3" fill="#bbf7d0" stroke="#86efac"/>
<text x="185" y="87" text-anchor="middle" class="code" font-size="10">Text KV</text>
<rect x="245" y="68" width="70" height="28" rx="3" fill="#fde68a" stroke="#fde047"/>
<text x="280" y="87" text-anchor="middle" class="code" font-size="10">Attn 1</text>

<rect x="35" y="105" width="90" height="28" rx="3" fill="#dbeafe" stroke="#93c5fd"/>
<text x="80" y="124" text-anchor="middle" class="code" font-size="10">Img QKV</text>
<rect x="245" y="105" width="70" height="28" rx="3" fill="#fde68a" stroke="#fde047"/>
<text x="280" y="124" text-anchor="middle" class="code" font-size="10">Attn 2</text>

<text x="35" y="155" class="label">S&#x2081; = Q_img &#xb7; K_txt&#x1D40;: [4K, 77]</text>
<text x="35" y="172" class="label">S&#x2082; = Q_img &#xb7; K_img&#x1D40;: [4K, 4K]</text>
<text x="35" y="192" class="code" fill="#dc2626" font-size="10.5">2 separate attention calls</text>
<text x="35" y="208" class="code" fill="#dc2626" font-size="10.5">2 sets of Q/K/V projections</text>
<text x="35" y="228" class="label">Total FLOP: 2&#xd7;(2N&#xb2;d + 2Nd&#xb2;)</text>
<text x="35" y="244" class="label">No text&#x2194;text interaction</text>

<!-- Joint Attention (right) -->
<rect x="370" y="35" width="310" height="220" rx="5" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2"/>
<text x="525" y="55" text-anchor="middle" class="title" fill="#16a34a">Joint Attention (MMDiT)</text>

<rect x="385" y="68" width="90" height="28" rx="3" fill="#dbeafe" stroke="#93c5fd"/>
<text x="430" y="87" text-anchor="middle" class="code" font-size="10">Img QKV</text>
<rect x="490" y="68" width="90" height="28" rx="3" fill="#bbf7d0" stroke="#86efac"/>
<text x="535" y="87" text-anchor="middle" class="code" font-size="10">Txt QKV</text>
<text x="600" y="87" class="code" font-size="10">concat</text>

<rect x="385" y="105" width="200" height="28" rx="3" fill="#fde68a" stroke="#fde047"/>
<text x="485" y="124" text-anchor="middle" class="code" font-size="10">Single FlashAttention</text>

<text x="385" y="155" class="label">S = [Q_img; Q_txt] &#xb7; [K_img; K_txt]&#x1D40;</text>
<text x="385" y="172" class="label">  = [(4K+77), (4K+77)]</text>
<text x="385" y="192" class="code" fill="#16a34a" font-size="10.5">1 attention call (simpler)</text>
<text x="385" y="208" class="code" fill="#16a34a" font-size="10.5">Bidirectional txt&#x2194;img</text>
<text x="385" y="228" class="label">Overhead: 77 extra tokens &#x2248; +4%</text>
<text x="385" y="244" class="label">Text tokens see each other too</text>

<text x="350" y="275" text-anchor="middle" font-size="10.5" fill="#aaa" font-style="italic">data-source: illustrative</text>
</svg>
