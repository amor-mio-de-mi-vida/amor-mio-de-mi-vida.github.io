<svg viewBox="0 0 600 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="13">
  <text x="300" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">序列长度 vs Attention 时间占比</text>
  <text x="300" y="40" text-anchor="middle" font-size="11" fill="#999">illustrative, computed from O(N^2 d) vs O(NLd) scaling</text>

  <!-- Axes -->
  <line x1="80" y1="260" x2="560" y2="260" stroke="#333" stroke-width="1.5"/>
  <line x1="80" y1="260" x2="80" y2="55" stroke="#333" stroke-width="1.5"/>

  <!-- Y axis labels -->
  <text x="72" y="260" text-anchor="end" font-size="11" fill="#666">0%</text>
  <text x="72" y="219" text-anchor="end" font-size="11" fill="#666">20%</text>
  <text x="72" y="178" text-anchor="end" font-size="11" fill="#666">40%</text>
  <text x="72" y="137" text-anchor="end" font-size="11" fill="#666">60%</text>
  <text x="72" y="96" text-anchor="end" font-size="11" fill="#666">80%</text>
  <text x="72" y="60" text-anchor="end" font-size="11" fill="#666">100%</text>

  <!-- Y grid -->
  <line x1="80" y1="219" x2="560" y2="219" stroke="#eee" stroke-width="1"/>
  <line x1="80" y1="178" x2="560" y2="178" stroke="#eee" stroke-width="1"/>
  <line x1="80" y1="137" x2="560" y2="137" stroke="#eee" stroke-width="1"/>
  <line x1="80" y1="96" x2="560" y2="96" stroke="#eee" stroke-width="1"/>

  <!-- X axis labels (log scale positions) -->
  <text x="130" y="278" text-anchor="middle" font-size="11" fill="#666">256</text>
  <text x="220" y="278" text-anchor="middle" font-size="11" fill="#666">1K</text>
  <text x="320" y="278" text-anchor="middle" font-size="11" fill="#666">4K</text>
  <text x="420" y="278" text-anchor="middle" font-size="11" fill="#666">16K</text>
  <text x="520" y="278" text-anchor="middle" font-size="11" fill="#666">64K</text>

  <!-- Axis titles -->
  <text x="320" y="300" text-anchor="middle" font-size="12" fill="#555">序列长度 N (tokens)</text>
  <text x="30" y="160" text-anchor="middle" font-size="12" fill="#555" transform="rotate(-90,30,160)">Attention 时间占比</text>

  <!-- Data curve: attention fraction grows with N -->
  <!-- At N=256: ~8%, N=1K: ~22%, N=4K: ~45%, N=16K: ~62%, N=64K: ~78% -->
  <polyline points="130,244 220,215 320,168 420,133 520,100"
    fill="none" stroke="#e17055" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Data points -->
  <circle cx="130" cy="244" r="4" fill="#e17055"/>
  <circle cx="220" cy="215" r="4" fill="#e17055"/>
  <circle cx="320" cy="168" r="4" fill="#e17055"/>
  <circle cx="420" cy="133" r="4" fill="#e17055"/>
  <circle cx="520" cy="100" r="4" fill="#e17055"/>

  <!-- Labels on points -->
  <text x="145" y="240" font-size="10" fill="#e17055">~8%</text>
  <text x="235" y="211" font-size="10" fill="#e17055">~22%</text>
  <text x="335" y="162" font-size="10" fill="#e17055">~45%</text>
  <text x="435" y="127" font-size="10" fill="#e17055">~62%</text>
  <text x="535" y="95" font-size="10" fill="#e17055">~78%</text>

  <!-- Annotation -->
  <rect x="340" y="55" width="200" height="35" rx="4" fill="#ffeaa7" fill-opacity="0.5" stroke="#fdcb6e"/>
  <text x="440" y="70" text-anchor="middle" font-size="11" fill="#333">视频 64K tokens:</text>
  <text x="440" y="84" text-anchor="middle" font-size="11" fill="#e17055">attention 占 ~78% 时间</text>
</svg>
