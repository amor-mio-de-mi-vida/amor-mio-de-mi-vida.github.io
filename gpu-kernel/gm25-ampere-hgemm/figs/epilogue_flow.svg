<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', sans-serif">
  <defs>
    <marker id="ea" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#555"/>
    </marker>
  </defs>
  <style>
    .title { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
    .box { rx: 6; stroke-width: 1.5; }
    .reg { fill: #E8F4E8; stroke: #009E73; }
    .smem { fill: #E8F0FA; stroke: #56B4E9; }
    .gmem { fill: #FFF3E0; stroke: #E69F00; }
    .fuse { fill: #FDE8E8; stroke: #D55E00; }
    .boxlabel { font-size: 12px; font-weight: 600; fill: #1a1a1a; text-anchor: middle; }
    .detail { font-size: 10px; fill: #666; text-anchor: middle; }
    .arrow { stroke: #555; stroke-width: 1.5; fill: none; marker-end: url(#ea); }
    .label { font-size: 11px; fill: #4a4a4a; }
  </style>

  <text x="360" y="24" text-anchor="middle" class="title">Epilogue 数据流：FP32 累加器 → FP16 全局内存</text>

  <!-- Stage 1: FP32 accumulators in registers -->
  <rect class="box reg" x="30" y="60" width="130" height="60"/>
  <text class="boxlabel" x="95" y="82">FP32 累加器</text>
  <text class="detail" x="95" y="98">寄存器（每线程若干）</text>
  <text class="detail" x="95" y="112">每 warp 持有 C 分块</text>

  <!-- Arrow 1→2 -->
  <line class="arrow" x1="160" y1="90" x2="195" y2="90"/>
  <text x="178" y="82" font-size="9" fill="#666">cvt</text>

  <!-- Stage 2: Optional fusion -->
  <rect class="box fuse" x="200" y="50" width="120" height="80"/>
  <text class="boxlabel" x="260" y="72">融合操作</text>
  <text class="detail" x="260" y="88">+ bias (per-col)</text>
  <text class="detail" x="260" y="102">+ activation</text>
  <text class="detail" x="260" y="116">(ReLU / GeLU)</text>

  <!-- Arrow 2→3 -->
  <line class="arrow" x1="320" y1="90" x2="355" y2="90"/>
  <text x="338" y="82" font-size="9" fill="#666">FP16</text>

  <!-- Stage 3: Shared memory -->
  <rect class="box smem" x="360" y="60" width="130" height="60"/>
  <text class="boxlabel" x="425" y="82">共享内存</text>
  <text class="detail" x="425" y="98">BM x BN tile</text>
  <text class="detail" x="425" y="112">连续排列</text>

  <!-- Arrow 3→4 -->
  <line class="arrow" x1="490" y1="90" x2="525" y2="90"/>
  <text x="508" y="82" font-size="9" fill="#666">合并写</text>

  <!-- Stage 4: Global memory -->
  <rect class="box gmem" x="530" y="60" width="140" height="60"/>
  <text class="boxlabel" x="600" y="82">全局内存 (C)</text>
  <text class="detail" x="600" y="98">128B 合并事务</text>
  <text class="detail" x="600" y="112">带宽利用率高</text>

  <!-- Why smem? annotation -->
  <rect x="110" y="155" width="500" height="70" rx="6" fill="#f5f5f3" stroke="#e4e4e0"/>
  <text x="360" y="176" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">为什么需要经过共享内存？</text>
  <text x="360" y="196" text-anchor="middle" font-size="11" fill="#4a4a4a">MMA 的输出分布在 warp 的 32 个线程中，每线程持有不连续的 C 元素。</text>
  <text x="360" y="212" text-anchor="middle" font-size="11" fill="#4a4a4a">逐元素直接写：一条存储指令触及 8 个 32B sector，只用到 64B（25%）；</text>
  <text x="360" y="228" text-anchor="middle" font-size="11" fill="#4a4a4a">先写 smem 再由全 block 按行连续写回，sector 利用率可接近 100%。</text>

  <!-- Legend -->
  <rect x="100" y="240" width="12" height="10" rx="2" fill="#E8F4E8" stroke="#009E73"/>
  <text x="116" y="249" class="label">寄存器</text>
  <rect x="190" y="240" width="12" height="10" rx="2" fill="#FDE8E8" stroke="#D55E00"/>
  <text x="206" y="249" class="label">融合</text>
  <rect x="260" y="240" width="12" height="10" rx="2" fill="#E8F0FA" stroke="#56B4E9"/>
  <text x="276" y="249" class="label">共享内存</text>
  <rect x="360" y="240" width="12" height="10" rx="2" fill="#FFF3E0" stroke="#E69F00"/>
  <text x="376" y="249" class="label">全局内存</text>
</svg>
