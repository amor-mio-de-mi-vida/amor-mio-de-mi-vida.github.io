<svg viewBox="0 0 720 480" xmlns="http://www.w3.org/2000/svg" class="d-fig">
  <style>
    .d-label { font: 600 13px "Inter", sans-serif; fill: var(--ink, #1a1a1a); }
    .d-note  { font: 400 11px "Inter", sans-serif; fill: var(--ink-2, #4a4a4a); }
    .pat-box { rx: 5; stroke-width: 1.5; }
    .gpu-sm  { fill: #009E73; opacity: 0.2; stroke: #009E73; stroke-width: 1; rx: 3; }
    .data-sm { opacity: 0.25; rx: 2; }
    .comm-arr { stroke-width: 1.5; fill: none; }
  </style>

  <text x="360" y="24" text-anchor="middle" class="d-label">分布式并行通信模式全景</text>

  <!-- TP: Tensor Parallelism -->
  <rect x="20" y="45" width="330" height="130" fill="#E69F00" opacity="0.05" class="pat-box" stroke="#E69F00"/>
  <text x="185" y="66" text-anchor="middle" class="d-label" style="font-size:12px;fill:#E69F00">Tensor Parallelism (TP)</text>

  <g transform="translate(40, 78)">
    <rect x="0" y="0" width="50" height="25" class="gpu-sm"/>
    <text x="25" y="16" text-anchor="middle" class="d-note" style="font-size:8px">W₀</text>
    <rect x="60" y="0" width="50" height="25" class="gpu-sm"/>
    <text x="85" y="16" text-anchor="middle" class="d-note" style="font-size:8px">W₁</text>
    <rect x="120" y="0" width="50" height="25" class="gpu-sm"/>
    <text x="145" y="16" text-anchor="middle" class="d-note" style="font-size:8px">W₂</text>
    <rect x="180" y="0" width="50" height="25" class="gpu-sm"/>
    <text x="205" y="16" text-anchor="middle" class="d-note" style="font-size:8px">W₃</text>

    <!-- AllReduce arrow -->
    <line x1="0" y1="35" x2="230" y2="35" stroke="#E69F00" stroke-width="2"/>
    <text x="115" y="50" text-anchor="middle" class="d-note" style="font-size:9px;fill:#E69F00">AllReduce / ReduceScatter</text>

    <text x="0" y="70" class="d-note" style="font-size:10px">权重按列/行切分，每层后通信</text>
    <text x="0" y="84" class="d-note" style="font-size:10px;fill:#E69F00">节点内 NVLink，低延迟</text>
  </g>

  <!-- SP: Sequence Parallelism -->
  <rect x="370" y="45" width="330" height="130" fill="#56B4E9" opacity="0.05" class="pat-box" stroke="#56B4E9"/>
  <text x="535" y="66" text-anchor="middle" class="d-label" style="font-size:12px;fill:#56B4E9">Sequence Parallelism (SP)</text>

  <g transform="translate(390, 78)">
    <rect x="0" y="0" width="50" height="25" fill="#56B4E9" class="data-sm" stroke="#56B4E9" stroke-width="1"/>
    <text x="25" y="16" text-anchor="middle" class="d-note" style="font-size:8px">Seq₀</text>
    <rect x="60" y="0" width="50" height="25" fill="#56B4E9" class="data-sm" stroke="#56B4E9" stroke-width="1"/>
    <text x="85" y="16" text-anchor="middle" class="d-note" style="font-size:8px">Seq₁</text>
    <rect x="120" y="0" width="50" height="25" fill="#56B4E9" class="data-sm" stroke="#56B4E9" stroke-width="1"/>
    <text x="145" y="16" text-anchor="middle" class="d-note" style="font-size:8px">Seq₂</text>
    <rect x="180" y="0" width="50" height="25" fill="#56B4E9" class="data-sm" stroke="#56B4E9" stroke-width="1"/>
    <text x="205" y="16" text-anchor="middle" class="d-note" style="font-size:8px">Seq₃</text>

    <line x1="0" y1="35" x2="230" y2="35" stroke="#56B4E9" stroke-width="2"/>
    <text x="115" y="50" text-anchor="middle" class="d-note" style="font-size:9px;fill:#56B4E9">AllGather / ReduceScatter</text>

    <text x="0" y="70" class="d-note" style="font-size:10px">序列维度切分（LayerNorm、Dropout）</text>
    <text x="0" y="84" class="d-note" style="font-size:10px;fill:#56B4E9">与 TP 配合，减少激活内存</text>
  </g>

  <!-- EP: Expert Parallelism -->
  <rect x="20" y="190" width="330" height="130" fill="#009E73" opacity="0.05" class="pat-box" stroke="#009E73"/>
  <text x="185" y="211" text-anchor="middle" class="d-label" style="font-size:12px;fill:#009E73">Expert Parallelism (EP)</text>

  <g transform="translate(40, 223)">
    <rect x="0" y="0" width="50" height="25" class="gpu-sm"/>
    <text x="25" y="16" text-anchor="middle" class="d-note" style="font-size:8px">E₀₋₁</text>
    <rect x="60" y="0" width="50" height="25" class="gpu-sm"/>
    <text x="85" y="16" text-anchor="middle" class="d-note" style="font-size:8px">E₂₋₃</text>
    <rect x="120" y="0" width="50" height="25" class="gpu-sm"/>
    <text x="145" y="16" text-anchor="middle" class="d-note" style="font-size:8px">E₄₋₅</text>
    <rect x="180" y="0" width="50" height="25" class="gpu-sm"/>
    <text x="205" y="16" text-anchor="middle" class="d-note" style="font-size:8px">E₆₋₇</text>

    <line x1="0" y1="35" x2="230" y2="35" stroke="#009E73" stroke-width="2"/>
    <text x="115" y="50" text-anchor="middle" class="d-note" style="font-size:9px;fill:#009E73">All-to-All（token dispatch/combine）</text>

    <text x="0" y="70" class="d-note" style="font-size:10px">MoE 专家分布在不同 GPU</text>
    <text x="0" y="84" class="d-note" style="font-size:10px;fill:#009E73">跨节点 All-to-All，流量不均衡</text>
  </g>

  <!-- PP: Pipeline Parallelism -->
  <rect x="370" y="190" width="330" height="130" fill="#D55E00" opacity="0.05" class="pat-box" stroke="#D55E00"/>
  <text x="535" y="211" text-anchor="middle" class="d-label" style="font-size:12px;fill:#D55E00">Pipeline Parallelism (PP)</text>

  <g transform="translate(390, 223)">
    <rect x="0" y="0" width="50" height="25" class="gpu-sm"/>
    <text x="25" y="16" text-anchor="middle" class="d-note" style="font-size:8px">L0-7</text>
    <text x="55" y="13" class="d-note" style="font-size:12px">→</text>
    <rect x="70" y="0" width="50" height="25" class="gpu-sm"/>
    <text x="95" y="16" text-anchor="middle" class="d-note" style="font-size:8px">L8-15</text>
    <text x="125" y="13" class="d-note" style="font-size:12px">→</text>
    <rect x="140" y="0" width="50" height="25" class="gpu-sm"/>
    <text x="165" y="16" text-anchor="middle" class="d-note" style="font-size:8px">L16-23</text>
    <text x="195" y="13" class="d-note" style="font-size:12px">→</text>
    <rect x="210" y="0" width="50" height="25" class="gpu-sm"/>
    <text x="235" y="16" text-anchor="middle" class="d-note" style="font-size:8px">L24-31</text>

    <text x="0" y="45" class="d-note" style="font-size:9px;fill:#D55E00">P2P Send/Recv（相邻 stage）</text>

    <text x="0" y="70" class="d-note" style="font-size:10px">模型按层切分，micro-batch 流水</text>
    <text x="0" y="84" class="d-note" style="font-size:10px;fill:#D55E00">通信量小，但 bubble 开销大</text>
  </g>

  <!-- CP: Context Parallelism -->
  <rect x="20" y="340" width="680" height="120" fill="#CC79A7" opacity="0.05" class="pat-box" stroke="#CC79A7"/>
  <text x="360" y="361" text-anchor="middle" class="d-label" style="font-size:12px;fill:#CC79A7">Context Parallelism (CP) — 长序列并行</text>

  <g transform="translate(40, 375)">
    <rect x="0" y="0" width="80" height="25" fill="#CC79A7" class="data-sm" stroke="#CC79A7" stroke-width="1"/>
    <text x="40" y="16" text-anchor="middle" class="d-note" style="font-size:9px">Ctx₀ (0-32K)</text>
    <rect x="90" y="0" width="80" height="25" fill="#CC79A7" class="data-sm" stroke="#CC79A7" stroke-width="1"/>
    <text x="130" y="16" text-anchor="middle" class="d-note" style="font-size:9px">Ctx₁ (32-64K)</text>
    <rect x="180" y="0" width="80" height="25" fill="#CC79A7" class="data-sm" stroke="#CC79A7" stroke-width="1"/>
    <text x="220" y="16" text-anchor="middle" class="d-note" style="font-size:9px">Ctx₂ (64-96K)</text>
    <rect x="270" y="0" width="80" height="25" fill="#CC79A7" class="data-sm" stroke="#CC79A7" stroke-width="1"/>
    <text x="310" y="16" text-anchor="middle" class="d-note" style="font-size:9px">Ctx₃ (96-128K)</text>

    <text x="380" y="16" class="d-note" style="font-size:10px">Ring Attention: KV 块在 GPU 间轮转</text>
    <text x="380" y="34" class="d-note" style="font-size:10px">Send/Recv (KV blocks) + 本地 attention</text>

    <text x="0" y="55" class="d-note" style="font-size:10px">上下文长度按 GPU 数切分；适合 128K+ 长序列训练</text>
    <text x="380" y="55" class="d-note" style="font-size:10px;fill:#CC79A7">通信与注意力计算高度重叠</text>
  </g>
</svg>
