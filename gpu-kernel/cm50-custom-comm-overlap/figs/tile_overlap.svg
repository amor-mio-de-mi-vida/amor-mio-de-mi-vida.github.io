<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" class="d-fig">
  <style>
    .d-label { font: 600 13px "Inter", sans-serif; fill: var(--ink, #1a1a1a); }
    .d-note  { font: 400 11px "Inter", sans-serif; fill: var(--ink-2, #4a4a4a); }
    .comp-bar { fill: #009E73; opacity: 0.5; rx: 3; }
    .comm-bar { fill: #56B4E9; opacity: 0.5; rx: 3; }
    .wait-bar { fill: #E69F00; opacity: 0.3; rx: 3; }
    .grid-line { stroke: var(--rule, #e4e4e0); stroke-width: 0.5; }
    .time-arr  { stroke: var(--ink-3, #8a8a86); stroke-width: 1; fill: none; marker-end: url(#ta); }
  </style>

  <defs>
    <marker id="ta" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="var(--ink-3,#8a8a86)"/>
    </marker>
  </defs>

  <text x="360" y="24" text-anchor="middle" class="d-label">Tile 级计算-通信重叠流水线</text>

  <!-- Time axis -->
  <path d="M100,285 L680,285" class="time-arr"/>
  <text x="690" y="289" class="d-note">时间 →</text>

  <!-- Labels -->
  <text x="85" y="65" text-anchor="end" class="d-label" style="font-size:11px">无重叠</text>
  <text x="85" y="185" text-anchor="end" class="d-label" style="font-size:11px">流水线</text>

  <!-- Non-overlapped (sequential) -->
  <g transform="translate(100, 40)">
    <text x="0" y="0" class="d-note" style="font-size:9px">Compute stream</text>
    <!-- All GEMM first -->
    <rect x="0" y="5" width="80" height="22" class="comp-bar"/>
    <text x="40" y="20" text-anchor="middle" class="d-note" style="font-size:8px">GEMM T0</text>
    <rect x="82" y="5" width="80" height="22" class="comp-bar"/>
    <text x="122" y="20" text-anchor="middle" class="d-note" style="font-size:8px">GEMM T1</text>
    <rect x="164" y="5" width="80" height="22" class="comp-bar"/>
    <text x="204" y="20" text-anchor="middle" class="d-note" style="font-size:8px">GEMM T2</text>
    <rect x="246" y="5" width="80" height="22" class="comp-bar"/>
    <text x="286" y="20" text-anchor="middle" class="d-note" style="font-size:8px">GEMM T3</text>

    <text x="0" y="45" class="d-note" style="font-size:9px">Comm stream</text>
    <!-- All comm after -->
    <rect x="328" y="35" width="60" height="22" class="comm-bar"/>
    <text x="358" y="50" text-anchor="middle" class="d-note" style="font-size:8px">AR T0</text>
    <rect x="390" y="35" width="60" height="22" class="comm-bar"/>
    <text x="420" y="50" text-anchor="middle" class="d-note" style="font-size:8px">AR T1</text>
    <rect x="452" y="35" width="60" height="22" class="comm-bar"/>
    <text x="482" y="50" text-anchor="middle" class="d-note" style="font-size:8px">AR T2</text>
    <rect x="514" y="35" width="60" height="22" class="comm-bar"/>
    <text x="544" y="50" text-anchor="middle" class="d-note" style="font-size:8px">AR T3</text>

    <!-- Total time bracket -->
    <line x1="0" y1="65" x2="574" y2="65" stroke="#D55E00" stroke-width="1.5"/>
    <text x="287" y="80" text-anchor="middle" class="d-note" style="font-size:10px;fill:#D55E00">T_total = T_compute + T_comm</text>
  </g>

  <!-- Overlapped (pipelined) -->
  <g transform="translate(100, 155)">
    <text x="0" y="0" class="d-note" style="font-size:9px">Compute stream</text>
    <rect x="0" y="5" width="80" height="22" class="comp-bar"/>
    <text x="40" y="20" text-anchor="middle" class="d-note" style="font-size:8px">GEMM T0</text>
    <rect x="82" y="5" width="80" height="22" class="comp-bar"/>
    <text x="122" y="20" text-anchor="middle" class="d-note" style="font-size:8px">GEMM T1</text>
    <rect x="164" y="5" width="80" height="22" class="comp-bar"/>
    <text x="204" y="20" text-anchor="middle" class="d-note" style="font-size:8px">GEMM T2</text>
    <rect x="246" y="5" width="80" height="22" class="comp-bar"/>
    <text x="286" y="20" text-anchor="middle" class="d-note" style="font-size:8px">GEMM T3</text>

    <text x="0" y="45" class="d-note" style="font-size:9px">Comm stream</text>
    <!-- Comm overlapped with next tile's compute -->
    <rect x="82" y="35" width="60" height="22" class="comm-bar"/>
    <text x="112" y="50" text-anchor="middle" class="d-note" style="font-size:8px">AR T0</text>
    <rect x="164" y="35" width="60" height="22" class="comm-bar"/>
    <text x="194" y="50" text-anchor="middle" class="d-note" style="font-size:8px">AR T1</text>
    <rect x="246" y="35" width="60" height="22" class="comm-bar"/>
    <text x="276" y="50" text-anchor="middle" class="d-note" style="font-size:8px">AR T2</text>
    <rect x="328" y="35" width="60" height="22" class="comm-bar"/>
    <text x="358" y="50" text-anchor="middle" class="d-note" style="font-size:8px">AR T3</text>

    <!-- Overlap zones -->
    <rect x="82" y="3" width="60" height="56" fill="#CC79A7" opacity="0.1" stroke="#CC79A7" stroke-width="1" rx="2" stroke-dasharray="3,2"/>
    <rect x="164" y="3" width="60" height="56" fill="#CC79A7" opacity="0.1" stroke="#CC79A7" stroke-width="1" rx="2" stroke-dasharray="3,2"/>
    <rect x="246" y="3" width="60" height="56" fill="#CC79A7" opacity="0.1" stroke="#CC79A7" stroke-width="1" rx="2" stroke-dasharray="3,2"/>

    <!-- Total time bracket -->
    <line x1="0" y1="65" x2="388" y2="65" stroke="#009E73" stroke-width="1.5"/>
    <text x="194" y="80" text-anchor="middle" class="d-note" style="font-size:10px;fill:#009E73">T_total ≈ T_compute + T_comm/N_tiles</text>

    <!-- Savings arrow -->
    <line x1="390" y1="30" x2="574" y2="30" stroke="#D55E00" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="482" y="26" text-anchor="middle" class="d-note" style="font-size:10px;fill:#D55E00">← 节省的时间 →</text>
  </g>

  <!-- Legend -->
  <g transform="translate(100, 300)">
    <rect x="0" y="0" width="16" height="12" class="comp-bar" rx="2"/>
    <text x="22" y="10" class="d-note" style="font-size:10px">GEMM 计算</text>
    <rect x="120" y="0" width="16" height="12" class="comm-bar" rx="2"/>
    <text x="142" y="10" class="d-note" style="font-size:10px">AllReduce 通信</text>
    <rect x="260" y="0" width="16" height="12" fill="#CC79A7" opacity="0.2" stroke="#CC79A7" stroke-width="1" rx="2"/>
    <text x="282" y="10" class="d-note" style="font-size:10px">重叠区域</text>
  </g>

  <text x="360" y="335" text-anchor="middle" class="d-note" style="font-size:10px">Flux / async-TP 的核心思想：T0 的 AllReduce 与 T1 的 GEMM 同时执行</text>
</svg>
