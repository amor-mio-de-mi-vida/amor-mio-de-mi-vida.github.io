<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" class="d-fig">
  <style>
    .d-label { font: 600 13px "Inter", sans-serif; fill: var(--ink, #1a1a1a); }
    .d-note  { font: 400 11px "Inter", sans-serif; fill: var(--ink-2, #4a4a4a); }
    .gpu-box { fill: #009E73; opacity: 0.15; stroke: #009E73; stroke-width: 1.5; rx: 4; }
    .read-arr { stroke: #56B4E9; stroke-width: 1.5; fill: none; marker-end: url(#oa); }
    .write-arr { stroke: #D55E00; stroke-width: 1.5; fill: none; marker-end: url(#oa2); }
    .phase-bg { opacity: 0.06; rx: 5; }
  </style>

  <defs>
    <marker id="oa" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#56B4E9"/>
    </marker>
    <marker id="oa2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#D55E00"/>
    </marker>
  </defs>

  <text x="360" y="24" text-anchor="middle" class="d-label">Custom AllReduce：One-shot vs Two-shot</text>

  <!-- One-shot (left) -->
  <rect x="20" y="45" width="330" height="306" fill="#56B4E9" class="phase-bg" stroke="#56B4E9" stroke-width="1"/>
  <text x="185" y="68" text-anchor="middle" class="d-label" style="font-size:12px;fill:#56B4E9">One-shot（全读取）</text>

  <g transform="translate(40, 85)">
    <!-- 4 GPUs -->
    <rect x="30" y="0" width="60" height="30" class="gpu-box"/>
    <text x="60" y="20" text-anchor="middle" class="d-note" style="font-size:10px">GPU 0</text>
    <rect x="120" y="0" width="60" height="30" class="gpu-box"/>
    <text x="150" y="20" text-anchor="middle" class="d-note" style="font-size:10px">GPU 1</text>
    <rect x="210" y="0" width="60" height="30" class="gpu-box"/>
    <text x="240" y="20" text-anchor="middle" class="d-note" style="font-size:10px">GPU 2</text>

    <!-- GPU 0 reads from all peers -->
    <path d="M60,30 L60,60" class="read-arr"/>
    <path d="M150,30 L80,60" class="read-arr"/>
    <path d="M240,30 L100,60" class="read-arr"/>

    <!-- Local sum -->
    <rect x="30" y="62" width="95" height="25" fill="#D55E00" opacity="0.15" stroke="#D55E00" stroke-width="1" rx="3"/>
    <text x="77" y="79" text-anchor="middle" class="d-note" style="font-size:9px">local reduce: Σ all</text>

    <text x="0" y="115" class="d-note" style="font-size:10px">每个 GPU 读取所有 peer 的数据</text>
    <text x="0" y="131" class="d-note" style="font-size:10px">本地求和 → 结果立即可用</text>

    <text x="0" y="160" class="d-label" style="font-size:11px;fill:#009E73">优点</text>
    <text x="0" y="176" class="d-note" style="font-size:10px">· 单次 kernel，最低延迟</text>
    <text x="0" y="192" class="d-note" style="font-size:10px">· 只在首尾各一次 barrier</text>

    <text x="0" y="215" class="d-label" style="font-size:11px;fill:#D55E00">缺点</text>
    <text x="0" y="231" class="d-note" style="font-size:10px">· 每 GPU 从 N−1 个 peer 各读 D</text>
    <text x="0" y="247" class="d-note" style="font-size:10px">· 每卡读入 (N−1)·D</text>
    <text x="0" y="263" class="d-note" style="font-size:10px;font-weight:600">vLLM（8 卡）：D &lt; 256 KB</text>
  </g>

  <!-- Two-shot (right) -->
  <rect x="370" y="45" width="330" height="306" fill="#D55E00" class="phase-bg" stroke="#D55E00" stroke-width="1"/>
  <text x="535" y="68" text-anchor="middle" class="d-label" style="font-size:12px;fill:#D55E00">Two-shot（RS + AG）</text>

  <g transform="translate(390, 85)">
    <!-- Phase 1: ReduceScatter -->
    <rect x="0" y="0" width="290" height="65" fill="#D55E00" opacity="0.08" stroke="#D55E00" stroke-width="1" rx="4"/>
    <text x="145" y="16" text-anchor="middle" class="d-label" style="font-size:10px;fill:#D55E00">Phase 1: ReduceScatter</text>

    <rect x="10" y="22" width="50" height="22" class="gpu-box" style="opacity:0.2"/>
    <text x="35" y="38" text-anchor="middle" class="d-note" style="font-size:8px">GPU 0</text>
    <rect x="70" y="22" width="50" height="22" class="gpu-box" style="opacity:0.2"/>
    <text x="95" y="38" text-anchor="middle" class="d-note" style="font-size:8px">GPU 1</text>
    <rect x="130" y="22" width="50" height="22" class="gpu-box" style="opacity:0.2"/>
    <text x="155" y="38" text-anchor="middle" class="d-note" style="font-size:8px">GPU 2</text>

    <text x="200" y="38" class="d-note" style="font-size:9px">→ 各得 1/N</text>
    <text x="200" y="52" class="d-note" style="font-size:9px">　 的 reduce</text>

    <!-- Phase 2: AllGather -->
    <rect x="0" y="75" width="290" height="50" fill="#56B4E9" opacity="0.08" stroke="#56B4E9" stroke-width="1" rx="4"/>
    <text x="145" y="91" text-anchor="middle" class="d-label" style="font-size:10px;fill:#56B4E9">Phase 2: AllGather</text>
    <text x="145" y="112" text-anchor="middle" class="d-note" style="font-size:9px">广播各自的 1/N → 全员得到完整结果</text>

    <text x="0" y="150" class="d-label" style="font-size:11px;fill:#009E73">优点</text>
    <text x="0" y="166" class="d-note" style="font-size:10px">· 每卡读入 2·(N−1)/N · D</text>
    <text x="0" y="182" class="d-note" style="font-size:10px">· 带宽最优（≈ ring AllReduce）</text>

    <text x="0" y="205" class="d-label" style="font-size:11px;fill:#D55E00">缺点</text>
    <text x="0" y="221" class="d-note" style="font-size:10px">· 两阶段之间多一次 barrier</text>
    <text x="0" y="237" class="d-note" style="font-size:10px">· 略高延迟（2 个 phase）</text>
    <text x="0" y="253" class="d-note" style="font-size:10px;font-weight:600">vLLM（8 卡）：D ≥ 256 KB</text>
  </g>

  <!-- Bottom comparison -->
  <text x="360" y="370" text-anchor="middle" class="d-note" style="font-size:10px">实际系统（如 vLLM 的 custom all-reduce）按卡数和消息大小选择：小消息 one-shot，大消息 two-shot</text>
</svg>
