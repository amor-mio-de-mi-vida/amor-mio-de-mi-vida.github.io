<text x="620" y="108" text-anchor="middle" class="code" font-size="9" fill="#dc2626">map_3</text>

<!-- NVLink connections -->
<line x1="210" y1="80" x2="260" y2="80" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,3"/>
<line x1="440" y1="80" x2="490" y2="80" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,3"/>

<!-- Process flow -->
<rect x="30" y="145" width="640" height="100" rx="5" fill="#f9fafb" stroke="#d1d5db"/>
<text x="350" y="165" text-anchor="middle" class="title">IPC 设置流程</text>
<text x="45" y="185" class="code" fill="#2563eb">1. cudaIpcGetMemHandle(&amp;handle, buf_local)</text>
<text x="425" y="185" class="label">导出本地 buffer 的 IPC 句柄</text>
<text x="45" y="205" class="code" fill="#2563eb">2. MPI_Allgather(handle, ...)</text>
<text x="425" y="205" class="label">所有 rank 交换 IPC 句柄</text>
<text x="45" y="225" class="code" fill="#2563eb">3. cudaIpcOpenMemHandle(&amp;ptr, handle[r])</text>
<text x="425" y="225" class="label">映射远端 buffer 到本地地址空间</text>
<text x="45" y="240" class="label" fill="#dc2626">map_r 是虚拟地址; load/store 经 NVLink 自动路由到远端 GPU 的物理显存</text>

<text x="350" y="258" text-anchor="middle" font-size="10.5" fill="#aaa" font-style="italic">data-source: illustrative</text>
</svg>
