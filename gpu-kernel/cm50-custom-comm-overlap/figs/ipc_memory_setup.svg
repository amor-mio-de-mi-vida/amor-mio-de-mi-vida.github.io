  .label{font-size:11px;fill:#6b7280}
  .code{font-family:ui-monospace,monospace;font-size:10.5px}
</style>
<text x="350" y="18" text-anchor="middle" class="title">IPC 共享内存: cudaIpcGetMemHandle / OpenMemHandle</text>

<!-- GPU 0 -->
<rect x="30" y="40" width="180" height="85" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/>
<text x="120" y="58" text-anchor="middle" class="title" fill="#2563eb">GPU 0</text>
<rect x="45" y="65" width="70" height="22" rx="3" fill="#93c5fd" stroke="#3b82f6"/>
<text x="80" y="80" text-anchor="middle" class="code" font-size="9">buf_0</text>
<rect x="125" y="65" width="70" height="22" rx="3" fill="#fecaca" stroke="#ef4444" stroke-dasharray="3,2"/>
<text x="160" y="80" text-anchor="middle" class="code" font-size="9" fill="#dc2626">map_1</text>
<rect x="45" y="93" width="70" height="22" rx="3" fill="#fecaca" stroke="#ef4444" stroke-dasharray="3,2"/>
<text x="80" y="108" text-anchor="middle" class="code" font-size="9" fill="#dc2626">map_2</text>
<rect x="125" y="93" width="70" height="22" rx="3" fill="#fecaca" stroke="#ef4444" stroke-dasharray="3,2"/>
<text x="160" y="108" text-anchor="middle" class="code" font-size="9" fill="#dc2626">map_3</text>

<!-- GPU 1 -->
<rect x="260" y="40" width="180" height="85" rx="5" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2"/>
<text x="350" y="58" text-anchor="middle" class="title" fill="#16a34a">GPU 1</text>
<rect x="275" y="65" width="70" height="22" rx="3" fill="#fecaca" stroke="#ef4444" stroke-dasharray="3,2"/>
<text x="310" y="80" text-anchor="middle" class="code" font-size="9" fill="#dc2626">map_0</text>
<rect x="355" y="65" width="70" height="22" rx="3" fill="#86efac" stroke="#22c55e"/>
<text x="390" y="80" text-anchor="middle" class="code" font-size="9">buf_1</text>
<rect x="275" y="93" width="70" height="22" rx="3" fill="#fecaca" stroke="#ef4444" stroke-dasharray="3,2"/>
<text x="310" y="108" text-anchor="middle" class="code" font-size="9" fill="#dc2626">map_2</text>
<rect x="355" y="93" width="70" height="22" rx="3" fill="#fecaca" stroke="#ef4444" stroke-dasharray="3,2"/>
<text x="390" y="108" text-anchor="middle" class="code" font-size="9" fill="#dc2626">map_3</text>

<!-- GPU 2 (abbreviated) -->
<rect x="490" y="40" width="180" height="85" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
<text x="580" y="58" text-anchor="middle" class="title" fill="#a16207">GPU 2</text>
<rect x="505" y="65" width="70" height="22" rx="3" fill="#fecaca" stroke="#ef4444" stroke-dasharray="3,2"/>
<text x="540" y="80" text-anchor="middle" class="code" font-size="9" fill="#dc2626">map_0</text>
<rect x="585" y="65" width="70" height="22" rx="3" fill="#fecaca" stroke="#ef4444" stroke-dasharray="3,2"/>
<text x="620" y="80" text-anchor="middle" class="code" font-size="9" fill="#dc2626">map_1</text>
<rect x="505" y="93" width="70" height="22" rx="3" fill="#fde68a" stroke="#f59e0b"/>
<text x="540" y="108" text-anchor="middle" class="code" font-size="9">buf_2</text>
