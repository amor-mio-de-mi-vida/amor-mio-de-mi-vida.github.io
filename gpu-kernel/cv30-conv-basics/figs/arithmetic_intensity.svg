<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260">
<style>
  text{font-family:system-ui,sans-serif;font-size:12px;fill:#23272f}
  .title{font-size:12px;font-weight:700}
  .label{font-size:11px;fill:#6b7280}
  .code{font-family:ui-monospace,monospace;font-size:10.5px}
</style>
<text x="350" y="18" text-anchor="middle" class="title">Arithmetic Intensity: Standard Conv vs Depthwise vs 1&#xd7;1</text>

<!-- Bars -->
<!-- 1x1 conv -->
<rect x="60" y="40" width="440" height="32" rx="4" fill="#dcfce7" stroke="#22c55e"/>
<text x="70" y="60" class="title" fill="#16a34a">1&#xd7;1 conv (C_in=256, C_out=256)</text>
<text x="510" y="60" class="code">I &#x2248; 128 FLOP/B</text>

<!-- 3x3 standard -->
<rect x="60" y="82" width="320" height="32" rx="4" fill="#eff6ff" stroke="#3b82f6"/>
<text x="70" y="102" class="title" fill="#2563eb">3&#xd7;3 standard (C_in=64, C_out=128)</text>
<text x="390" y="102" class="code">I &#x2248; 46 FLOP/B</text>

<!-- 3x3 depthwise -->
<rect x="60" y="124" width="28" height="32" rx="4" fill="#fef2f2" stroke="#ef4444"/>
<text x="70" y="144" class="title" fill="#dc2626">3&#xd7;3 depthwise</text>
<text x="200" y="144" class="code">I &#x2248; 4.5 FLOP/B</text>

<!-- Roofline marker -->
<line x1="250" y1="35" x2="250" y2="170" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="255" y="175" class="label" fill="#a16207">A100 roofline knee &#x2248; 40 FLOP/B</text>

<!-- Annotations -->
<rect x="60" y="190" width="620" height="55" rx="5" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="70" y="210" class="label">&#x2022; Left of the knee = <b>memory-bound</b>: depthwise conv benefits only from bandwidth</text>
<text x="70" y="228" class="label">&#x2022; Right of the knee = <b>compute-bound</b>: 1&#xd7;1 and standard 3&#xd7;3 can saturate Tensor Cores</text>

<text x="350" y="258" text-anchor="middle" font-size="10.5" fill="#aaa" font-style="italic">data-source: computed (I = 2&#xb7;C_out&#xb7;R&#xb7;S / (element size &#xb7; (1/C_in + 1/C_out)))</text>
</svg>
