<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280">
<style>
  text{font-family:system-ui,sans-serif;font-size:12px;fill:#23272f}
  .title{font-size:12px;font-weight:700}
  .label{font-size:11px;fill:#6b7280}
  .code{font-family:ui-monospace,monospace;font-size:10.5px}
</style>
<text x="350" y="18" text-anchor="middle" class="title">Arithmetic Intensity (FP16, ideal reuse, log scale)</text>

<!-- log axis: x = 60 + 193*log10(I) -->
<line x1="60" y1="166" x2="639" y2="166" stroke="#9ca3af"/>
<line x1="60" y1="162" x2="60" y2="170" stroke="#9ca3af"/><text x="60" y="182" text-anchor="middle" class="label">1</text>
<line x1="253" y1="162" x2="253" y2="170" stroke="#9ca3af"/><text x="253" y="182" text-anchor="middle" class="label">10</text>
<line x1="446" y1="162" x2="446" y2="170" stroke="#9ca3af"/><text x="446" y="182" text-anchor="middle" class="label">100</text>
<line x1="639" y1="162" x2="639" y2="170" stroke="#9ca3af"/><text x="639" y="182" text-anchor="middle" class="label">1000 FLOP/B</text>

<!-- 3x3 standard: I = 384 -->
<rect x="60" y="40" width="439" height="32" rx="4" fill="#eff6ff" stroke="#3b82f6"/>
<text x="70" y="60" class="title" fill="#2563eb">3&#xd7;3 standard (C_in=64, C_out=128)</text>
<text x="507" y="60" class="code">I &#x2248; 384</text>

<!-- 1x1: I = 128 -->
<rect x="60" y="82" width="407" height="32" rx="4" fill="#dcfce7" stroke="#22c55e"/>
<text x="70" y="102" class="title" fill="#16a34a">1&#xd7;1 conv (C_in=C_out=256)</text>
<text x="459" y="102" text-anchor="end" class="code">I &#x2248; 128</text>

<!-- depthwise: I = 4.5 -->
<rect x="60" y="124" width="126" height="32" rx="4" fill="#fef2f2" stroke="#ef4444"/>
<text x="70" y="144" class="title" fill="#dc2626">3&#xd7;3 depthwise</text>
<text x="194" y="144" class="code">I &#x2248; 4.5</text>

<!-- Roofline marker: 312 TF / 2.039 TB/s = 153 -> x = 482 -->
<line x1="482" y1="32" x2="482" y2="160" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="488" y="138" class="label" fill="#a16207">A100 FP16 TC knee</text>
<text x="488" y="152" class="label" fill="#a16207">&#x2248; 153 FLOP/B</text>

<!-- Annotations -->
<rect x="60" y="196" width="620" height="56" rx="5" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="70" y="216" class="label">&#x2022; Left of the knee = memory-bound: depthwise conv benefits only from bandwidth</text>
<text x="70" y="236" class="label">&#x2022; 1&#xd7;1 has no R&#xb7;S factor: 9&#xd7; lower than 3&#xd7;3 at equal channels, near the knee here</text>

<text x="350" y="272" text-anchor="middle" font-size="10.5" fill="#aaa" font-style="italic">data-source: computed, I = 2&#xb7;R&#xb7;S / (2 B &#xb7; (1/C_in + 1/C_out)); depthwise: 18 FLOP / 4 B; knee = 312 TFLOPS / 2.039 TB/s</text>
</svg>
