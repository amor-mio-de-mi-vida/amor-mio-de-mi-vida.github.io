<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280">
<style>
  text{font-family:system-ui,sans-serif;font-size:12px;fill:#23272f}
  .title{font-size:12px;font-weight:700}
  .label{font-size:11px;fill:#6b7280}
  .code{font-family:ui-monospace,monospace;font-size:10.5px}
  .box{rx:5;ry:5;stroke-width:1.2}
</style>
<text x="350" y="18" text-anchor="middle" class="title">wgrad: Large-K GEMM Requires Split-K</text>

<!-- GEMM shape illustration -->
<rect x="30" y="38" width="200" height="100" class="box" fill="#eff6ff" stroke="#3b82f6"/>
<text x="130" y="58" text-anchor="middle" class="title" fill="#2563eb">wgrad GEMM Shape</text>
<text x="50" y="78" class="code">M = C_out = 128</text>
<text x="50" y="95" class="code">N = C_in&#xb7;R&#xb7;S = 1152</text>
<text x="50" y="112" class="code">K = N&#xb7;P = 32&#xb7;3136</text>
<text x="50" y="128" class="label" fill="#dc2626">K = 100,352 &#x2192; large!</text>

<!-- Arrow -->
<text x="250" y="90" class="title" fill="#888">&#x2192;</text>

<!-- Split-K diagram -->
<rect x="280" y="38" width="400" height="210" class="box" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="480" y="58" text-anchor="middle" class="title">Split-K: divide K into S slices</text>

<!-- K slices -->
<rect x="300" y="70" width="70" height="40" rx="3" fill="#dbeafe" stroke="#93c5fd"/>
<text x="335" y="94" text-anchor="middle" class="code" font-size="9">K[0..25k]</text>
<rect x="380" y="70" width="70" height="40" rx="3" fill="#dbeafe" stroke="#93c5fd"/>
<text x="415" y="94" text-anchor="middle" class="code" font-size="9">K[25k..50k]</text>
<rect x="460" y="70" width="70" height="40" rx="3" fill="#dbeafe" stroke="#93c5fd"/>
<text x="495" y="94" text-anchor="middle" class="code" font-size="9">K[50k..75k]</text>
<rect x="540" y="70" width="70" height="40" rx="3" fill="#dbeafe" stroke="#93c5fd"/>
<text x="575" y="94" text-anchor="middle" class="code" font-size="9">K[75k..100k]</text>

<text x="300" y="130" class="label">Each slice &#x2192; partial GEMM on separate CTAs</text>

<!-- Reduce -->
<rect x="380" y="145" width="180" height="40" rx="5" fill="#fde68a" stroke="#f59e0b"/>
<text x="470" y="163" text-anchor="middle" class="code">Reduce: &#x2211; partial results</text>
<text x="470" y="178" text-anchor="middle" class="label">atomicAdd or 2nd kernel</text>

<line x1="335" y1="110" x2="420" y2="145" stroke="#93c5fd" stroke-width="1"/>
<line x1="415" y1="110" x2="445" y2="145" stroke="#93c5fd" stroke-width="1"/>
<line x1="495" y1="110" x2="495" y2="145" stroke="#93c5fd" stroke-width="1"/>
<line x1="575" y1="110" x2="530" y2="145" stroke="#93c5fd" stroke-width="1"/>

<!-- Output -->
<rect x="400" y="200" width="140" height="30" rx="4" fill="#dcfce7" stroke="#22c55e"/>
<text x="470" y="220" text-anchor="middle" class="code">dWeight [M, N]</text>
<line x1="470" y1="185" x2="470" y2="200" stroke="#22c55e" stroke-width="1.2" marker-end="url(#arr2)"/>

<defs><marker id="arr2" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
  <path d="M0,0 L6,2.5 L0,5" fill="#22c55e"/>
</marker></defs>
<text x="350" y="275" text-anchor="middle" font-size="10.5" fill="#aaa" font-style="italic">data-source: computed (example 3&#xd7;3 layer, C=128, batch=32, 56&#xd7;56)</text>
</svg>
