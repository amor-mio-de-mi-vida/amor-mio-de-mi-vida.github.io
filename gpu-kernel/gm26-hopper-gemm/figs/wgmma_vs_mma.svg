<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" class="d-fig">
  <style>
    .d-label { font: 600 13px "Inter", sans-serif; fill: var(--ink, #1a1a1a); }
    .d-note  { font: 400 11px "Inter", sans-serif; fill: var(--ink-2, #4a4a4a); }
    .d-code  { font: 400 11px "SF Mono", "Fira Code", monospace; fill: var(--ink, #1a1a1a); }
  </style>

  <text x="360" y="20" text-anchor="middle" class="d-label">Ampere mma.sync vs Hopper WGMMA：指令粒度对比</text>

  <!-- Ampere side -->
  <rect x="20" y="38" width="320" height="240" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
  <text x="180" y="58" text-anchor="middle" class="d-label" style="fill:#dc2626">Ampere: mma.sync m16×n8×k16</text>

  <!-- Small matrix tiles for mma.sync -->
  <g transform="translate(40, 70)">
    <!-- A tile 16×16 -->
    <rect x="0" y="0" width="48" height="96" rx="2" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="24" y="48" text-anchor="middle" class="d-code" style="font-size:9px">A</text>
    <text x="24" y="62" text-anchor="middle" class="d-note" style="font-size:9px">16×16</text>

    <!-- × -->
    <text x="58" y="52" text-anchor="middle" class="d-label">×</text>

    <!-- B tile 16×8 -->
    <rect x="68" y="20" width="80" height="48" rx="2" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="108" y="44" text-anchor="middle" class="d-code" style="font-size:9px">B  16×8</text>

    <!-- = -->
    <text x="160" y="52" text-anchor="middle" class="d-label">=</text>

    <!-- C tile 16×8 -->
    <rect x="172" y="20" width="80" height="48" rx="2" fill="#fde68a" stroke="#f59e0b"/>
    <text x="212" y="44" text-anchor="middle" class="d-code" style="font-size:9px">C  16×8</text>
  </g>

  <text x="180" y="190" text-anchor="middle" class="d-note">发射单位：1 warp (32 线程)</text>
  <text x="180" y="208" text-anchor="middle" class="d-note">A 操作数：寄存器（需要 ldmatrix 加载）</text>
  <text x="180" y="226" text-anchor="middle" class="d-note">每条指令 FLOP：16×8×16×2 = 4,096</text>
  <text x="180" y="244" text-anchor="middle" class="d-note">Swizzle：手动 XOR（代码 20+ 行）</text>
  <text x="180" y="262" text-anchor="middle" class="d-note">同步：cp.async + commit/wait</text>

  <!-- Hopper side -->
  <rect x="380" y="38" width="320" height="240" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
  <text x="540" y="58" text-anchor="middle" class="d-label" style="fill:#16a34a">Hopper: wgmma m64×n256×k16</text>

  <!-- Large matrix tiles for WGMMA -->
  <g transform="translate(400, 70)">
    <!-- A tile 64×16 -->
    <rect x="0" y="0" width="48" height="96" rx="2" fill="#bbf7d0" stroke="#86efac"/>
    <text x="24" y="44" text-anchor="middle" class="d-code" style="font-size:9px">A</text>
    <text x="24" y="58" text-anchor="middle" class="d-note" style="font-size:9px">64×16</text>
    <text x="24" y="72" text-anchor="middle" class="d-note" style="font-size:8px;fill:#16a34a">(SMEM)</text>

    <!-- × -->
    <text x="58" y="52" text-anchor="middle" class="d-label">×</text>

    <!-- B tile 16×256 -->
    <rect x="68" y="10" width="100" height="48" rx="2" fill="#bbf7d0" stroke="#86efac"/>
    <text x="118" y="34" text-anchor="middle" class="d-code" style="font-size:9px">B  16×256</text>
    <text x="118" y="48" text-anchor="middle" class="d-note" style="font-size:8px;fill:#16a34a">(REG)</text>

    <!-- = -->
    <text x="178" y="52" text-anchor="middle" class="d-label">=</text>

    <!-- C tile 64×256 -->
    <rect x="188" y="0" width="80" height="96" rx="2" fill="#fde68a" stroke="#f59e0b"/>
    <text x="228" y="44" text-anchor="middle" class="d-code" style="font-size:9px">C</text>
    <text x="228" y="58" text-anchor="middle" class="d-note" style="font-size:9px">64×256</text>
  </g>

  <text x="540" y="190" text-anchor="middle" class="d-note">发射单位：1 warpgroup (128 线程)</text>
  <text x="540" y="208" text-anchor="middle" class="d-note">A 操作数：SMEM 描述符（无需 ldmatrix）</text>
  <text x="540" y="226" text-anchor="middle" class="d-note" style="fill:#16a34a;font-weight:600">每条指令 FLOP：64×256×16×2 = 524,288</text>
  <text x="540" y="244" text-anchor="middle" class="d-note">Swizzle：TMA 自动（零代码）</text>
  <text x="540" y="262" text-anchor="middle" class="d-note">同步：mbarrier full/empty</text>

  <!-- 128x callout -->
  <rect x="310" y="136" width="60" height="30" rx="15" fill="#7c3aed" stroke="none"/>
  <text x="340" y="156" text-anchor="middle" style="font:700 14px 'Inter',sans-serif;fill:white">128×</text>

  <text x="360" y="295" text-anchor="middle" class="d-note" style="font-style:italic;fill:#aaa">data-source: PTX ISA 9.4 spec</text>
</svg>
