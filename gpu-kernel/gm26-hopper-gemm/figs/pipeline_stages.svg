<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', sans-serif">
  <style>
    .title { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
    .label { font-size: 11px; fill: #1a1a1a; }
    .sublabel { font-size: 10px; fill: #666; }
    .time { font-size: 9px; fill: #999; font-family: 'SF Mono', monospace; }
    .prod { fill: #009E73; opacity: 0.7; }
    .cons { fill: #0072B2; opacity: 0.7; }
    .wait { fill: #eee; stroke: #ccc; stroke-width: 0.5; }
    .bar-full { fill: #D55E00; }
    .bar-empty { fill: #CC79A7; }
  </style>

  <text x="360" y="24" text-anchor="middle" class="title">4-Stage 流水线：Producer / Consumer 时序</text>

  <!-- Timeline header -->
  <text x="40" y="55" class="label" font-weight="600">角色</text>
  <text x="120" y="55" class="sublabel">K-tile 0</text>
  <text x="240" y="55" class="sublabel">K-tile 1</text>
  <text x="360" y="55" class="sublabel">K-tile 2</text>
  <text x="480" y="55" class="sublabel">K-tile 3</text>
  <text x="600" y="55" class="sublabel">K-tile 4</text>

  <!-- Producer row -->
  <text x="40" y="90" class="label">Producer</text>
  <text x="40" y="103" class="sublabel">(1 warpgroup)</text>

  <rect x="110" y="72" width="100" height="28" rx="3" class="prod"/>
  <text x="160" y="90" text-anchor="middle" class="sublabel" fill="white">TMA s0</text>

  <rect x="230" y="72" width="100" height="28" rx="3" class="prod"/>
  <text x="280" y="90" text-anchor="middle" class="sublabel" fill="white">TMA s1</text>

  <rect x="350" y="72" width="100" height="28" rx="3" class="prod"/>
  <text x="400" y="90" text-anchor="middle" class="sublabel" fill="white">TMA s2</text>

  <rect x="470" y="72" width="100" height="28" rx="3" class="prod"/>
  <text x="520" y="90" text-anchor="middle" class="sublabel" fill="white">TMA s3</text>

  <rect x="590" y="72" width="100" height="28" rx="3" class="prod"/>
  <text x="640" y="90" text-anchor="middle" class="sublabel" fill="white">TMA s0</text>

  <!-- Full barrier indicators -->
  <g transform="translate(0,110)">
    <text x="40" y="15" class="sublabel">full[s]</text>
    <circle cx="210" cy="12" r="4" class="bar-full"/>
    <circle cx="330" cy="12" r="4" class="bar-full"/>
    <circle cx="450" cy="12" r="4" class="bar-full"/>
    <circle cx="570" cy="12" r="4" class="bar-full"/>
    <circle cx="690" cy="12" r="4" class="bar-full"/>
    <text x="215" y="15" class="time">arrive</text>
    <text x="335" y="15" class="time">arrive</text>
    <text x="455" y="15" class="time">arrive</text>
    <text x="575" y="15" class="time">arrive</text>
  </g>

  <!-- Consumer row -->
  <text x="40" y="155" class="label">Consumer</text>
  <text x="40" y="168" class="sublabel">(2 warpgrp)</text>

  <rect x="110" y="142" width="100" height="28" rx="3" class="wait"/>
  <text x="160" y="160" text-anchor="middle" class="sublabel">prologue</text>

  <rect x="230" y="142" width="100" height="28" rx="3" class="cons"/>
  <text x="280" y="160" text-anchor="middle" class="sublabel" fill="white">WGMMA s0</text>

  <rect x="350" y="142" width="100" height="28" rx="3" class="cons"/>
  <text x="400" y="160" text-anchor="middle" class="sublabel" fill="white">WGMMA s1</text>

  <rect x="470" y="142" width="100" height="28" rx="3" class="cons"/>
  <text x="520" y="160" text-anchor="middle" class="sublabel" fill="white">WGMMA s2</text>

  <rect x="590" y="142" width="100" height="28" rx="3" class="cons"/>
  <text x="640" y="160" text-anchor="middle" class="sublabel" fill="white">WGMMA s3</text>

  <!-- Empty barrier indicators -->
  <g transform="translate(0,180)">
    <text x="40" y="15" class="sublabel">empty[s]</text>
    <circle cx="330" cy="12" r="4" class="bar-empty"/>
    <circle cx="450" cy="12" r="4" class="bar-empty"/>
    <circle cx="570" cy="12" r="4" class="bar-empty"/>
    <circle cx="690" cy="12" r="4" class="bar-empty"/>
    <text x="335" y="15" class="time">arrive</text>
    <text x="455" y="15" class="time">arrive</text>
    <text x="575" y="15" class="time">arrive</text>
  </g>

  <!-- Legend -->
  <g transform="translate(110, 230)">
    <rect x="0" y="0" width="16" height="12" rx="2" class="prod"/>
    <text x="22" y="10" class="sublabel">Producer: TMA 加载</text>
    <rect x="180" y="0" width="16" height="12" rx="2" class="cons"/>
    <text x="202" y="10" class="sublabel">Consumer: WGMMA 计算</text>
    <circle cx="368" cy="6" r="4" class="bar-full"/>
    <text x="378" y="10" class="sublabel">full arrive</text>
    <circle cx="458" cy="6" r="4" class="bar-empty"/>
    <text x="468" y="10" class="sublabel">empty arrive</text>
  </g>

  <!-- Annotation -->
  <rect x="110" y="260" width="500" height="55" rx="4" fill="#FFFDE7" stroke="#F0E442" stroke-width="1"/>
  <text x="120" y="280" class="sublabel" fill="#333">示意：producer 最多领先 consumer N_STAGES 个 stage——有 tile 在搬运路上、同时有一个在被计算。</text>
  <text x="120" y="296" class="sublabel" fill="#333">每 stage 48 KB（BM=128 BN=256 BK=64），4 stage = 192 KB &le; H100 每 block 227 KB 共享内存上限。</text>
</svg>
