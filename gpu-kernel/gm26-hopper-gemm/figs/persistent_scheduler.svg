<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" class="d-fig">
  <style>
    .d-label { font: 600 13px "Inter", sans-serif; fill: var(--ink, #1a1a1a); }
    .d-note  { font: 400 11px "Inter", sans-serif; fill: var(--ink-2, #4a4a4a); }
    .fill-c0 { fill: #56B4E9; opacity: 0.55; }
    .fill-c1 { fill: #009E73; opacity: 0.55; }
    .fill-c2 { fill: #E69F00; opacity: 0.55; }
    .fill-c3 { fill: #D55E00; opacity: 0.55; }
    .fill-idle { fill: #f0f0ed; }
    .grid-line { stroke: var(--rule, #e4e4e0); stroke-width: 0.5; }
  </style>

  <text x="180" y="22" text-anchor="middle" class="d-label">Non-persistent（wave quantization 浪费）</text>
  <text x="540" y="22" text-anchor="middle" class="d-label">Persistent（少量 CTA 遍历所有 tile）</text>

  <!-- Left: non-persistent grid 4×4 tiles, 3 SMs -->
  <!-- Wave 1: tiles (0,0),(0,1),(0,2) -->
  <g transform="translate(40, 40)">
    <!-- 4x4 tile grid -->
    <rect x="0" y="0" width="240" height="240" fill="none" stroke="var(--ink-3,#8a8a86)" stroke-width="1"/>
    <line x1="60" y1="0" x2="60" y2="240" class="grid-line"/>
    <line x1="120" y1="0" x2="120" y2="240" class="grid-line"/>
    <line x1="180" y1="0" x2="180" y2="240" class="grid-line"/>
    <line x1="0" y1="60" x2="240" y2="60" class="grid-line"/>
    <line x1="0" y1="120" x2="240" y2="120" class="grid-line"/>
    <line x1="0" y1="180" x2="240" y2="180" class="grid-line"/>

    <!-- Wave 1: 3 tiles get 3 CTAs -->
    <rect x="1" y="1" width="58" height="58" class="fill-c0"/>
    <rect x="61" y="1" width="58" height="58" class="fill-c1"/>
    <rect x="121" y="1" width="58" height="58" class="fill-c2"/>
    <!-- Wave 2 -->
    <rect x="181" y="1" width="58" height="58" class="fill-c0"/>
    <rect x="1" y="61" width="58" height="58" class="fill-c1"/>
    <rect x="61" y="61" width="58" height="58" class="fill-c2"/>
    <!-- ... more waves -->
    <rect x="121" y="61" width="58" height="58" class="fill-c0"/>
    <rect x="181" y="61" width="58" height="58" class="fill-c1"/>
    <rect x="1" y="121" width="58" height="58" class="fill-c2"/>

    <rect x="121" y="121" width="58" height="58" class="fill-c0"/>
    <rect x="181" y="121" width="58" height="58" class="fill-c1"/>
    <rect x="1" y="181" width="58" height="58" class="fill-c2"/>

    <rect x="61" y="181" width="58" height="58" class="fill-c0"/>
    <rect x="121" y="181" width="58" height="58" class="fill-idle"/>
    <rect x="181" y="181" width="58" height="58" class="fill-idle"/>
    <rect x="61" y="121" width="58" height="58" class="fill-c3"/>
    <rect x="181" y="121" width="58" height="58" class="fill-idle"/>

    <text x="120" y="268" text-anchor="middle" class="d-note">最后一波只用 1/3 SM</text>
  </g>

  <!-- Right: persistent, 3 CTAs walk all tiles -->
  <g transform="translate(380, 40)">
    <rect x="0" y="0" width="240" height="240" fill="none" stroke="var(--ink-3,#8a8a86)" stroke-width="1"/>
    <line x1="60" y1="0" x2="60" y2="240" class="grid-line"/>
    <line x1="120" y1="0" x2="120" y2="240" class="grid-line"/>
    <line x1="180" y1="0" x2="180" y2="240" class="grid-line"/>
    <line x1="0" y1="60" x2="240" y2="60" class="grid-line"/>
    <line x1="0" y1="120" x2="240" y2="120" class="grid-line"/>
    <line x1="0" y1="180" x2="240" y2="180" class="grid-line"/>

    <!-- CTA 0 path: snaking -->
    <rect x="1" y="1" width="58" height="58" class="fill-c0"/>
    <text x="30" y="34" text-anchor="middle" class="d-note" style="fill:white;font-size:10px">0→</text>
    <rect x="181" y="1" width="58" height="58" class="fill-c0"/>
    <rect x="121" y="61" width="58" height="58" class="fill-c0"/>
    <rect x="1" y="121" width="58" height="58" class="fill-c0"/>
    <rect x="181" y="121" width="58" height="58" class="fill-c0"/>

    <!-- CTA 1 path -->
    <rect x="61" y="1" width="58" height="58" class="fill-c1"/>
    <rect x="1" y="61" width="58" height="58" class="fill-c1"/>
    <rect x="181" y="61" width="58" height="58" class="fill-c1"/>
    <rect x="61" y="121" width="58" height="58" class="fill-c1"/>
    <rect x="1" y="181" width="58" height="58" class="fill-c1"/>

    <!-- CTA 2 path -->
    <rect x="121" y="1" width="58" height="58" class="fill-c2"/>
    <rect x="61" y="61" width="58" height="58" class="fill-c2"/>
    <rect x="1" y="61" width="0" height="0"/>
    <rect x="121" y="121" width="58" height="58" class="fill-c2"/>
    <rect x="61" y="181" width="58" height="58" class="fill-c2"/>
    <rect x="121" y="181" width="58" height="58" class="fill-c2"/>
    <rect x="181" y="181" width="58" height="58" class="fill-c2"/>

    <text x="120" y="268" text-anchor="middle" class="d-note">3 个 CTA 均匀遍历所有 tile</text>
  </g>

  <!-- Legend -->
  <rect x="200" y="308" width="30" height="12" rx="2" class="fill-c0"/>
  <text x="236" y="318" class="d-note">CTA 0</text>
  <rect x="280" y="308" width="30" height="12" rx="2" class="fill-c1"/>
  <text x="316" y="318" class="d-note">CTA 1</text>
  <rect x="360" y="308" width="30" height="12" rx="2" class="fill-c2"/>
  <text x="396" y="318" class="d-note">CTA 2</text>
  <rect x="440" y="308" width="30" height="12" rx="2" class="fill-idle"/>
  <text x="476" y="318" class="d-note">SM 空闲</text>
</svg>
