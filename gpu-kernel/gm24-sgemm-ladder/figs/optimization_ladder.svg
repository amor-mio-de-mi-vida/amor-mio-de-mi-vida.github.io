<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="sans-serif">
<text class="d-title" x="28" y="28">SGEMM 优化阶梯：从 naive 到接近峰值</text>
<text class="d-label" x="28" y="50">A100 上 M=N=K=4096 的 SGEMM 相对峰值性能（数据来自 siboehm 博客）</text>

<!-- Y axis -->
<line x1="68" y1="70" x2="68" y2="330" stroke="#888" stroke-width="1"/>
<text class="d-small" x="60" y="78" text-anchor="end">100%</text>
<text class="d-small" x="60" y="135" text-anchor="end">75%</text>
<text class="d-small" x="60" y="200" text-anchor="end">50%</text>
<text class="d-small" x="60" y="265" text-anchor="end">25%</text>
<text class="d-small" x="60" y="330" text-anchor="end">0%</text>
<!-- grid lines -->
<line x1="68" y1="78" x2="700" y2="78" stroke="#e4e4e0" stroke-width="0.5"/>
<line x1="68" y1="135" x2="700" y2="135" stroke="#e4e4e0" stroke-width="0.5"/>
<line x1="68" y1="200" x2="700" y2="200" stroke="#e4e4e0" stroke-width="0.5"/>
<line x1="68" y1="265" x2="700" y2="265" stroke="#e4e4e0" stroke-width="0.5"/>
<line x1="68" y1="330" x2="700" y2="330" stroke="#888" stroke-width="1"/>

<!-- bars: each bar 60px wide, 10px gap, starting at x=80 -->
<!-- naive: 1% -> height ~2.5px from baseline 330 -->
<rect x="80" y="327" width="60" height="3" rx="2" fill="#ccc"/>
<text class="d-small" x="110" y="324" text-anchor="middle">1%</text>
<text class="d-small" x="110" y="348" text-anchor="middle" transform="rotate(-35 110 348)">naive</text>

<!-- coalesced: 5% -->
<rect x="150" y="317" width="60" height="13" rx="2" fill="#bbb"/>
<text class="d-small" x="180" y="314" text-anchor="middle">5%</text>
<text class="d-small" x="180" y="348" text-anchor="middle" transform="rotate(-35 180 348)">coalesced</text>

<!-- smem: 15% -->
<rect x="220" y="291" width="60" height="39" rx="2" fill="#aaa"/>
<text class="d-small" x="250" y="288" text-anchor="middle">15%</text>
<text class="d-small" x="250" y="348" text-anchor="middle" transform="rotate(-35 250 348)">smem</text>

<!-- 1D reg: 30% -->
<rect x="290" y="252" width="60" height="78" rx="2" fill="#D55E00" opacity="0.6"/>
<text class="d-small" x="320" y="249" text-anchor="middle">30%</text>
<text class="d-small" x="320" y="348" text-anchor="middle" transform="rotate(-35 320 348)">1D reg</text>

<!-- 2D reg: 55% -->
<rect x="360" y="187" width="60" height="143" rx="2" fill="#D55E00" opacity="0.7"/>
<text class="d-small" x="390" y="184" text-anchor="middle">55%</text>
<text class="d-small" x="390" y="348" text-anchor="middle" transform="rotate(-35 390 348)">2D reg</text>

<!-- vectorized: 65% -->
<rect x="430" y="161" width="60" height="169" rx="2" fill="#D55E00" opacity="0.8"/>
<text class="d-small" x="460" y="158" text-anchor="middle">65%</text>
<text class="d-small" x="460" y="348" text-anchor="middle" transform="rotate(-35 460 348)">vec load</text>

<!-- warp tiling: 75% -->
<rect x="500" y="135" width="60" height="195" rx="2" fill="#D55E00" opacity="0.85"/>
<text class="d-small" x="530" y="132" text-anchor="middle">75%</text>
<text class="d-small" x="530" y="348" text-anchor="middle" transform="rotate(-35 530 348)">warp tile</text>

<!-- double buffer: 82% -->
<rect x="570" y="117" width="60" height="213" rx="2" fill="#D55E00" opacity="0.9"/>
<text class="d-small" x="600" y="114" text-anchor="middle">82%</text>
<text class="d-small" x="600" y="348" text-anchor="middle" transform="rotate(-35 600 348)">双缓冲</text>

<!-- autotuned: 88% -->
<rect x="640" y="101" width="60" height="229" rx="2" fill="#D55E00"/>
<text class="d-small" x="670" y="98" text-anchor="middle">88%</text>
<text class="d-small" x="670" y="348" text-anchor="middle" transform="rotate(-35 670 348)">autotune</text>

<!-- cuBLAS reference line -->
<line x1="68" y1="84" x2="700" y2="84" stroke="#0b5cad" stroke-width="1.2" stroke-dasharray="6 3"/>
<text class="d-small" x="700" y="80" text-anchor="end" fill="#0b5cad">cuBLAS (~96%)</text>
</svg>
