<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 230">
<style>
  text{font-family:system-ui,sans-serif;font-size:12px;fill:#23272f}
  .title{font-size:12px;font-weight:700}
  .label{font-size:11px;fill:#6b7280}
  .code{font-family:ui-monospace,monospace;font-size:10.5px}
</style>
<text x="350" y="18" text-anchor="middle" class="title">Variable-Length Batch: Padding vs cu_seqlens Packing</text>

<!-- Padded approach -->
<rect x="20" y="32" width="310" height="80" rx="5" fill="#fef2f2" stroke="#ef4444" stroke-width="1.2"/>
<text x="175" y="50" text-anchor="middle" class="title" fill="#dc2626">Padded Batch</text>
<rect x="35" y="60" width="100" height="15" rx="2" fill="#fca5a5"/>
<rect x="135" y="60" width="75" height="15" rx="2" fill="#f3f4f6" stroke="#d1d5db" stroke-dasharray="2"/>
<text x="35" y="85" class="code" font-size="10">seq 0: len=100</text>
<text x="155" y="72" text-anchor="middle" class="label" font-size="9">pad</text>
<rect x="35" y="92" width="55" height="15" rx="2" fill="#fca5a5"/>
<rect x="90" y="92" width="120" height="15" rx="2" fill="#f3f4f6" stroke="#d1d5db" stroke-dasharray="2"/>
<text x="35" y="85" class="code" font-size="10"></text>
<text x="225" y="72" class="label" font-size="9">waste</text>
<text x="225" y="104" class="label" font-size="9">waste</text>

<!-- Packed approach -->
<rect x="370" y="32" width="310" height="80" rx="5" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2"/>
<text x="525" y="50" text-anchor="middle" class="title" fill="#16a34a">Packed (cu_seqlens)</text>
<rect x="385" y="60" width="100" height="15" rx="2" fill="#86efac"/>
<rect x="485" y="60" width="55" height="15" rx="2" fill="#60a5fa"/>
<rect x="540" y="60" width="80" height="15" rx="2" fill="#fde047"/>
<text x="385" y="87" class="code" font-size="10">s0(100) | s1(55) | s2(80)</text>
<text x="385" y="102" class="label">cu_seqlens = [0, 100, 155, 235]</text>

<!-- Lower comparison -->
<rect x="20" y="130" width="310" height="60" rx="5" fill="#fff" stroke="#d1d5db"/>
<text x="35" y="150" class="label">Tokens computed: 3 &#xd7; 100 = 300</text>
<text x="35" y="165" class="label">Useful tokens:   100 + 55 + 80 = 235</text>
<text x="35" y="180" class="label" fill="#dc2626">Waste: 21.7% compute + memory</text>

<rect x="370" y="130" width="310" height="60" rx="5" fill="#fff" stroke="#d1d5db"/>
<text x="385" y="150" class="label">Tokens computed: 235</text>
<text x="385" y="165" class="label">Useful tokens:   235</text>
<text x="385" y="180" class="label" fill="#16a34a">Waste: 0%</text>

<text x="350" y="215" text-anchor="middle" class="label">Kernel uses cu_seqlens to compute Q/KV offsets &#x2014; different sequences never cross-attend</text>
<text x="350" y="230" text-anchor="middle" font-size="10.5" fill="#aaa" font-style="italic">data-source: illustrative</text>
</svg>
