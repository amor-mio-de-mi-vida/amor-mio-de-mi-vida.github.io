<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290">
<style>
  text{font-family:system-ui,sans-serif;font-size:12px;fill:#23272f}
  .title{font-size:12px;font-weight:700}
  .label{font-size:11px;fill:#6b7280}
  .code{font-family:ui-monospace,monospace;font-size:10.5px}
  .box{rx:5;ry:5;stroke-width:1.2}
</style>
<text x="350" y="18" text-anchor="middle" class="title">CuTe Layout Composition: Thread-to-Data Mapping</text>

<!-- Global memory layout -->
<rect x="20" y="35" width="200" height="100" class="box" fill="#eff6ff" stroke="#3b82f6"/>
<text x="120" y="55" text-anchor="middle" class="title" fill="#2563eb">Global Memory Layout</text>
<text x="35" y="75" class="code" font-size="10">Shape  = (128, 128)</text>
<text x="35" y="92" class="code" font-size="10">Stride = (128, 1)</text>
<text x="35" y="115" class="label" font-size="10">Row-major: 128 rows, 128 cols</text>
<text x="35" y="128" class="label" font-size="10">16,384 elements total</text>

<!-- Arrow: partition -->
<line x1="220" y1="85" x2="260" y2="85" stroke="#888" stroke-width="1.2" marker-end="url(#arr10)"/>
<text x="240" y="75" text-anchor="middle" class="label" font-size="9">partition</text>

<!-- Thread layout -->
<rect x="260" y="35" width="200" height="100" class="box" fill="#dcfce7" stroke="#22c55e"/>
<text x="360" y="55" text-anchor="middle" class="title" fill="#16a34a">Thread Layout</text>
<text x="275" y="75" class="code" font-size="10">Shape  = (32, 4)</text>
<text x="275" y="92" class="code" font-size="10">Stride = (4, 1)</text>
<text x="275" y="115" class="label" font-size="10">128 threads in a block</text>
<text x="275" y="128" class="label" font-size="10">32 rows &#xd7; 4 cols of threads</text>

<!-- Arrow: compose -->
<line x1="460" y1="85" x2="500" y2="85" stroke="#888" stroke-width="1.2" marker-end="url(#arr10)"/>
<text x="480" y="75" text-anchor="middle" class="label" font-size="9">compose</text>

<!-- Per-thread fragment -->
<rect x="500" y="35" width="180" height="100" class="box" fill="#fef9c3" stroke="#eab308"/>
<text x="590" y="55" text-anchor="middle" class="title" fill="#a16207">Per-Thread Fragment</text>
<text x="515" y="75" class="code" font-size="10">Shape  = (4, 32)</text>
<text x="515" y="92" class="code" font-size="10">Stride = (128&#xd7;32, 4)</text>
<text x="515" y="115" class="label" font-size="10">Each thread: 128 elements</text>
<text x="515" y="128" class="label" font-size="10">= 16384 / 128 threads</text>

<!-- MMA layout -->
<rect x="100" y="155" width="500" height="115" class="box" fill="#f3f4f6" stroke="#d1d5db"/>
<text x="350" y="178" text-anchor="middle" class="title">MMA Layout vs Blocked Layout</text>

<rect x="115" y="190" width="220" height="65" rx="3" fill="#fef2f2" stroke="#ef4444"/>
<text x="225" y="210" text-anchor="middle" class="title" font-size="11" fill="#dc2626">Blocked Layout</text>
<text x="125" y="228" class="code" font-size="9">Thread 0: elems [0..3] contiguous</text>
<text x="125" y="243" class="code" font-size="9">Thread 1: elems [4..7] contiguous</text>

<rect x="365" y="190" width="220" height="65" rx="3" fill="#dcfce7" stroke="#22c55e"/>
<text x="475" y="210" text-anchor="middle" class="title" font-size="11" fill="#16a34a">MMA Layout (m16n8k16)</text>
<text x="375" y="228" class="code" font-size="9">C t0: rows 0,8 · cols 0,1</text>
<text x="375" y="243" class="code" font-size="9">C t1: rows 0,8 · cols 2,3</text>

<text x="350" y="266" text-anchor="middle" class="label" font-size="10">Blocked &#x2192; MMA: via SMEM (TiledCopy / ldmatrix)</text>

<defs><marker id="arr10" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
  <path d="M0,0 L8,3 L0,6" fill="#888"/>
</marker></defs>
<text x="350" y="285" text-anchor="middle" font-size="10.5" fill="#aaa" font-style="italic">data-source: illustrative (CuTe layout algebra)</text>
</svg>
