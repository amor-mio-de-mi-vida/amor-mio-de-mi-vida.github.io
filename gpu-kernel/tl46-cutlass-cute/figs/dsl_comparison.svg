<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
<style>
  text{font-family:system-ui,sans-serif;font-size:12px;fill:#23272f}
  .title{font-size:11.5px;font-weight:700}
  .label{font-size:11px;fill:#6b7280}
  .code{font-family:ui-monospace,monospace;font-size:10.5px}
</style>
<text x="340" y="18" text-anchor="middle" class="title">GPU Kernel DSL Abstraction Levels</text>

<!-- Axis -->
<line x1="60" y1="40" x2="60" y2="265" stroke="#23272f" stroke-width="1.5"/>
<text x="55" y="38" text-anchor="end" class="label">High</text>
<text x="55" y="268" text-anchor="end" class="label">Low</text>
<text x="25" y="155" text-anchor="middle" class="title" transform="rotate(-90 25 155)">Abstraction</text>

<!-- Horizontal axis -->
<line x1="60" y1="265" x2="660" y2="265" stroke="#23272f" stroke-width="1.5"/>
<text x="360" y="295" text-anchor="middle" class="label">Control over hardware details</text>
<text x="80" y="280" class="label">Less</text>
<text x="635" y="280" class="label">More</text>

<!-- Triton -->
<rect x="100" y="55" width="110" height="40" rx="5" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2"/>
<text x="155" y="72" text-anchor="middle" class="title" fill="#22c55e">Triton</text>
<text x="155" y="88" text-anchor="middle" class="code" font-size="9">block-level Python</text>

<!-- TileLang -->
<rect x="230" y="75" width="110" height="40" rx="5" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.2"/>
<text x="285" y="92" text-anchor="middle" class="title" fill="#166534">TileLang</text>
<text x="285" y="108" text-anchor="middle" class="code" font-size="9">declarative tiles</text>

<!-- ThunderKittens -->
<rect x="360" y="120" width="120" height="40" rx="5" fill="#fef9c3" stroke="#eab308" stroke-width="1.2"/>
<text x="420" y="137" text-anchor="middle" class="title" fill="#854d0e">ThunderKittens</text>
<text x="420" y="153" text-anchor="middle" class="code" font-size="9">warp-level C++</text>

<!-- CUTLASS/CuTe -->
<rect x="370" y="175" width="130" height="40" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
<text x="435" y="192" text-anchor="middle" class="title" fill="#3b82f6">CUTLASS / CuTe</text>
<text x="435" y="208" text-anchor="middle" class="code" font-size="9">layout algebra C++</text>

<!-- Raw CUDA -->
<rect x="530" y="220" width="110" height="40" rx="5" fill="#fef2f2" stroke="#ef4444" stroke-width="1.2"/>
<text x="585" y="237" text-anchor="middle" class="title" fill="#ef4444">Raw CUDA</text>
<text x="585" y="253" text-anchor="middle" class="code" font-size="9">thread-level C++</text>

<!-- Inline PTX -->
<rect x="560" y="170" width="100" height="36" rx="5" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
<text x="610" y="187" text-anchor="middle" class="code" font-size="9">+ inline PTX</text>
<text x="610" y="200" text-anchor="middle" class="code" font-size="8">max control</text>

<text x="340" y="295" text-anchor="middle" font-size="11" fill="#aaa" font-style="italic">data-source: illustrative</text>
</svg>
