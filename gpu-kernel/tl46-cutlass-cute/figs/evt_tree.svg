<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260">
<style>
  text{font-family:system-ui,sans-serif;font-size:12px;fill:#23272f}
  .title{font-size:11.5px;font-weight:700}
  .label{font-size:11px;fill:#6b7280}
  .code{font-family:ui-monospace,monospace;font-size:10.5px}
  .node{rx:5;ry:5;stroke-width:1.2}
</style>
<text x="340" y="18" text-anchor="middle" class="title">Epilogue Visitor Tree (EVT): D = GELU(&alpha;&middot;Acc + &beta;&middot;C) + bias</text>

<!-- Store node -->
<rect x="280" y="30" width="120" height="32" class="node" fill="#dcfce7" stroke="#22c55e"/>
<text x="340" y="50" text-anchor="middle" class="code">Store(D)</text>

<!-- Add node -->
<rect x="280" y="85" width="120" height="32" class="node" fill="#eff6ff" stroke="#3b82f6"/>
<text x="340" y="105" text-anchor="middle" class="code">Add</text>
<line x1="340" y1="62" x2="340" y2="85" stroke="#888" stroke-width="1"/>

<!-- GELU node -->
<rect x="170" y="140" width="120" height="32" class="node" fill="#fef9c3" stroke="#eab308"/>
<text x="230" y="160" text-anchor="middle" class="code">GELU</text>
<line x1="310" y1="117" x2="230" y2="140" stroke="#888" stroke-width="1"/>

<!-- BroadcastLoad(bias) -->
<rect x="390" y="140" width="140" height="32" class="node" fill="#fef2f2" stroke="#ef4444"/>
<text x="460" y="160" text-anchor="middle" class="code">Broadcast(bias)</text>
<line x1="370" y1="117" x2="460" y2="140" stroke="#888" stroke-width="1"/>

<!-- LinearCombination -->
<rect x="140" y="195" width="180" height="32" class="node" fill="#ede9fe" stroke="#8b5cf6"/>
<text x="230" y="215" text-anchor="middle" class="code">&alpha;&middot;Acc + &beta;&middot;C</text>
<line x1="230" y1="172" x2="230" y2="195" stroke="#888" stroke-width="1"/>

<!-- Benefit text -->
<rect x="20" y="30" width="230" height="85" rx="5" fill="#f3f4f6" stroke="#d1d5db"/>
<text x="30" y="50" class="title">EVT Benefit</text>
<text x="30" y="70" class="label">All operations fuse into</text>
<text x="30" y="85" class="label">ONE epilogue pass &mdash; no</text>
<text x="30" y="100" class="label">extra gmem round trips.</text>

<text x="340" y="255" text-anchor="middle" font-size="11" fill="#aaa" font-style="italic">data-source: illustrative (after CUTLASS EVT docs)</text>
</svg>
