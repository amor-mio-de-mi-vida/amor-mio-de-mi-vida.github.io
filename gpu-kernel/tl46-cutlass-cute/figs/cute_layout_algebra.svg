<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280">
<style>
  text{font-family:system-ui,sans-serif;font-size:12px;fill:#23272f}
  .title{font-size:11.5px;font-weight:700}
  .label{font-size:11px;fill:#6b7280}
  .code{font-family:ui-monospace,monospace;font-size:10.5px}
</style>
<text x="340" y="18" text-anchor="middle" class="title">CuTe Layout Algebra: Shape + Stride = Index Mapping</text>

<!-- Row-major example -->
<rect x="20" y="35" width="200" height="130" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
<text x="120" y="55" text-anchor="middle" class="title" fill="#3b82f6">Row-Major 4&times;8</text>
<text x="35" y="80" class="code">Shape  = (4, 8)</text>
<text x="35" y="100" class="code">Stride = (8, 1)</text>
<text x="35" y="125" class="code">idx(i,j) = 8*i + j</text>
<text x="35" y="150" class="label">contiguous in N dim</text>

<!-- Col-major example -->
<rect x="240" y="35" width="200" height="130" rx="5" fill="#fef9c3" stroke="#eab308" stroke-width="1.2"/>
<text x="340" y="55" text-anchor="middle" class="title" fill="#854d0e">Col-Major 4&times;8</text>
<text x="255" y="80" class="code">Shape  = (4, 8)</text>
<text x="255" y="100" class="code">Stride = (1, 4)</text>
<text x="255" y="125" class="code">idx(i,j) = i + 4*j</text>
<text x="255" y="150" class="label">contiguous in M dim</text>

<!-- Swizzled smem -->
<rect x="460" y="35" width="200" height="130" rx="5" fill="#fef2f2" stroke="#ef4444" stroke-width="1.2"/>
<text x="560" y="55" text-anchor="middle" class="title" fill="#ef4444">Swizzled smem</text>
<text x="475" y="80" class="code">Shape  = (4, 8)</text>
<text x="475" y="100" class="code">Stride = (8, 1)</text>
<text x="475" y="120" class="code">+ Swizzle&lt;3,0,3&gt;</text>
<text x="475" y="140" class="code">idx = base ^ (row&lt;&lt;0)</text>
<text x="475" y="158" class="label">XOR avoids bank conflict</text>

<!-- Composition arrow and text -->
<rect x="20" y="185" width="640" height="70" rx="5" fill="#f3f4f6" stroke="#d1d5db"/>
<text x="340" y="205" text-anchor="middle" class="title">Layout Composition: Thread &rarr; Element Mapping</text>
<text x="40" y="225" class="code" font-size="10">ThreadLayout = ((4,8), (8,1))  &times;  ValueLayout = ((2,2), (1,2))</text>
<text x="40" y="245" class="code" font-size="10">= each of 32 threads owns a 2&times;2 fragment of the 4&times;8 tile</text>

<text x="340" y="275" text-anchor="middle" font-size="11" fill="#aaa" font-style="italic">data-source: illustrative (after CuTe documentation)</text>
</svg>
