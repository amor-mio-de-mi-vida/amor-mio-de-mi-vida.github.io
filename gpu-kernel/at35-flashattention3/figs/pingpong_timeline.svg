<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', sans-serif">
  <style>
    .title { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
    .label { font-size: 12px; fill: #1a1a1a; }
    .sublabel { font-size: 10px; fill: #666; }
    .box { rx: 4; ry: 4; }
    .time-axis { stroke: #999; stroke-width: 1; }
  </style>
  <defs>
    <marker id="ah8" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#999"/>
    </marker>
  </defs>

  <text x="360" y="22" text-anchor="middle" class="title">FA3 Inter-Warpgroup Ping-Pong 时序</text>

  <!-- Time axis -->
  <line x1="80" y1="300" x2="700" y2="300" class="time-axis" marker-end="url(#ah8)"/>
  <text x="705" y="305" class="sublabel">time</text>

  <!-- Labels -->
  <text x="15" y="75" class="label" font-weight="600">WG 0</text>
  <text x="15" y="175" class="label" font-weight="600">WG 1</text>
  <text x="15" y="255" class="label" font-weight="600">Producer</text>
  <text x="15" y="270" class="sublabel">(TMA warp)</text>

  <!-- Legend -->
  <rect x="90" y="315" width="40" height="12" rx="3" fill="#1976D2" opacity="0.85"/>
  <text x="135" y="326" class="sublabel">GEMM (WGMMA)</text>
  <rect x="260" y="315" width="40" height="12" rx="3" fill="#D55E00" opacity="0.85"/>
  <text x="305" y="326" class="sublabel">Softmax (MUFU)</text>
  <rect x="430" y="315" width="40" height="12" rx="3" fill="#388E3C" opacity="0.85"/>
  <text x="475" y="326" class="sublabel">TMA load</text>
  <rect x="570" y="315" width="40" height="12" rx="3" fill="#7B1FA2" opacity="0.25"/>
  <text x="615" y="326" class="sublabel">等待</text>

  <!-- WG0 timeline -->
  <!-- Tile 0 -->
  <rect x="90" y="45" width="100" height="35" class="box" fill="#1976D2" opacity="0.85"/>
  <text x="140" y="67" text-anchor="middle" class="sublabel" fill="white" font-weight="600">GEMM₀ (QKᵀ)</text>

  <rect x="195" y="45" width="60" height="35" class="box" fill="#D55E00" opacity="0.85"/>
  <text x="225" y="67" text-anchor="middle" class="sublabel" fill="white" font-weight="600">softmax</text>

  <rect x="260" y="45" width="100" height="35" class="box" fill="#1976D2" opacity="0.85"/>
  <text x="310" y="67" text-anchor="middle" class="sublabel" fill="white" font-weight="600">GEMM₁ (PV)</text>

  <!-- Tile 2 -->
  <rect x="365" y="45" width="100" height="35" class="box" fill="#1976D2" opacity="0.85"/>
  <text x="415" y="67" text-anchor="middle" class="sublabel" fill="white" font-weight="600">GEMM₀</text>

  <rect x="470" y="45" width="60" height="35" class="box" fill="#D55E00" opacity="0.85"/>
  <text x="500" y="67" text-anchor="middle" class="sublabel" fill="white" font-weight="600">softmax</text>

  <rect x="535" y="45" width="100" height="35" class="box" fill="#1976D2" opacity="0.85"/>
  <text x="585" y="67" text-anchor="middle" class="sublabel" fill="white" font-weight="600">GEMM₁</text>

  <!-- WG0 tile labels -->
  <text x="200" y="100" text-anchor="middle" class="sublabel" fill="#1976D2">tile 0</text>
  <text x="475" y="100" text-anchor="middle" class="sublabel" fill="#1976D2">tile 2</text>

  <!-- WG1 timeline (offset by half tile) -->
  <rect x="90" y="145" width="95" height="35" class="box" fill="#7B1FA2" opacity="0.25"/>
  <text x="137" y="167" text-anchor="middle" class="sublabel" fill="#7B1FA2">wait K₁</text>

  <rect x="190" y="145" width="100" height="35" class="box" fill="#1976D2" opacity="0.85"/>
  <text x="240" y="167" text-anchor="middle" class="sublabel" fill="white" font-weight="600">GEMM₀ (QKᵀ)</text>

  <rect x="295" y="145" width="60" height="35" class="box" fill="#D55E00" opacity="0.85"/>
  <text x="325" y="167" text-anchor="middle" class="sublabel" fill="white" font-weight="600">softmax</text>

  <rect x="360" y="145" width="100" height="35" class="box" fill="#1976D2" opacity="0.85"/>
  <text x="410" y="167" text-anchor="middle" class="sublabel" fill="white" font-weight="600">GEMM₁ (PV)</text>

  <!-- Tile 3 -->
  <rect x="465" y="145" width="100" height="35" class="box" fill="#1976D2" opacity="0.85"/>
  <text x="515" y="167" text-anchor="middle" class="sublabel" fill="white" font-weight="600">GEMM₀</text>

  <rect x="570" y="145" width="60" height="35" class="box" fill="#D55E00" opacity="0.85"/>
  <text x="600" y="167" text-anchor="middle" class="sublabel" fill="white" font-weight="600">softmax</text>

  <!-- WG1 tile labels -->
  <text x="300" y="200" text-anchor="middle" class="sublabel" fill="#1976D2">tile 1</text>
  <text x="540" y="200" text-anchor="middle" class="sublabel" fill="#1976D2">tile 3</text>

  <!-- Producer warp (TMA) -->
  <rect x="90" y="235" width="55" height="30" class="box" fill="#388E3C" opacity="0.85"/>
  <text x="117" y="254" text-anchor="middle" class="sublabel" fill="white">K₀,V₀</text>

  <rect x="150" y="235" width="55" height="30" class="box" fill="#388E3C" opacity="0.85"/>
  <text x="177" y="254" text-anchor="middle" class="sublabel" fill="white">K₁,V₁</text>

  <rect x="210" y="235" width="55" height="30" class="box" fill="#388E3C" opacity="0.85"/>
  <text x="237" y="254" text-anchor="middle" class="sublabel" fill="white">K₂,V₂</text>

  <rect x="270" y="235" width="55" height="30" class="box" fill="#388E3C" opacity="0.85"/>
  <text x="297" y="254" text-anchor="middle" class="sublabel" fill="white">K₃,V₃</text>

  <rect x="330" y="235" width="55" height="30" class="box" fill="#388E3C" opacity="0.85"/>
  <text x="357" y="254" text-anchor="middle" class="sublabel" fill="white">K₄,V₄</text>

  <!-- Annotation: overlap -->
  <text x="360" y="288" text-anchor="middle" class="sublabel" fill="#D55E00">WG0 softmax 期间，WG1 做 GEMM —— 隐藏非矩阵 FLOP</text>
</svg>
