<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
<style>
  text{font-family:system-ui,sans-serif;font-size:12px;fill:#23272f}
  .title{font-size:11.5px;font-weight:700}
  .label{font-size:11px;fill:#6b7280}
  .code{font-family:ui-monospace,monospace;font-size:10.5px}
  .arrow{stroke:#23272f;stroke-width:1.3;marker-end:url(#ah3)}
</style>
<defs>
  <marker id="ah3" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
    <path d="M0,0 L7,2.5 L0,5z" fill="#23272f"/>
  </marker>
</defs>
<text x="340" y="18" text-anchor="middle" class="title">Sparse Convolution: Kernel Map Construction</text>

<!-- Input voxels -->
<g transform="translate(30,35)">
  <text x="0" y="12" class="title" fill="#3b82f6">Input Active Voxels</text>
  <rect x="0" y="20" width="180" height="120" rx="4" fill="#eff6ff" stroke="#3b82f6"/>
  <!-- Grid with sparse active -->
  <rect x="10" y="30" width="25" height="25" rx="2" fill="#f3f4f6" stroke="#d1d5db"/>
  <rect x="40" y="30" width="25" height="25" rx="2" fill="#3b82f6"/><text x="52" y="47" text-anchor="middle" class="code" font-size="8" fill="#fff">A</text>
  <rect x="70" y="30" width="25" height="25" rx="2" fill="#f3f4f6" stroke="#d1d5db"/>
  <rect x="100" y="30" width="25" height="25" rx="2" fill="#f3f4f6" stroke="#d1d5db"/>
  <rect x="130" y="30" width="25" height="25" rx="2" fill="#3b82f6"/><text x="142" y="47" text-anchor="middle" class="code" font-size="8" fill="#fff">B</text>

  <rect x="10" y="60" width="25" height="25" rx="2" fill="#3b82f6"/><text x="22" y="77" text-anchor="middle" class="code" font-size="8" fill="#fff">C</text>
  <rect x="40" y="60" width="25" height="25" rx="2" fill="#f3f4f6" stroke="#d1d5db"/>
  <rect x="70" y="60" width="25" height="25" rx="2" fill="#3b82f6"/><text x="82" y="77" text-anchor="middle" class="code" font-size="8" fill="#fff">D</text>
  <rect x="100" y="60" width="25" height="25" rx="2" fill="#f3f4f6" stroke="#d1d5db"/>
  <rect x="130" y="60" width="25" height="25" rx="2" fill="#f3f4f6" stroke="#d1d5db"/>

  <rect x="10" y="90" width="25" height="25" rx="2" fill="#f3f4f6" stroke="#d1d5db"/>
  <rect x="40" y="90" width="25" height="25" rx="2" fill="#f3f4f6" stroke="#d1d5db"/>
  <rect x="70" y="90" width="25" height="25" rx="2" fill="#f3f4f6" stroke="#d1d5db"/>
  <rect x="100" y="90" width="25" height="25" rx="2" fill="#3b82f6"/><text x="112" y="107" text-anchor="middle" class="code" font-size="8" fill="#fff">E</text>
  <rect x="130" y="90" width="25" height="25" rx="2" fill="#f3f4f6" stroke="#d1d5db"/>
</g>

<!-- Kernel offsets -->
<g transform="translate(250,35)">
  <text x="0" y="12" class="title" fill="#854d0e">3x3 Kernel Offsets</text>
  <rect x="0" y="20" width="120" height="120" rx="4" fill="#fef9c3" stroke="#eab308"/>
  <text x="10" y="45" class="code" font-size="10">(-1,-1) (-1,0) (-1,1)</text>
  <text x="10" y="65" class="code" font-size="10">( 0,-1) ( 0,0) ( 0,1)</text>
  <text x="10" y="85" class="code" font-size="10">( 1,-1) ( 1,0) ( 1,1)</text>
  <text x="10" y="115" class="label">9 offsets total</text>
</g>

<!-- Kernel map -->
<g transform="translate(30,175)">
  <text x="0" y="12" class="title" fill="#ef4444">Kernel Map (per offset)</text>
  <rect x="0" y="20" width="620" height="110" rx="4" fill="#fef2f2" stroke="#ef4444"/>

  <text x="10" y="42" class="code" font-size="10">offset (-1,0): in_map=[A, C, B], out_map=[C, D, D]</text>
  <text x="10" y="62" class="code" font-size="10">offset ( 0,1): in_map=[A, D], out_map=[B, E]</text>
  <text x="10" y="82" class="code" font-size="10">offset ( 0,0): in_map=[A, B, C, D, E], out_map=[A, B, C, D, E]</text>
  <text x="10" y="102" class="code" font-size="10">...  (only pairs where BOTH input+output are active)</text>
  <text x="10" y="120" class="label">Each offset has variable-length (in, out) index pairs</text>
</g>

<text x="340" y="312" text-anchor="middle" font-size="11" fill="#aaa" font-style="italic">data-source: illustrative (after spconv/MinkowskiEngine)</text>
</svg>
