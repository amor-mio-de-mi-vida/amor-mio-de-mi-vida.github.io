</g>

<!-- Output (exclusive prefix sum) -->
<text x="30" y="290" class="title">Output:</text>
<g transform="translate(80,275)">
  <rect x="0" y="0" width="40" height="24" rx="2" fill="#dcfce7" stroke="#22c55e"/><text x="20" y="16" text-anchor="middle" class="code" font-size="10" fill="#16a34a">0</text>
  <rect x="44" y="0" width="40" height="24" rx="2" fill="#dcfce7" stroke="#22c55e"/><text x="64" y="16" text-anchor="middle" class="code" font-size="10" fill="#16a34a">3</text>
  <rect x="88" y="0" width="40" height="24" rx="2" fill="#dcfce7" stroke="#22c55e"/><text x="108" y="16" text-anchor="middle" class="code" font-size="10" fill="#16a34a">4</text>
  <rect x="132" y="0" width="40" height="24" rx="2" fill="#dcfce7" stroke="#22c55e"/><text x="152" y="16" text-anchor="middle" class="code" font-size="10" fill="#16a34a">11</text>
  <rect x="176" y="0" width="40" height="24" rx="2" fill="#dcfce7" stroke="#22c55e"/><text x="196" y="16" text-anchor="middle" class="code" font-size="10" fill="#16a34a">11</text>
