<!-- Complexity note -->
<rect x="430" y="265" width="250" height="45" rx="4" fill="#f3f4f6" stroke="#d1d5db"/>
<text x="555" y="283" text-anchor="middle" class="code" font-size="10">Work: O(n)</text>
<text x="555" y="300" text-anchor="middle" class="code" font-size="10">Span: O(log n) steps</text>

