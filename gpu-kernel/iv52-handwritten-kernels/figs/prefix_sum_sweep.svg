<!-- Step 3: stride=4 -->
<text x="30" y="185" class="label" font-size="10">stride=4</text>
<g transform="translate(80,170)">
  <rect x="0" y="0" width="40" height="24" rx="2" fill="#f3f4f6" stroke="#d1d5db"/><text x="20" y="16" text-anchor="middle" class="code" font-size="10">3</text>
