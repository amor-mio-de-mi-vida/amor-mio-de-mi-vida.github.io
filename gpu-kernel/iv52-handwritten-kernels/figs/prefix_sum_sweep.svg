  <rect x="176" y="0" width="40" height="24" rx="2" fill="#f3f4f6" stroke="#d1d5db"/><text x="196" y="16" text-anchor="middle" class="code" font-size="10">4</text>
  <rect x="220" y="0" width="40" height="24" rx="2" fill="#f3f4f6" stroke="#d1d5db"/><text x="240" y="16" text-anchor="middle" class="code" font-size="10">5</text>
