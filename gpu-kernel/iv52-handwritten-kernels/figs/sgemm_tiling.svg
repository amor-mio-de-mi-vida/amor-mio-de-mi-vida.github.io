<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380">
<style>
  text{font-family:system-ui,sans-serif;font-size:12px;fill:#23272f}
  .title{font-size:12px;font-weight:700}
  .label{font-size:11px;fill:#6b7280}
  .code{font-family:ui-monospace,monospace;font-size:10.5px}
  .box{rx:3;ry:3;stroke-width:1.2}
</style>
<text x="350" y="18" text-anchor="middle" class="title">Tiled SGEMM: Shared Memory Blocking Strategy</text>

<!-- Matrix A -->
<rect x="30" y="40" width="160" height="160" class="box" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="110" y="58" text-anchor="middle" class="title">Matrix A [M,K]</text>
<!-- Highlighted tile -->
<rect x="30" y="90" width="160" height="32" rx="2" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="110" y="110" text-anchor="middle" class="code" font-size="10" fill="#2563eb">A tile [BM, BK]</text>
<!-- Rows label -->
<text x="22" y="115" text-anchor="end" class="label" font-size="9">BM rows</text>
<text x="110" y="142" text-anchor="middle" class="label" font-size="9">BK cols</text>

<!-- Arrow A to SMEM -->
<line x1="195" y1="106" x2="250" y2="170" stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="4"/>
<text x="210" y="128" class="code" font-size="9" fill="#3b82f6">load</text>

<!-- Matrix B -->
<rect x="260" y="40" width="160" height="30" class="box" fill="#f3f4f6" stroke="#9ca3af"/>
<rect x="260" y="40" width="160" height="160" class="box" fill="none" stroke="#9ca3af" stroke-width="0.8"/>
<text x="340" y="34" text-anchor="middle" class="title">Matrix B [K,N]</text>
<!-- Highlighted tile -->
<rect x="290" y="40" width="32" height="160" rx="2" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
<text x="306" y="125" text-anchor="middle" class="code" font-size="9" fill="#16a34a" transform="rotate(-90,306,125)">B tile [BK, BN]</text>

<!-- Arrow B to SMEM -->
<line x1="306" y1="205" x2="306" y2="240" stroke="#22c55e" stroke-width="1.2" stroke-dasharray="4"/>
<text x="320" y="228" class="code" font-size="9" fill="#22c55e">load</text>

<!-- Shared Memory block -->
<rect x="220" y="245" width="260" height="80" class="box" fill="#fef9c3" stroke="#eab308"/>
<text x="350" y="263" text-anchor="middle" class="title" fill="#a16207">Shared Memory (SMEM)</text>
<rect x="230" y="270" width="110" height="22" rx="2" fill="#dbeafe" stroke="#93c5fd"/>
<text x="285" y="285" text-anchor="middle" class="code" font-size="9">As[BM][BK]</text>
<rect x="360" y="270" width="110" height="22" rx="2" fill="#dcfce7" stroke="#86efac"/>
<text x="415" y="285" text-anchor="middle" class="code" font-size="9">Bs[BK][BN]</text>
<text x="350" y="313" text-anchor="middle" class="code" font-size="9" fill="#a16207">__syncthreads()</text>

<!-- Arrow to compute -->
<line x1="350" y1="325" x2="350" y2="340" stroke="#888" stroke-width="1.2"/>
<polygon points="347,337 353,337 350,343" fill="#888"/>

<!-- Compute block -->
<rect x="220" y="343" width="260" height="28" class="box" fill="#fee2e2" stroke="#ef4444"/>
<text x="350" y="362" text-anchor="middle" class="code" font-size="10" fill="#dc2626">C[i][j] += As[i][k] * Bs[k][j]  (register)</text>

<!-- Output matrix C -->
<rect x="530" y="40" width="140" height="160" class="box" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="600" y="58" text-anchor="middle" class="title">Matrix C [M,N]</text>
<rect x="560" y="90" width="32" height="32" rx="2" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
<text x="576" y="110" text-anchor="middle" class="code" font-size="9" fill="#be185d">BM</text>
<text x="576" y="137" text-anchor="middle" class="label" font-size="9">BN</text>

<!-- Loop annotation -->
<rect x="500" y="270" width="180" height="55" rx="4" fill="#f3f4f6" stroke="#d1d5db"/>
<text x="590" y="288" text-anchor="middle" class="code" font-size="10">for t in 0..K/BK:</text>
<text x="590" y="303" text-anchor="middle" class="code" font-size="10">  load A,B tiles</text>
<text x="590" y="318" text-anchor="middle" class="code" font-size="10">  accumulate C tile</text>

<text x="350" y="378" text-anchor="middle" font-size="10.5" fill="#aaa" font-style="italic">data-source: illustrative (tiled GEMM pattern)</text>
</svg>
