<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260">
<style>
  text{font-family:system-ui,sans-serif;font-size:12px;fill:#23272f}
  .title{font-size:11.5px;font-weight:700}
  .label{font-size:11px;fill:#6b7280}
  .code{font-family:ui-monospace,monospace;font-size:10.5px}
  .box{rx:5;ry:5;stroke-width:1.2}
</style>
<text x="340" y="18" text-anchor="middle" class="title">Complexity Ladder: From Simple to Advanced</text>

<!-- Axis -->
<line x1="60" y1="35" x2="60" y2="225" stroke="#23272f" stroke-width="1.5"/>
<text x="30" y="130" text-anchor="middle" class="title" transform="rotate(-90 30 130)">Difficulty</text>
<text x="55" y="45" text-anchor="end" class="label">Hard</text>
<text x="55" y="225" text-anchor="end" class="label">Easy</text>

<!-- Level 1: Warm-up -->
<rect x="80" y="185" width="560" height="35" class="box" fill="#dcfce7" stroke="#22c55e"/>
<text x="100" y="207" class="title" fill="#166534">Warm-up (5 min)</text>
<text x="260" y="207" class="code">vec_add, grid-stride loop</text>

<!-- Level 2: Standard -->
<rect x="80" y="140" width="560" height="35" class="box" fill="#eff6ff" stroke="#3b82f6"/>
<text x="100" y="162" class="title" fill="#3b82f6">Standard (10-15 min)</text>
<text x="280" y="162" class="code">reduce, histogram, transpose, GEMV, RoPE</text>

<!-- Level 3: Core -->
<rect x="80" y="95" width="560" height="35" class="box" fill="#fef9c3" stroke="#eab308"/>
<text x="100" y="117" class="title" fill="#854d0e">Core (15-20 min)</text>
<text x="270" y="117" class="code">softmax, RMSNorm, LayerNorm, tiled GEMM</text>

<!-- Level 4: Advanced -->
<rect x="80" y="50" width="560" height="35" class="box" fill="#fef2f2" stroke="#ef4444"/>
<text x="100" y="72" class="title" fill="#ef4444">Advanced (20-30 min)</text>
<text x="280" y="72" class="code">prefix sum, top-K, atomicMax</text>

<text x="340" y="250" text-anchor="middle" font-size="11" fill="#aaa" font-style="italic">data-source: illustrative</text>
</svg>
