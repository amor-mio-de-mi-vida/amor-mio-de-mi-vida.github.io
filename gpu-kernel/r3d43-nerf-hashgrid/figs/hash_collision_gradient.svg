<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260">
<style>
  text{font-family:system-ui,sans-serif;font-size:12px;fill:#23272f}
  .title{font-size:12px;font-weight:700}
  .label{font-size:11px;fill:#6b7280}
  .code{font-family:ui-monospace,monospace;font-size:10.5px}
  .box{rx:5;ry:5;stroke-width:1.2}
</style>
<text x="350" y="18" text-anchor="middle" class="title">Hash Collision in Backward: Gradient Averaging</text>

<!-- Hash table slots -->
<rect x="250" y="40" width="200" height="30" class="box" fill="#f3f4f6" stroke="#d1d5db"/>
<text x="350" y="60" text-anchor="middle" class="title" font-size="11">Hash Table Slot k</text>

<!-- Two spatial regions mapping to same slot -->
<rect x="30" y="100" width="140" height="50" class="box" fill="#dcfce7" stroke="#22c55e"/>
<text x="100" y="120" text-anchor="middle" class="code" font-size="10">Region A (tree)</text>
<text x="100" y="140" text-anchor="middle" class="label" font-size="9">grad_A = [+0.3, -0.1]</text>

<rect x="530" y="100" width="140" height="50" class="box" fill="#dbeafe" stroke="#3b82f6"/>
<text x="600" y="120" text-anchor="middle" class="code" font-size="10">Region B (sky)</text>
<text x="600" y="140" text-anchor="middle" class="label" font-size="9">grad_B = [-0.2, +0.4]</text>

<!-- Arrows to slot -->
<line x1="140" y1="100" x2="280" y2="70" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="560" y1="100" x2="420" y2="70" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="200" y="82" class="code" font-size="9" fill="#22c55e">h(A) = k</text>
<text x="440" y="82" class="code" font-size="9" fill="#3b82f6">h(B) = k</text>

<!-- atomicAdd result -->
<rect x="200" y="170" width="300" height="70" class="box" fill="#fef2f2" stroke="#ef4444"/>
<text x="350" y="190" text-anchor="middle" class="title" fill="#dc2626">atomicAdd accumulates both</text>
<text x="350" y="210" text-anchor="middle" class="code" font-size="10">grad_table[k] += grad_A  (thread 1)</text>
<text x="350" y="225" text-anchor="middle" class="code" font-size="10">grad_table[k] += grad_B  (thread 2)</text>

<text x="350" y="255" text-anchor="middle" class="label" font-size="10">Colliding gradients average; the larger (more important) one dominates</text>

<defs><marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
  <path d="M0,0 L8,3 L0,6" fill="#888"/>
</marker></defs>
</svg>
