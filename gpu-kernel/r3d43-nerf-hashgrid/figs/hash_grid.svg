<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
<style>
  text{font-family:system-ui,sans-serif;font-size:12px;fill:#23272f}
  .title{font-size:11.5px;font-weight:700}
  .label{font-size:11px;fill:#6b7280}
  .code{font-family:ui-monospace,monospace;font-size:10.5px}
  .arrow{stroke:#23272f;stroke-width:1.3;marker-end:url(#ah1)}
</style>
<defs>
  <marker id="ah1" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
    <path d="M0,0 L7,2.5 L0,5z" fill="#23272f"/>
  </marker>
</defs>
<text x="340" y="18" text-anchor="middle" class="title">Multi-Resolution Hash Encoding (Instant-NGP)</text>

<!-- Input point -->
<rect x="20" y="35" width="100" height="30" rx="4" fill="#fef2f2" stroke="#ef4444"/>
<text x="70" y="55" text-anchor="middle" class="code">x = (x,y,z)</text>

<!-- Arrow to levels -->
<line x1="122" y1="50" x2="148" y2="50" class="arrow"/>

<!-- Level 0 (coarse) -->
<rect x="150" y="28" width="90" height="20" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
<text x="195" y="42" text-anchor="middle" class="code" font-size="9">Level 0 (4&times;4&times;4)</text>
<rect x="150" y="52" width="90" height="20" rx="3" fill="#bfdbfe" stroke="#3b82f6"/>
<text x="195" y="66" text-anchor="middle" class="code" font-size="9">Level 1 (8&times;8&times;8)</text>
<rect x="150" y="76" width="90" height="20" rx="3" fill="#93c5fd" stroke="#3b82f6"/>
<text x="195" y="90" text-anchor="middle" class="code" font-size="9">Level 2 (16&times;16&times;16)</text>
<text x="195" y="114" text-anchor="middle" class="label">...</text>
<rect x="150" y="120" width="90" height="20" rx="3" fill="#60a5fa" stroke="#3b82f6"/>
<text x="195" y="134" text-anchor="middle" class="code" font-size="9">Level L-1 (finest)</text>

<!-- Hash tables -->
<text x="340" y="30" class="title" fill="#8b5cf6">Hash Tables</text>
<rect x="290" y="38" width="140" height="110" rx="5" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.2"/>
<g transform="translate(300,48)">
  <rect width="120" height="16" rx="2" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="60" y="12" text-anchor="middle" class="code" font-size="9">T_0 entries &times; F features</text>
  <rect y="20" width="120" height="16" rx="2" fill="#ddd6fe" stroke="#c4b5fd"/>
  <text x="60" y="32" text-anchor="middle" class="code" font-size="9">T_1 entries &times; F features</text>
  <rect y="40" width="120" height="16" rx="2" fill="#c4b5fd" stroke="#a78bfa"/>
  <text x="60" y="52" text-anchor="middle" class="code" font-size="9">T_2 entries &times; F features</text>
  <text x="60" y="72" text-anchor="middle" class="label">...</text>
  <rect y="78" width="120" height="16" rx="2" fill="#a78bfa" stroke="#8b5cf6"/>
  <text x="60" y="90" text-anchor="middle" class="code" font-size="9">T_{L-1} entries &times; F</text>
</g>

<!-- Arrows level -> hash -->
<line x1="242" y1="38" x2="288" y2="50" stroke="#3b82f6" stroke-width="0.8" marker-end="url(#ah1)"/>
<line x1="242" y1="62" x2="288" y2="70" stroke="#3b82f6" stroke-width="0.8" marker-end="url(#ah1)"/>
<line x1="242" y1="86" x2="288" y2="90" stroke="#3b82f6" stroke-width="0.8" marker-end="url(#ah1)"/>
<line x1="242" y1="130" x2="288" y2="130" stroke="#3b82f6" stroke-width="0.8" marker-end="url(#ah1)"/>

<!-- Trilinear interp box -->
<rect x="460" y="38" width="200" height="110" rx="5" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.2"/>
<text x="560" y="58" text-anchor="middle" class="title" fill="#22c55e">Trilinear Interpolation</text>
<text x="470" y="78" class="code" font-size="9">8 corners per level per point</text>
<text x="470" y="96" class="code" font-size="9">hash(ix+dx, iy+dy, iz+dz) % T</text>
<text x="470" y="114" class="code" font-size="9">w = fx &times; fy &times; fz (fractional)</text>
<text x="470" y="132" class="code" font-size="9">&sum; w_c &times; table[hash_c]</text>

<line x1="432" y1="90" x2="458" y2="90" class="arrow"/>

<!-- Output -->
<rect x="460" y="170" width="200" height="30" rx="4" fill="#dcfce7" stroke="#22c55e"/>
<text x="560" y="190" text-anchor="middle" class="code">concat L levels &times; F = L&times;F features</text>
<line x1="560" y1="150" x2="560" y2="168" class="arrow"/>

<!-- Hash collision note -->
<rect x="20" y="175" width="400" height="75" rx="5" fill="#fef9c3" stroke="#eab308"/>
<text x="220" y="195" text-anchor="middle" class="title" fill="#854d0e">Key Properties</text>
<text x="30" y="215" class="label">Coarse levels: small grid &le; T &rarr; no collision (direct lookup)</text>
<text x="30" y="233" class="label">Fine levels: large grid &gt; T &rarr; hash collisions (averaged out by training)</text>

<!-- MLP box at bottom -->
<rect x="20" y="270" width="640" height="70" rx="5" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.2"/>
<text x="340" y="292" text-anchor="middle" class="title" fill="#ec4899">Fused MLP (tiny-cuda-nn)</text>
<text x="30" y="312" class="code" font-size="10">L&times;F hash features + view direction &rarr; 2-layer MLP (width 64, ReLU) &rarr; RGB + &sigma;</text>
<text x="30" y="328" class="code" font-size="10">Weights in smem, activations in registers &rarr; entire MLP in ONE kernel (Tensor Core)</text>

<line x1="560" y1="202" x2="340" y2="268" class="arrow"/>

<text x="340" y="355" text-anchor="middle" font-size="11" fill="#aaa" font-style="italic">data-source: illustrative (after M&uuml;ller et al. 2022)</text>
</svg>
