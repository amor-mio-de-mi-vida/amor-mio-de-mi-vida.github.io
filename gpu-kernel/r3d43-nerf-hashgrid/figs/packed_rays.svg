<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280">
<style>
  text{font-family:system-ui,sans-serif;font-size:12px;fill:#23272f}
  .title{font-size:11.5px;font-weight:700}
  .label{font-size:11px;fill:#6b7280}
  .code{font-family:ui-monospace,monospace;font-size:10.5px}
  .arrow{stroke:#23272f;stroke-width:1.3;marker-end:url(#ah4)}
</style>
<defs>
  <marker id="ah4" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
    <path d="M0,0 L7,2.5 L0,5z" fill="#23272f"/>
  </marker>
</defs>
<text x="340" y="18" text-anchor="middle" class="title">Packed Rays: Variable-Length Sample Compaction</text>

<!-- Naive: padded -->
<text x="30" y="48" class="title" fill="#ef4444">Naive: Padded to max samples</text>
<g transform="translate(30,55)">
  <rect width="600" height="75" rx="4" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
  <!-- Ray 0: 5 samples + padding -->
  <rect x="5" y="5" width="25" height="18" rx="2" fill="#fecaca"/><text x="17" y="17" text-anchor="middle" class="code" font-size="8">s0</text>
  <rect x="32" y="5" width="25" height="18" rx="2" fill="#fecaca"/><text x="44" y="17" text-anchor="middle" class="code" font-size="8">s1</text>
  <rect x="59" y="5" width="25" height="18" rx="2" fill="#fecaca"/><text x="71" y="17" text-anchor="middle" class="code" font-size="8">s2</text>
  <rect x="86" y="5" width="25" height="18" rx="2" fill="#fecaca"/><text x="98" y="17" text-anchor="middle" class="code" font-size="8">s3</text>
  <rect x="113" y="5" width="25" height="18" rx="2" fill="#fecaca"/><text x="125" y="17" text-anchor="middle" class="code" font-size="8">s4</text>
  <rect x="140" y="5" width="25" height="18" rx="2" fill="#f3f4f6" stroke="#d1d5db"/><text x="152" y="17" text-anchor="middle" class="code" font-size="8" fill="#aaa">pad</text>
  <rect x="167" y="5" width="25" height="18" rx="2" fill="#f3f4f6" stroke="#d1d5db"/><text x="179" y="17" text-anchor="middle" class="code" font-size="8" fill="#aaa">pad</text>
  <rect x="194" y="5" width="25" height="18" rx="2" fill="#f3f4f6" stroke="#d1d5db"/><text x="206" y="17" text-anchor="middle" class="code" font-size="8" fill="#aaa">pad</text>
  <text x="230" y="17" class="label" font-size="9">ray 0 (5 samples, 3 wasted)</text>

  <!-- Ray 1: 2 samples + padding -->
  <rect x="5" y="28" width="25" height="18" rx="2" fill="#bfdbfe"/><text x="17" y="40" text-anchor="middle" class="code" font-size="8">s0</text>
  <rect x="32" y="28" width="25" height="18" rx="2" fill="#bfdbfe"/><text x="44" y="40" text-anchor="middle" class="code" font-size="8">s1</text>
  <rect x="59" y="28" width="25" height="18" rx="2" fill="#f3f4f6" stroke="#d1d5db"/><text x="71" y="40" text-anchor="middle" class="code" font-size="8" fill="#aaa">pad</text>
  <rect x="86" y="28" width="25" height="18" rx="2" fill="#f3f4f6" stroke="#d1d5db"/>
  <rect x="113" y="28" width="25" height="18" rx="2" fill="#f3f4f6" stroke="#d1d5db"/>
  <rect x="140" y="28" width="25" height="18" rx="2" fill="#f3f4f6" stroke="#d1d5db"/>
  <rect x="167" y="28" width="25" height="18" rx="2" fill="#f3f4f6" stroke="#d1d5db"/>
  <rect x="194" y="28" width="25" height="18" rx="2" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="230" y="40" class="label" font-size="9">ray 1 (2 samples, 6 wasted)</text>

  <text x="5" y="65" class="label" fill="#ef4444">Wasted memory &amp; compute on padding (rays have 1&ndash;1000+ samples)</text>
</g>

<!-- Packed -->
<text x="30" y="155" class="title" fill="#22c55e">Packed: Contiguous, variable-length</text>
<g transform="translate(30,162)">
  <rect width="600" height="50" rx="4" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
  <!-- All samples packed -->
  <rect x="5" y="5" width="25" height="18" rx="2" fill="#fecaca"/><text x="17" y="17" text-anchor="middle" class="code" font-size="8">s0</text>
  <rect x="32" y="5" width="25" height="18" rx="2" fill="#fecaca"/><text x="44" y="17" text-anchor="middle" class="code" font-size="8">s1</text>
  <rect x="59" y="5" width="25" height="18" rx="2" fill="#fecaca"/><text x="71" y="17" text-anchor="middle" class="code" font-size="8">s2</text>
  <rect x="86" y="5" width="25" height="18" rx="2" fill="#fecaca"/><text x="98" y="17" text-anchor="middle" class="code" font-size="8">s3</text>
  <rect x="113" y="5" width="25" height="18" rx="2" fill="#fecaca"/><text x="125" y="17" text-anchor="middle" class="code" font-size="8">s4</text>
  <!-- Ray 1 samples immediately after -->
  <rect x="140" y="5" width="25" height="18" rx="2" fill="#bfdbfe"/><text x="152" y="17" text-anchor="middle" class="code" font-size="8">s0</text>
  <rect x="167" y="5" width="25" height="18" rx="2" fill="#bfdbfe"/><text x="179" y="17" text-anchor="middle" class="code" font-size="8">s1</text>
  <!-- Ray 2 -->
  <rect x="194" y="5" width="25" height="18" rx="2" fill="#d9f99d"/><text x="206" y="17" text-anchor="middle" class="code" font-size="8">s0</text>
  <rect x="221" y="5" width="25" height="18" rx="2" fill="#d9f99d"/><text x="233" y="17" text-anchor="middle" class="code" font-size="8">s1</text>
  <rect x="248" y="5" width="25" height="18" rx="2" fill="#d9f99d"/><text x="260" y="17" text-anchor="middle" class="code" font-size="8">s2</text>
  <text x="290" y="17" class="code" font-size="9">...</text>

  <text x="5" y="40" class="label" fill="#22c55e">ray_offsets = [0, 5, 7, ...], ray_counts = [5, 2, 3, ...]</text>
</g>

<!-- Comparison -->
<rect x="30" y="228" width="620" height="30" rx="4" fill="#f3f4f6" stroke="#d1d5db"/>
<text x="340" y="248" text-anchor="middle" class="label">Packed format: no wasted compute, but requires per-ray offset/count arrays (stream compaction)</text>

<text x="340" y="275" text-anchor="middle" font-size="11" fill="#aaa" font-style="italic">data-source: illustrative (after nerfacc)</text>
</svg>
