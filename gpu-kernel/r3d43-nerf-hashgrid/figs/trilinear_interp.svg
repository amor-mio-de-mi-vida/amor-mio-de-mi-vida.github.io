<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320">
<style>
  text{font-family:system-ui,sans-serif;font-size:12px;fill:#23272f}
  .title{font-size:12px;font-weight:700}
  .label{font-size:11px;fill:#6b7280}
  .code{font-family:ui-monospace,monospace;font-size:10.5px}
  .box{rx:5;ry:5;stroke-width:1.2}
</style>
<text x="350" y="18" text-anchor="middle" class="title">Trilinear Interpolation: 8 Corner Lookups per Level</text>

<!-- 3D cube -->
<polygon points="60,140 180,100 300,140 180,180" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
<polygon points="60,140 60,230 180,270 180,180" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1"/>
<polygon points="180,180 300,140 300,230 180,270" fill="#93c5fd" stroke="#3b82f6" stroke-width="1"/>

<!-- corners -->
<circle cx="60" cy="140" r="5" fill="#ef4444"/>
<circle cx="180" cy="100" r="5" fill="#ef4444"/>
<circle cx="300" cy="140" r="5" fill="#ef4444"/>
<circle cx="180" cy="180" r="5" fill="#ef4444"/>
<circle cx="60" cy="230" r="5" fill="#ef4444"/>
<circle cx="180" cy="190" r="5" fill="#ef4444"/>
<circle cx="300" cy="230" r="5" fill="#ef4444"/>
<circle cx="180" cy="270" r="5" fill="#ef4444"/>

<!-- query point -->
<circle cx="160" cy="175" r="7" fill="#22c55e" stroke="#16a34a" stroke-width="2"/>
<text x="172" y="172" class="code" fill="#16a34a">x (query)</text>

<!-- corner labels -->
<text x="35" y="135" class="code" font-size="9">c000</text>
<text x="185" y="95" class="code" font-size="9">c010</text>
<text x="305" y="135" class="code" font-size="9">c110</text>
<text x="185" y="195" class="code" font-size="9">c100</text>

<!-- Weight formula -->
<rect x="350" y="35" width="330" height="260" class="box" fill="#f9fafb" stroke="#d1d5db"/>
<text x="515" y="58" text-anchor="middle" class="title">Trilinear Weights (8 lookups)</text>

<text x="365" y="82" class="code" font-size="10">w000 = (1-fx)(1-fy)(1-fz)</text>
<text x="365" y="102" class="code" font-size="10">w001 = (1-fx)(1-fy)(fz)</text>
<text x="365" y="122" class="code" font-size="10">w010 = (1-fx)(fy)(1-fz)</text>
<text x="365" y="142" class="code" font-size="10">w011 = (1-fx)(fy)(fz)</text>
<text x="365" y="162" class="code" font-size="10">w100 = (fx)(1-fy)(1-fz)</text>
<text x="365" y="182" class="code" font-size="10">w101 = (fx)(1-fy)(fz)</text>
<text x="365" y="202" class="code" font-size="10">w110 = (fx)(fy)(1-fz)</text>
<text x="365" y="222" class="code" font-size="10">w111 = (fx)(fy)(fz)</text>

<text x="365" y="250" class="code" fill="#dc2626" font-size="10">feat = &Sigma; w_corner * table[h(corner)]</text>
<text x="365" y="270" class="label" font-size="10">16 levels x 8 corners x F=2 features</text>
<text x="365" y="285" class="label" font-size="10">= 256 hash lookups per sample</text>

<text x="350" y="315" text-anchor="middle" font-size="10.5" fill="#aaa" font-style="italic">data-source: illustrative</text>
</svg>
