<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
<style>
  text{font-family:system-ui,sans-serif;font-size:12px;fill:#23272f}
  .title{font-size:11.5px;font-weight:700}
  .label{font-size:11px;fill:#6b7280}
  .code{font-family:ui-monospace,monospace;font-size:10.5px}
  .arrow{stroke:#23272f;stroke-width:1.3;marker-end:url(#ah2)}
</style>
<defs>
  <marker id="ah2" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
    <path d="M0,0 L7,2.5 L0,5z" fill="#23272f"/>
  </marker>
</defs>
<text x="340" y="18" text-anchor="middle" class="title">Ray Marching with Occupancy Grid</text>

<!-- Camera -->
<circle cx="40" cy="140" r="12" fill="#fecaca" stroke="#ef4444" stroke-width="1.5"/>
<text x="40" y="144" text-anchor="middle" class="code" font-size="9" fill="#fff">C</text>

<!-- Ray line -->
<line x1="52" y1="140" x2="650" y2="140" stroke="#23272f" stroke-width="1" stroke-dasharray="4,3"/>

<!-- Occupancy grid cells -->
<g transform="translate(80,100)">
  <!-- Empty cells (skipped) -->
  <rect width="60" height="80" rx="2" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="30" y="45" text-anchor="middle" class="label" font-size="9">empty</text>
  <text x="30" y="58" text-anchor="middle" class="label" font-size="9">(skip)</text>

  <!-- Occupied cell -->
  <rect x="65" width="60" height="80" rx="2" fill="#fef2f2" stroke="#ef4444" stroke-width="1.2"/>
  <text x="95" y="45" text-anchor="middle" class="code" font-size="9" fill="#ef4444">occupied</text>
  <!-- Sample dots -->
  <circle cx="72" cy="40" r="3" fill="#ef4444"/>
  <circle cx="82" cy="40" r="3" fill="#ef4444"/>
  <circle cx="92" cy="40" r="3" fill="#ef4444"/>
  <circle cx="102" cy="40" r="3" fill="#ef4444"/>
  <circle cx="112" cy="40" r="3" fill="#ef4444"/>

  <!-- Empty -->
  <rect x="130" width="80" height="80" rx="2" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="170" y="45" text-anchor="middle" class="label" font-size="9">empty</text>
  <text x="170" y="58" text-anchor="middle" class="label" font-size="9">(skip)</text>

  <!-- Occupied -->
  <rect x="215" width="70" height="80" rx="2" fill="#fef2f2" stroke="#ef4444" stroke-width="1.2"/>
  <text x="250" y="45" text-anchor="middle" class="code" font-size="9" fill="#ef4444">occupied</text>
  <circle cx="225" cy="40" r="3" fill="#ef4444"/>
  <circle cx="238" cy="40" r="3" fill="#ef4444"/>
  <circle cx="251" cy="40" r="3" fill="#ef4444"/>
  <circle cx="264" cy="40" r="3" fill="#ef4444"/>
  <circle cx="277" cy="40" r="3" fill="#ef4444"/>

  <!-- Empty -->
  <rect x="290" width="90" height="80" rx="2" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="335" y="45" text-anchor="middle" class="label" font-size="9">empty</text>
  <text x="335" y="58" text-anchor="middle" class="label" font-size="9">(skip)</text>

  <!-- Occupied tail -->
  <rect x="385" width="60" height="80" rx="2" fill="#fef2f2" stroke="#ef4444" stroke-width="1.2"/>
  <text x="415" y="45" text-anchor="middle" class="code" font-size="9" fill="#ef4444">occupied</text>
  <circle cx="392" cy="40" r="3" fill="#ef4444"/>
  <circle cx="405" cy="40" r="3" fill="#ef4444"/>
  <circle cx="418" cy="40" r="3" fill="#ef4444"/>
  <circle cx="431" cy="40" r="3" fill="#ef4444"/>

  <!-- Empty tail -->
  <rect x="450" width="80" height="80" rx="2" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="490" y="45" text-anchor="middle" class="label" font-size="9">empty</text>
</g>

<!-- Volume rendering formula -->
<rect x="60" y="205" width="560" height="75" rx="5" fill="#fef9c3" stroke="#eab308"/>
<text x="340" y="225" text-anchor="middle" class="title" fill="#854d0e">Volume Rendering (Discrete)</text>
<text x="80" y="245" class="code" font-size="10">C(r) = &sum;_i T_i &alpha;_i c_i,   &alpha;_i = 1 - exp(-&sigma;_i &delta;_i),   T_i = &prod;_{j&lt;i}(1-&alpha;_j)</text>
<text x="80" y="265" class="code" font-size="10">Early termination: if T &lt; 1e-4, stop (same idea as 3DGS)</text>

<text x="340" y="295" text-anchor="middle" font-size="11" fill="#aaa" font-style="italic">data-source: illustrative</text>
</svg>
