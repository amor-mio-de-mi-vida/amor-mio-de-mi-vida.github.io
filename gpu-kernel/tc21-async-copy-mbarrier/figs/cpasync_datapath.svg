<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240">
<style>
  text{font-family:system-ui,sans-serif;font-size:12px;fill:#23272f}
  .title{font-size:12px;font-weight:700}
  .label{font-size:11px;fill:#6b7280}
  .code{font-family:ui-monospace,monospace;font-size:10.5px}
  .box{rx:5;ry:5;stroke-width:1.2}
</style>
<text x="350" y="18" text-anchor="middle" class="title">同步 vs 异步加载的数据路径</text>

<!-- Sync path -->
<rect x="20" y="35" width="310" height="90" class="box" fill="#fef2f2" stroke="#ef4444"/>
<text x="175" y="55" text-anchor="middle" class="title" fill="#dc2626">同步路径 (Volta/Turing)</text>
<rect x="35" y="65" width="70" height="25" rx="3" fill="#fee2e2" stroke="#fca5a5"/>
<text x="70" y="82" text-anchor="middle" class="code">HBM</text>
<line x1="105" y1="77" x2="135" y2="77" stroke="#ef4444" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="120" y="72" text-anchor="middle" font-size="9" fill="#dc2626">LDG</text>
<rect x="135" y="65" width="70" height="25" rx="3" fill="#fee2e2" stroke="#fca5a5"/>
<text x="170" y="82" text-anchor="middle" class="code">Register</text>
<line x1="205" y1="77" x2="235" y2="77" stroke="#ef4444" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="220" y="72" text-anchor="middle" font-size="9" fill="#dc2626">STS</text>
<rect x="235" y="65" width="70" height="25" rx="3" fill="#fee2e2" stroke="#fca5a5"/>
<text x="270" y="82" text-anchor="middle" class="code">SMEM</text>
<text x="175" y="115" text-anchor="middle" class="label">Thread blocked at each step</text>

<!-- Async path -->
<rect x="370" y="35" width="310" height="90" class="box" fill="#dcfce7" stroke="#22c55e"/>
<text x="525" y="55" text-anchor="middle" class="title" fill="#16a34a">异步路径 (Ampere cp.async)</text>
<rect x="385" y="65" width="70" height="25" rx="3" fill="#bbf7d0" stroke="#86efac"/>
<text x="420" y="82" text-anchor="middle" class="code">HBM</text>
<line x1="455" y1="77" x2="565" y2="77" stroke="#22c55e" stroke-width="1.5" marker-end="url(#ag)"/>
<text x="510" y="72" text-anchor="middle" font-size="9" fill="#16a34a">bypass (no reg)</text>
<rect x="565" y="65" width="70" height="25" rx="3" fill="#bbf7d0" stroke="#86efac"/>
<text x="600" y="82" text-anchor="middle" class="code">SMEM</text>
<text x="525" y="115" text-anchor="middle" class="label">Thread free to compute</text>

<!-- TMA path -->
<rect x="120" y="145" width="460" height="80" class="box" fill="#eff6ff" stroke="#3b82f6"/>
<text x="350" y="165" text-anchor="middle" class="title" fill="#2563eb">Hopper TMA: hardware address + swizzle</text>
<rect x="140" y="175" width="80" height="25" rx="3" fill="#dbeafe" stroke="#93c5fd"/>
<text x="180" y="192" text-anchor="middle" class="code">HBM</text>
<line x1="220" y1="187" x2="280" y2="187" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#ab)"/>
<text x="250" y="182" text-anchor="middle" font-size="9" fill="#2563eb">TMA unit</text>
<rect x="280" y="175" width="110" height="25" rx="3" fill="#dbeafe" stroke="#93c5fd"/>
<text x="335" y="192" text-anchor="middle" class="code">addr + swizzle</text>
<line x1="390" y1="187" x2="430" y2="187" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#ab)"/>
<rect x="430" y="175" width="80" height="25" rx="3" fill="#dbeafe" stroke="#93c5fd"/>
<text x="470" y="192" text-anchor="middle" class="code">SMEM</text>
<text x="350" y="218" text-anchor="middle" class="label">1 thread, 1 instruction, whole tile</text>

<defs>
<marker id="ar" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto"><path d="M0,0 L6,2.5 L0,5" fill="#ef4444"/></marker>
<marker id="ag" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto"><path d="M0,0 L6,2.5 L0,5" fill="#22c55e"/></marker>
<marker id="ab" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto"><path d="M0,0 L6,2.5 L0,5" fill="#3b82f6"/></marker>
</defs>
<text x="350" y="238" text-anchor="middle" font-size="10.5" fill="#aaa" font-style="italic">data-source: illustrative</text>
</svg>
