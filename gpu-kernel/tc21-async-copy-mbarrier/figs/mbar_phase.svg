<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="d-head"/></marker></defs>
<text class="d-title" x="24" y="26">mbarrier 的阶段循环：parity 在 0 和 1 之间翻转</text>

<!-- Phase circles -->
<circle cx="160" cy="130" r="52" class="d-box green" fill="none" stroke-width="2"/>
<text class="d-text" x="160" y="122" text-anchor="middle">Phase 0</text>
<text class="d-mono" x="160" y="142" text-anchor="middle">parity = 0</text>

<circle cx="400" cy="130" r="52" class="d-box accent" fill="none" stroke-width="2"/>
<text class="d-text" x="400" y="122" text-anchor="middle">Phase 1</text>
<text class="d-mono" x="400" y="142" text-anchor="middle">parity = 1</text>

<!-- Arrows between phases -->
<path class="d-arrow" d="M214 110 C280 70, 320 70, 346 110" marker-end="url(#ah)"/>
<text class="d-small" x="280" y="80" text-anchor="middle">到达数=0 且 tx=0</text>

<path class="d-arrow" d="M346 150 C320 190, 220 190, 214 150" marker-end="url(#ah)"/>
<text class="d-small" x="280" y="198" text-anchor="middle">到达数=0 且 tx=0</text>

<!-- Operations -->
<rect class="d-box accent" x="24" y="236" width="156" height="48" rx="4"/>
<text class="d-mono" x="102" y="256" text-anchor="middle">arrive</text>
<text class="d-small" x="102" y="274" text-anchor="middle">到达数 -= 1</text>

<rect class="d-box blue" x="200" y="236" width="156" height="48" rx="4"/>
<text class="d-mono" x="278" y="256" text-anchor="middle">expect_tx(N)</text>
<text class="d-small" x="278" y="274" text-anchor="middle">tx-count += N</text>

<rect class="d-box blue" x="376" y="236" width="160" height="48" rx="4"/>
<text class="d-mono" x="456" y="256" text-anchor="middle">complete_tx(N)</text>
<text class="d-small" x="456" y="274" text-anchor="middle">tx-count -= N</text>

<text class="d-label" x="24" y="310">阶段完成条件</text>
<text class="d-text" x="24" y="334">到达数归零 <b>且</b> tx-count 归零 → 自动翻转到下一阶段</text>

<text class="d-small" x="24" y="362">try_wait.parity 用 parity 位区分"当前阶段未完成（返回 False）"</text>
<text class="d-small" x="24" y="378">和"上一阶段已完成（返回 True）"；偶数阶段 parity=0，奇数 parity=1。</text>
</svg>
