<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220">
<style>
  text{font-family:system-ui,sans-serif;font-size:12px;fill:#23272f}
  .title{font-size:12px;font-weight:700}
  .label{font-size:11px;fill:#6b7280}
  .code{font-family:ui-monospace,monospace;font-size:10.5px}
</style>
<text x="350" y="18" text-anchor="middle" class="title">mbarrier tx-count: expect_tx / complete_tx 配对</text>

<!-- Timeline -->
<line x1="60" y1="60" x2="640" y2="60" stroke="#d1d5db" stroke-width="1"/>

<!-- Events -->
<circle cx="120" cy="60" r="6" fill="#3b82f6"/>
<text x="120" y="50" text-anchor="middle" class="code" fill="#2563eb">init</text>
<text x="120" y="85" text-anchor="middle" class="label">tx=0</text>
<text x="120" y="98" text-anchor="middle" class="label">arrive=N</text>

<circle cx="230" cy="60" r="6" fill="#f59e0b"/>
<text x="230" y="50" text-anchor="middle" class="code" fill="#a16207">expect_tx</text>
<text x="230" y="85" text-anchor="middle" class="label">tx += 8192</text>

<circle cx="340" cy="60" r="6" fill="#f59e0b"/>
<text x="340" y="50" text-anchor="middle" class="code" fill="#a16207">arrive</text>
<text x="340" y="85" text-anchor="middle" class="label">arrive -= 1</text>

<circle cx="450" cy="60" r="6" fill="#22c55e"/>
<text x="450" y="40" text-anchor="middle" class="code" fill="#16a34a">TMA done</text>
<text x="450" y="50" text-anchor="middle" class="code" fill="#16a34a">(complete_tx)</text>
<text x="450" y="85" text-anchor="middle" class="label">tx -= 8192</text>

<circle cx="560" cy="60" r="6" fill="#dc2626"/>
<text x="560" y="50" text-anchor="middle" class="code" fill="#dc2626">COMPLETE</text>
<text x="560" y="85" text-anchor="middle" class="label">tx=0 &#x2227; arrive=0</text>

<!-- Arrows showing the pairing -->
<path d="M230,105 Q340,155 450,105" fill="none" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#ay)"/>
<text x="340" y="148" text-anchor="middle" class="label" fill="#a16207">expect_tx 和 complete_tx 抵消</text>

<!-- Box -->
<rect x="60" y="165" width="580" height="40" rx="5" fill="#f9fafb" stroke="#d1d5db"/>
<text x="350" y="182" text-anchor="middle" class="label">完成条件 (§9.7.15.16.8): arrive_count == 0 AND tx_count == 0</text>
<text x="350" y="197" text-anchor="middle" class="label">Phase 自动 +1, parity 翻转 (0&#x2192;1 或 1&#x2192;0)</text>

<defs><marker id="ay" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto"><path d="M0,0 L6,2.5 L0,5" fill="#f59e0b"/></marker></defs>
<text x="350" y="218" text-anchor="middle" font-size="10.5" fill="#aaa" font-style="italic">data-source: illustrative</text>
</svg>
