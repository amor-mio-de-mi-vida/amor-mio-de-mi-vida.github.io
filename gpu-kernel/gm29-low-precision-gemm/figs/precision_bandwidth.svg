  <text x="469" y="249" text-anchor="middle" class="d-note">无 MMA</text>
  <text x="451" y="273" text-anchor="middle" class="d-label" style="font-size:12px">INT4</text>
  <rect x="523" y="75" width="32" height="180" class="bar-bw"/>
  <text x="539" y="70" text-anchor="middle" class="d-note">4×</text>
  <rect x="559" y="75" width="32" height="180" class="bar-tc"/>
  <text x="575" y="70" text-anchor="middle" class="d-note">4×</text>
  <text x="557" y="273" text-anchor="middle" class="d-label" style="font-size:12px">FP4</text>
  <text x="557" y="288" text-anchor="middle" class="d-note">B200</text>
  <text x="320.0" y="306" text-anchor="middle" class="d-note">稠密峰值：H100 FP16 989.5 TF、FP8 1,979 TF、INT8 1,979 TOPS；HGX B200 每 GPU FP16 2.25 PF、FP4 9 PF</text>
  <text x="320.0" y="322" text-anchor="middle" class="d-note">（hw-facts §4）。Hopper 的 wgmma 没有 INT4 输入类型</text>
