  <rect x="135" y="210" width="32" height="45" class="bar-tc"/>
  <text x="151" y="205" text-anchor="middle" class="d-note">1×</text>
  <text x="133" y="273" text-anchor="middle" class="d-label" style="font-size:12px">FP16</text>
  <text x="133" y="288" text-anchor="middle" class="d-note">H100</text>
  <rect x="205" y="165" width="32" height="90" class="bar-bw"/>
  <text x="221" y="160" text-anchor="middle" class="d-note">2×</text>
  <rect x="241" y="165" width="32" height="90" class="bar-tc"/>
  <text x="257" y="160" text-anchor="middle" class="d-note">2×</text>
  <text x="239" y="273" text-anchor="middle" class="d-label" style="font-size:12px">FP8</text>
  <text x="239" y="288" text-anchor="middle" class="d-note">H100</text>
  <rect x="311" y="165" width="32" height="90" class="bar-bw"/>
  <text x="327" y="160" text-anchor="middle" class="d-note">2×</text>
