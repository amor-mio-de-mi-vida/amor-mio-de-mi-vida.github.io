<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" class="d-fig">
  <style>
    .d-label { font: 600 13px "Inter", sans-serif; fill: var(--ink, #1a1a1a); }
    .d-note  { font: 400 11px "Inter", sans-serif; fill: var(--ink-2, #4a4a4a); }
    .bar-bw  { fill: #56B4E9; opacity: 0.8; }
    .bar-tc  { fill: #009E73; opacity: 0.8; }
    .grid-line { stroke: var(--rule, #e4e4e0); stroke-width: 0.5; }
  </style>
  <text x="320.0" y="22" text-anchor="middle" class="d-label">位宽 vs 权重字节节省 vs Tensor Core 稠密峰值（相对 FP16）</text>
  <text x="320.0" y="40" text-anchor="middle" class="d-note">蓝：每元素字节数相对 FP16 的节省（不含 scale）；绿：同一 GPU 上稠密峰值 ÷ FP16 稠密峰值</text>
  <line x1="80" y1="70" x2="80" y2="255" stroke="#8a8a86" stroke-width="1"/>
  <line x1="80" y1="255" x2="610" y2="255" stroke="#8a8a86" stroke-width="1"/>
  <line x1="80" y1="210" x2="610" y2="210" class="grid-line"/>
  <text x="72" y="214" text-anchor="end" class="d-note">1×</text>
  <line x1="80" y1="165" x2="610" y2="165" class="grid-line"/>
