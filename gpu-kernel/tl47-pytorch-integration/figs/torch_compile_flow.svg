  .label{font-size:11px;fill:#6b7280}
  .code{font-family:ui-monospace,monospace;font-size:10.5px}
  .box{rx:5;ry:5;stroke-width:1.2}
</style>
<text x="340" y="18" text-anchor="middle" class="title">Custom Op + torch.compile Integration</text>

<!-- Step 1: Python code -->
<rect x="30" y="35" width="140" height="55" class="box" fill="#dcfce7" stroke="#22c55e"/>
<text x="100" y="55" text-anchor="middle" class="title" fill="#166534">User Code</text>
<text x="100" y="75" text-anchor="middle" class="code">@torch.compile</text>
<text x="100" y="85" text-anchor="middle" class="code">def f(x, w):</text>

<!-- Arrow -->
<line x1="170" y1="62" x2="200" y2="62" stroke="#888" stroke-width="1.2" marker-end="url(#arr2)"/>

<!-- Step 2: TorchDynamo -->
<rect x="200" y="35" width="140" height="55" class="box" fill="#eff6ff" stroke="#3b82f6"/>
<text x="270" y="52" text-anchor="middle" class="title" fill="#3b82f6">TorchDynamo</text>
<text x="270" y="68" text-anchor="middle" class="label">traces Python</text>
<text x="270" y="82" text-anchor="middle" class="label">&rarr; FX graph</text>

<line x1="340" y1="62" x2="370" y2="62" stroke="#888" stroke-width="1.2" marker-end="url(#arr2)"/>

<!-- Step 3: AOTAutograd -->
<rect x="370" y="35" width="140" height="55" class="box" fill="#fef9c3" stroke="#eab308"/>
<text x="440" y="52" text-anchor="middle" class="title" fill="#854d0e">AOTAutograd</text>
<text x="440" y="68" text-anchor="middle" class="label">generates fwd</text>
<text x="440" y="82" text-anchor="middle" class="label">+ bwd graphs</text>

<line x1="510" y1="62" x2="540" y2="62" stroke="#888" stroke-width="1.2" marker-end="url(#arr2)"/>

<!-- Step 4: Inductor -->
<rect x="540" y="35" width="120" height="55" class="box" fill="#fef2f2" stroke="#ef4444"/>
<text x="600" y="52" text-anchor="middle" class="title" fill="#ef4444">Inductor</text>
<text x="600" y="68" text-anchor="middle" class="label">codegen</text>
<text x="600" y="82" text-anchor="middle" class="label">Triton / C++</text>

<!-- Custom op detail -->
<rect x="30" y="115" width="630" height="70" class="box" fill="#f3f4f6" stroke="#d1d5db"/>
<text x="340" y="135" text-anchor="middle" class="title">For custom ops to work with torch.compile:</text>

<rect x="45" y="145" width="190" height="30" class="box" fill="#dcfce7" stroke="#22c55e"/>
<text x="140" y="164" text-anchor="middle" class="code">@custom_op schema</text>

<rect x="250" y="145" width="190" height="30" class="box" fill="#eff6ff" stroke="#3b82f6"/>
<text x="345" y="164" text-anchor="middle" class="code">register_fake</text>

<rect x="455" y="145" width="190" height="30" class="box" fill="#fef9c3" stroke="#eab308"/>
<text x="550" y="164" text-anchor="middle" class="code">register_autograd</text>

<!-- Explanation -->
<rect x="30" y="200" width="200" height="50" class="box" fill="#f3f4f6" stroke="#d1d5db"/>
<text x="130" y="218" text-anchor="middle" class="label">schema: Dynamo</text>
<text x="130" y="234" text-anchor="middle" class="label">knows input/output types</text>

<rect x="245" y="200" width="200" height="50" class="box" fill="#f3f4f6" stroke="#d1d5db"/>
<text x="345" y="218" text-anchor="middle" class="label">fake: traces shape/dtype</text>
<text x="345" y="234" text-anchor="middle" class="label">without running CUDA</text>

<rect x="460" y="200" width="200" height="50" class="box" fill="#f3f4f6" stroke="#d1d5db"/>
<text x="560" y="218" text-anchor="middle" class="label">autograd: AOTAutograd</text>
<text x="560" y="234" text-anchor="middle" class="label">can differentiate through</text>

