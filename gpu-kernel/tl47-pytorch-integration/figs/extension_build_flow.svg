<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260">
<style>
  text{font-family:system-ui,sans-serif;font-size:12px;fill:#23272f}
  .title{font-size:11.5px;font-weight:700}
  .label{font-size:11px;fill:#6b7280}
  .code{font-family:ui-monospace,monospace;font-size:10.5px}
  .box{rx:5;ry:5;stroke-width:1.2}
</style>
<text x="340" y="18" text-anchor="middle" class="title">Two Build Paths for PyTorch C++/CUDA Extensions</text>

<!-- Path 1: setup.py (AOT) -->
<rect x="20" y="35" width="310" height="28" class="box" fill="#eff6ff" stroke="#3b82f6"/>
<text x="175" y="54" text-anchor="middle" class="title" fill="#3b82f6">AOT: setup.py / pip install</text>

<rect x="30" y="75" width="90" height="30" class="box" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="75" y="94" text-anchor="middle" class="code">.cu / .cpp</text>

<text x="133" y="94" text-anchor="middle" class="label">&rarr;</text>

<rect x="145" y="75" width="70" height="30" class="box" fill="#fef9c3" stroke="#eab308"/>
<text x="180" y="94" text-anchor="middle" class="code">nvcc</text>

<text x="228" y="94" text-anchor="middle" class="label">&rarr;</text>

<rect x="240" y="75" width="80" height="30" class="box" fill="#dcfce7" stroke="#22c55e"/>
<text x="280" y="94" text-anchor="middle" class="code">.so / .pyd</text>

<text x="175" y="125" text-anchor="middle" class="label">Build once, import as regular Python module</text>
<text x="175" y="140" text-anchor="middle" class="code">from setuptools import setup</text>
<text x="175" y="155" text-anchor="middle" class="code">from torch.utils.cpp_extension</text>
<text x="175" y="170" text-anchor="middle" class="code">    import CUDAExtension</text>

<!-- Path 2: load_inline (JIT) -->
<rect x="350" y="35" width="310" height="28" class="box" fill="#fef2f2" stroke="#ef4444"/>
<text x="505" y="54" text-anchor="middle" class="title" fill="#ef4444">JIT: load_inline / load</text>

<rect x="360" y="75" width="100" height="30" class="box" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="410" y="94" text-anchor="middle" class="code">Python str</text>

<text x="473" y="94" text-anchor="middle" class="label">&rarr;</text>

<rect x="485" y="75" width="75" height="30" class="box" fill="#fef9c3" stroke="#eab308"/>
<text x="522" y="94" text-anchor="middle" class="code">nvcc</text>

<text x="573" y="94" text-anchor="middle" class="label">&rarr;</text>

<rect x="585" y="75" width="70" height="30" class="box" fill="#dcfce7" stroke="#22c55e"/>
<text x="620" y="94" text-anchor="middle" class="code">.so</text>

<text x="505" y="125" text-anchor="middle" class="label">Compile at first import, cached in ~/.cache</text>
<text x="505" y="140" text-anchor="middle" class="code">from torch.utils.cpp_extension</text>
<text x="505" y="155" text-anchor="middle" class="code">    import load_inline</text>
<text x="505" y="170" text-anchor="middle" class="code">mod = load_inline(...)</text>

<!-- Common bottom -->
<rect x="20" y="190" width="640" height="50" class="box" fill="#f3f4f6" stroke="#d1d5db"/>
<text x="340" y="210" text-anchor="middle" class="title">Both produce the same result</text>
<text x="340" y="228" text-anchor="middle" class="code">import my_ext; my_ext.rms_norm(x, w, eps)</text>

<text x="340" y="258" text-anchor="middle" font-size="11" fill="#aaa" font-style="italic">data-source: illustrative</text>
</svg>
