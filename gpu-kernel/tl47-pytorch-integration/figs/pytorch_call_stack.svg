<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
<style>
  text{font-family:system-ui,sans-serif;font-size:12px;fill:#23272f}
  .title{font-size:11.5px;font-weight:700}
  .label{font-size:11px;fill:#6b7280}
  .code{font-family:ui-monospace,monospace;font-size:10.5px}
  .box{rx:5;ry:5;stroke-width:1.2}
</style>
<text x="340" y="18" text-anchor="middle" class="title">From Python Call to GPU Kernel</text>

<!-- Python layer -->
<rect x="40" y="35" width="600" height="40" class="box" fill="#dcfce7" stroke="#22c55e"/>
<text x="340" y="55" text-anchor="middle" class="title" fill="#166534">Python</text>
<text x="340" y="68" text-anchor="middle" class="code">y = rms_norm(x, weight, eps=1e-6)</text>

<line x1="340" y1="75" x2="340" y2="95" stroke="#888" stroke-width="1.2" marker-end="url(#arr)"/>

<!-- Dispatcher -->
<rect x="40" y="95" width="600" height="40" class="box" fill="#eff6ff" stroke="#3b82f6"/>
<text x="340" y="115" text-anchor="middle" class="title" fill="#3b82f6">PyTorch Dispatcher</text>
<text x="340" y="128" text-anchor="middle" class="code">torch.ops.mylib.rms_norm &rarr; dispatch(CUDA)</text>

<line x1="340" y1="135" x2="340" y2="155" stroke="#888" stroke-width="1.2" marker-end="url(#arr)"/>

<!-- C++ binding -->
<rect x="40" y="155" width="600" height="40" class="box" fill="#fef9c3" stroke="#eab308"/>
<text x="340" y="175" text-anchor="middle" class="title" fill="#854d0e">C++ Extension (.so)</text>
<text x="340" y="188" text-anchor="middle" class="code">rms_norm_cuda(x.data_ptr(), w.data_ptr(), stream)</text>

<line x1="340" y1="195" x2="340" y2="215" stroke="#888" stroke-width="1.2" marker-end="url(#arr)"/>

<!-- CUDA kernel -->
<rect x="40" y="215" width="600" height="40" class="box" fill="#fef2f2" stroke="#ef4444"/>
<text x="340" y="235" text-anchor="middle" class="title" fill="#ef4444">CUDA Kernel</text>
<text x="340" y="248" text-anchor="middle" class="code">rms_norm_kernel&lt;&lt;&lt;grid, block, 0, stream&gt;&gt;&gt;(...)</text>

<line x1="340" y1="255" x2="340" y2="275" stroke="#888" stroke-width="1.2" marker-end="url(#arr)"/>

<!-- GPU hardware -->
<rect x="40" y="275" width="600" height="35" class="box" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="340" y="297" text-anchor="middle" class="label">GPU SMs execute warps &mdash; HBM read/write via L2</text>

<!-- annotations -->
<text x="650" y="115" text-anchor="end" class="label" font-style="italic">dispatch key</text>
<text x="650" y="175" text-anchor="end" class="label" font-style="italic">pybind11 / nanobind</text>

<defs><marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
  <path d="M0,0 L8,3 L0,6" fill="#888"/>
</marker></defs>

<text x="340" y="315" text-anchor="middle" font-size="11" fill="#aaa" font-style="italic">data-source: illustrative</text>
</svg>
