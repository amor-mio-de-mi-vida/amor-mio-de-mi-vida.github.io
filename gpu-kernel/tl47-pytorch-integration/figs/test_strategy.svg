<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290">
<style>
  text{font-family:system-ui,sans-serif;font-size:12px;fill:#23272f}
  .title{font-size:11.5px;font-weight:700}
  .label{font-size:11px;fill:#6b7280}
  .code{font-family:ui-monospace,monospace;font-size:10.5px}
  .box{rx:5;ry:5;stroke-width:1.2}
</style>
<text x="340" y="18" text-anchor="middle" class="title">Custom Kernel Testing Strategy</text>

<!-- Correctness -->
<rect x="20" y="35" width="310" height="220" class="box" fill="#eff6ff" stroke="#3b82f6"/>
<text x="175" y="55" text-anchor="middle" class="title" fill="#3b82f6">Correctness Testing</text>

<rect x="35" y="65" width="280" height="28" class="box" fill="#dcfce7" stroke="#22c55e"/>
<text x="175" y="83" text-anchor="middle" class="code">Reference: pure PyTorch impl</text>

<rect x="35" y="100" width="280" height="28" class="box" fill="#fef9c3" stroke="#eab308"/>
<text x="175" y="118" text-anchor="middle" class="code">Tolerance (this post): FP32 1e-5, FP16 1e-2</text>

<rect x="35" y="135" width="280" height="28" class="box" fill="#fef2f2" stroke="#ef4444"/>
<text x="175" y="153" text-anchor="middle" class="code">Shapes: random + edge cases</text>

<text x="40" y="182" class="label">Checklist:</text>
<text x="40" y="197" class="label">&bull; Standard shapes: (B, N) typical</text>
<text x="40" y="212" class="label">&bull; Edge: (1,1), (1,N), non-power-of-2</text>
<text x="40" y="227" class="label">&bull; Large: (8192, 8192)</text>
<text x="40" y="242" class="label">&bull; All dtypes: FP32, FP16, BF16</text>

<!-- Performance -->
<rect x="350" y="35" width="310" height="220" class="box" fill="#fef2f2" stroke="#ef4444"/>
<text x="505" y="55" text-anchor="middle" class="title" fill="#ef4444">Performance Benchmarking</text>

<rect x="365" y="65" width="280" height="28" class="box" fill="#dcfce7" stroke="#22c55e"/>
<text x="505" y="83" text-anchor="middle" class="code">CUDA events for GPU timing</text>

<rect x="365" y="100" width="280" height="28" class="box" fill="#fef9c3" stroke="#eab308"/>
<text x="505" y="118" text-anchor="middle" class="code">Warmup 25 + Repeat 100</text>

<rect x="365" y="135" width="280" height="28" class="box" fill="#eff6ff" stroke="#3b82f6"/>
<text x="505" y="153" text-anchor="middle" class="code">Compare vs PyTorch native</text>

<text x="370" y="182" class="label">Metrics:</text>
<text x="370" y="197" class="label">&bull; Latency (ms per call)</text>
<text x="370" y="212" class="label">&bull; Throughput (GB/s effective)</text>
<text x="370" y="227" class="label">&bull; Roofline utilization (%)</text>
<text x="370" y="242" class="label">&bull; Speedup vs reference</text>

<text x="340" y="280" text-anchor="middle" font-size="11" fill="#aaa" font-style="italic">data-source: illustrative</text>
</svg>
