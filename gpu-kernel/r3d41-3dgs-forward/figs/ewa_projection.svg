<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310">
<style>
  text{font-family:system-ui,sans-serif;font-size:12px;fill:#23272f}
  .title{font-size:11px;font-weight:700}
  .label{font-size:11px;fill:#6b7280}
  .math{font-style:italic;font-size:12px}
  .arrow{stroke:#23272f;stroke-width:1.3;marker-end:url(#ah2)}
</style>
<defs>
  <marker id="ah2" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
    <path d="M0,0 L7,2.5 L0,5z" fill="#23272f"/>
  </marker>
</defs>
<!-- 3D world space -->
<text x="100" y="20" text-anchor="middle" class="title">3D World Space</text>
<!-- 3D Gaussian ellipsoid (3 ellipses for 3D illusion) -->
<ellipse cx="100" cy="120" rx="55" ry="35" fill="#dbeafe" fill-opacity="0.5" stroke="#3b82f6" stroke-width="1.5"/>
<ellipse cx="100" cy="120" rx="20" ry="35" fill="none" stroke="#3b82f6" stroke-width="0.8" stroke-dasharray="4,3"/>
<ellipse cx="100" cy="120" rx="55" ry="12" fill="none" stroke="#3b82f6" stroke-width="0.8" stroke-dasharray="4,3"/>
<circle cx="100" cy="120" r="3" fill="#ef4444"/>
<text x="110" y="116" class="math" fill="#ef4444">&mu;</text>
<text x="40" y="175" class="label">&Sigma; (3&times;3 covariance)</text>
<!-- Arrow: projection -->
<path d="M170,120 C220,100 260,90 300,80" fill="none" class="arrow"/>
<text x="230" y="78" class="label" transform="rotate(-12,230,78)">W, J</text>
<!-- Camera -->
<polygon points="310,55 330,65 330,85 310,95" fill="#f3f4f6" stroke="#666"/>
<text x="340" y="78" class="label">Camera</text>
<!-- Arrow: to screen -->
<path d="M330,75 C380,70 420,65 460,60" fill="none" class="arrow"/>
<text x="395" y="55" class="label">perspective</text>
<!-- 2D screen space -->
<text x="540" y="20" text-anchor="middle" class="title">2D Screen Space</text>
<rect x="470" y="35" width="140" height="140" rx="4" fill="#fafafa" stroke="#d1d5db"/>
<!-- Grid lines for tiles -->
<line x1="505" y1="35" x2="505" y2="175" stroke="#e5e7eb" stroke-width="0.5"/>
<line x1="540" y1="35" x2="540" y2="175" stroke="#e5e7eb" stroke-width="0.5"/>
<line x1="575" y1="35" x2="575" y2="175" stroke="#e5e7eb" stroke-width="0.5"/>
<line x1="470" y1="70" x2="610" y2="70" stroke="#e5e7eb" stroke-width="0.5"/>
<line x1="470" y1="105" x2="610" y2="105" stroke="#e5e7eb" stroke-width="0.5"/>
<line x1="470" y1="140" x2="610" y2="140" stroke="#e5e7eb" stroke-width="0.5"/>
<!-- 2D Gaussian splat -->
<ellipse cx="535" cy="100" rx="40" ry="25" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1.5" transform="rotate(-20,535,100)"/>
<circle cx="535" cy="100" r="2.5" fill="#ef4444"/>
<!-- Bounding box -->
<rect x="487" y="63" width="96" height="73" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,3" rx="2"/>
<text x="585" y="60" class="label" fill="#f59e0b">3&sigma; bbox</text>
<!-- Formulas at bottom -->
<text x="20" y="210" class="math">J = [f&#x2093;/z, 0, &minus;f&#x2093;x/z&sup2;; 0, f&#x2099;/z, &minus;f&#x2099;y/z&sup2;]</text>
<text x="20" y="235" class="math">&Sigma;&prime; = J W &Sigma; W&#x1d40; J&#x1d40; + 0.3 I</text>
<text x="20" y="260" class="math">conic = &Sigma;&prime;&#x207B;&sup1;  (for evaluation)</text>
<text x="20" y="285" class="math">radius = 3 &middot; &radic;&lambda;&#x2098;&#x2090;&#x2093;</text>
<text x="340" y="298" text-anchor="middle" font-size="11" fill="#aaa" font-style="italic">data-source: illustrative</text>
</svg>
