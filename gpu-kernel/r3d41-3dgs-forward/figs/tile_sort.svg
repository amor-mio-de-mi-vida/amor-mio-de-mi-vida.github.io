<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280">
<style>
  text{font-family:system-ui,sans-serif;font-size:12px;fill:#23272f}
  .title{font-size:11px;font-weight:700}
  .label{font-size:11px;fill:#6b7280}
  .code{font-family:ui-monospace,monospace;font-size:10.5px}
  .arrow{stroke:#23272f;stroke-width:1.3;marker-end:url(#ah3)}
</style>
<defs>
  <marker id="ah3" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
    <path d="M0,0 L7,2.5 L0,5z" fill="#23272f"/>
  </marker>
</defs>
<!-- Left: tiles_touched + prefix sum -->
<text x="10" y="20" class="title">Per-Gaussian tile count</text>
<rect x="10" y="30" width="140" height="24" rx="3" fill="#e8f4fd" stroke="#3b82f6"/>
<text x="80" y="46" text-anchor="middle" class="code">tiles_touched[i]</text>
<text x="10" y="72" class="label">Gaussian 0: 4 tiles</text>
<text x="10" y="88" class="label">Gaussian 1: 2 tiles</text>
<text x="10" y="104" class="label">Gaussian 2: 6 tiles</text>
<text x="10" y="120" class="label">...</text>
<!-- Arrow -->
<line x1="155" y1="80" x2="185" y2="80" class="arrow"/>
<text x="170" y="72" class="label" font-size="10">prefix</text>
<text x="175" y="84" class="label" font-size="10">sum</text>
<!-- Middle: key generation -->
<text x="195" y="20" class="title">64-bit sort key</text>
<rect x="195" y="30" width="200" height="48" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
<rect x="200" y="36" width="90" height="36" rx="2" fill="#fde68a"/>
<text x="245" y="50" text-anchor="middle" class="code">tile_id</text>
<text x="245" y="64" text-anchor="middle" class="label" font-size="10">high 32 bits</text>
<rect x="298" y="36" width="90" height="36" rx="2" fill="#fed7aa"/>
<text x="343" y="50" text-anchor="middle" class="code">depth_bits</text>
<text x="343" y="64" text-anchor="middle" class="label" font-size="10">low 32 bits</text>
<!-- Duplicate entries -->
<text x="195" y="100" class="label">Gaussian i touching tiles {3,4,5}:</text>
<rect x="195" y="108" width="200" height="64" rx="3" fill="#f9fafb" stroke="#d1d5db"/>
<text x="205" y="126" class="code">(3 | depth_i), point_i</text>
<text x="205" y="144" class="code">(4 | depth_i), point_i</text>
<text x="205" y="162" class="code">(5 | depth_i), point_i</text>
<!-- Arrow to sort -->
<line x1="400" y1="95" x2="440" y2="95" class="arrow"/>
<text x="415" y="85" class="label" font-size="10">radix</text>
<text x="418" y="97" class="label" font-size="10">sort</text>
<!-- Right: sorted result -->
<text x="450" y="20" class="title">After sort: per-tile, front-to-back</text>
<rect x="450" y="30" width="220" height="130" rx="4" fill="#dcfce7" stroke="#22c55e"/>
<!-- Tile 0 group -->
<rect x="458" y="38" width="204" height="18" rx="2" fill="#bbf7d0"/>
<text x="465" y="51" class="code">tile 0: G_a(z=1.2) G_c(z=2.5) G_f(z=3.1)</text>
<!-- Tile 1 group -->
<rect x="458" y="60" width="204" height="18" rx="2" fill="#d1fae5"/>
<text x="465" y="73" class="code">tile 1: G_b(z=0.8) G_a(z=1.2) ...</text>
<!-- Tile 2 group -->
<rect x="458" y="82" width="204" height="18" rx="2" fill="#ecfdf5"/>
<text x="465" y="95" class="code">tile 2: G_d(z=1.5) G_e(z=2.0) ...</text>
<text x="465" y="120" class="code">...</text>
<!-- tile_ranges -->
<rect x="458" y="130" width="204" height="24" rx="2" fill="#f0fdf4" stroke="#86efac"/>
<text x="465" y="147" class="code">tile_ranges[t] = (start, end)</text>
<!-- Bottom annotation -->
<text x="340" y="200" text-anchor="middle" class="label">Total pairs = &Sigma; tiles_touched[i]</text>
<text x="340" y="220" text-anchor="middle" class="label">Sort cost: O(K &middot; N) for K-bit radix sort</text>
<text x="340" y="265" text-anchor="middle" font-size="11" fill="#aaa" font-style="italic">data-source: illustrative</text>
</svg>
