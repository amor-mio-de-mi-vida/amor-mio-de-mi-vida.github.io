<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250">
<style>
  text{font-family:system-ui,sans-serif;font-size:12px;fill:#23272f}
  .title{font-size:12px;font-weight:700}
  .label{font-size:11px;fill:#6b7280}
  .code{font-family:ui-monospace,monospace;font-size:10.5px}
  .box{rx:5;ry:5;stroke-width:1.2}
</style>
<text x="350" y="18" text-anchor="middle" class="title">Front-to-Back &#x3b1;-Blending with Early Termination</text>

<!-- Gaussians -->
<rect x="30" y="40" width="60" height="50" class="box" fill="#dc2626" stroke="#991b1b" fill-opacity="0.9"/>
<text x="60" y="60" text-anchor="middle" class="code" fill="white" font-size="10">G&#x2081;</text>
<text x="60" y="78" text-anchor="middle" class="code" fill="white" font-size="9">&#x3b1;=0.8</text>

<rect x="110" y="40" width="60" height="50" class="box" fill="#2563eb" stroke="#1e40af" fill-opacity="0.7"/>
<text x="140" y="60" text-anchor="middle" class="code" fill="white" font-size="10">G&#x2082;</text>
<text x="140" y="78" text-anchor="middle" class="code" fill="white" font-size="9">&#x3b1;=0.5</text>

<rect x="190" y="40" width="60" height="50" class="box" fill="#16a34a" stroke="#15803d" fill-opacity="0.5"/>
<text x="220" y="60" text-anchor="middle" class="code" fill="white" font-size="10">G&#x2083;</text>
<text x="220" y="78" text-anchor="middle" class="code" fill="white" font-size="9">&#x3b1;=0.3</text>

<rect x="270" y="40" width="60" height="50" class="box" fill="#d97706" stroke="#b45309" fill-opacity="0.3"/>
<text x="300" y="60" text-anchor="middle" class="code" font-size="10">G&#x2084;</text>
<text x="300" y="78" text-anchor="middle" class="code" font-size="9">&#x3b1;=0.6</text>

<rect x="350" y="40" width="60" height="50" class="box" fill="#9333ea" stroke="#7e22ce" fill-opacity="0.15"/>
<text x="380" y="60" text-anchor="middle" class="code" fill="#666" font-size="10">G&#x2085;</text>
<text x="380" y="78" text-anchor="middle" class="code" fill="#666" font-size="9">&#x2026;</text>

<!-- Arrow -->
<line x1="30" y1="100" x2="410" y2="100" stroke="#888" stroke-width="1.5" marker-end="url(#arr9)"/>
<text x="220" y="115" text-anchor="middle" class="label">front (near) &#x2192; back (far)</text>

<!-- T values -->
<rect x="30" y="130" width="380" height="100" class="box" fill="#f9fafb" stroke="#d1d5db"/>
<text x="220" y="148" text-anchor="middle" class="title">Transmittance T (monotonically decreasing)</text>

<text x="60" y="170" text-anchor="middle" class="code" font-size="10">T&#x2081;=1.0</text>
<text x="140" y="170" text-anchor="middle" class="code" font-size="10">T&#x2082;=0.20</text>
<text x="220" y="170" text-anchor="middle" class="code" font-size="10">T&#x2083;=0.10</text>
<text x="300" y="170" text-anchor="middle" class="code" font-size="10">T&#x2084;=0.07</text>
<text x="380" y="170" text-anchor="middle" class="code" fill="#dc2626" font-size="10">T&#x2085;=0.03</text>

<text x="60" y="190" text-anchor="middle" class="label" font-size="9">w=0.80</text>
<text x="140" y="190" text-anchor="middle" class="label" font-size="9">w=0.10</text>
<text x="220" y="190" text-anchor="middle" class="label" font-size="9">w=0.03</text>
<text x="300" y="190" text-anchor="middle" class="label" font-size="9">w=0.04</text>
<text x="380" y="190" text-anchor="middle" class="label" fill="#dc2626" font-size="9">&#x2026;</text>

<text x="220" y="220" text-anchor="middle" class="title" fill="#dc2626" font-size="11">T &lt; 10&#x207b;&#x2074; &#x2192; done = true (early exit)</text>

<!-- Right side: comparison -->
<rect x="430" y="40" width="250" height="190" class="box" fill="#f3f4f6" stroke="#d1d5db"/>
<text x="555" y="60" text-anchor="middle" class="title">Why Front-to-Back?</text>
<text x="445" y="82" class="label" font-size="10">&#x2714; T monotonically &#x2193;</text>
<text x="445" y="100" class="label" font-size="10">&#x2714; Early exit when T &lt; &#x3b5;</text>
<text x="445" y="118" class="label" font-size="10">&#x2714; Skip occluded Gaussians</text>
<text x="445" y="140" class="label" font-size="10">&#x2718; Back-to-front: no exit</text>
<text x="445" y="158" class="label" font-size="10">&#x2718; Must process ALL</text>
<text x="445" y="176" class="label" font-size="10">&#x2718; Fully occluded still pays</text>

<text x="555" y="210" text-anchor="middle" class="code" fill="#16a34a" font-size="10">Savings depend on occlusion</text>

<defs><marker id="arr9" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
  <path d="M0,0 L8,3 L0,6" fill="#888"/>
</marker></defs>
<text x="350" y="247" text-anchor="middle" font-size="10.5" fill="#aaa" font-style="italic">data-source: illustrative</text>
</svg>
