<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260">
<style>
  text{font-family:system-ui,sans-serif;font-size:13px;fill:#23272f}
  .title{font-size:11px;font-weight:700;fill:#fff}
  .label{font-size:11px;fill:#6b7280}
  .detail{font-size:10.5px;fill:#555}
  .arrow{stroke:#23272f;stroke-width:1.5;marker-end:url(#ah)}
</style>
<defs>
  <marker id="ah" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <path d="M0,0 L8,3 L0,6z" fill="#23272f"/>
  </marker>
</defs>
<!-- Stage 1: Preprocess -->
<rect x="20" y="30" width="160" height="130" rx="8" fill="#e8f4fd" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="20" y="30" width="160" height="26" rx="8" fill="#3b82f6"/>
<rect x="20" y="48" width="160" height="8" fill="#3b82f6"/>
<text x="100" y="49" text-anchor="middle" class="title">1. Preprocess</text>
<text x="35" y="78" class="detail">World &rarr; Camera &rarr; Screen</text>
<text x="35" y="95" class="detail">3D Cov &rarr; 2D Cov (EWA)</text>
<text x="35" y="112" class="detail">SH &rarr; RGB color</text>
<text x="35" y="129" class="detail">Tile bounding box</text>
<text x="35" y="146" class="detail">Count tiles_touched</text>
<text x="100" y="178" text-anchor="middle" class="label">P threads (1/Gaussian)</text>
<!-- Arrow 1->2 -->
<line x1="185" y1="95" x2="222" y2="95" class="arrow"/>
<!-- Stage 2: Sort -->
<rect x="228" y="30" width="160" height="130" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<rect x="228" y="30" width="160" height="26" rx="8" fill="#f59e0b"/>
<rect x="228" y="48" width="160" height="8" fill="#f59e0b"/>
<text x="308" y="49" text-anchor="middle" class="title">2. Sort</text>
<text x="243" y="78" class="detail">Prefix sum &rarr; offsets</text>
<text x="243" y="95" class="detail">Generate (tile|depth) keys</text>
<text x="243" y="112" class="detail">Radix sort all pairs</text>
<text x="243" y="129" class="detail">Compute tile_ranges</text>
<text x="308" y="178" text-anchor="middle" class="label">CUB DeviceRadixSort</text>
<!-- Arrow 2->3 -->
<line x1="393" y1="95" x2="430" y2="95" class="arrow"/>
<!-- Stage 3: Rasterize -->
<rect x="436" y="30" width="170" height="130" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
<rect x="436" y="30" width="170" height="26" rx="8" fill="#22c55e"/>
<rect x="436" y="48" width="170" height="8" fill="#22c55e"/>
<text x="521" y="49" text-anchor="middle" class="title">3. Rasterize</text>
<text x="451" y="78" class="detail">Load batch &rarr; smem</text>
<text x="451" y="95" class="detail">Per-pixel: eval Gaussian</text>
<text x="451" y="112" class="detail">&alpha;-blend (front-to-back)</text>
<text x="451" y="129" class="detail">Early stop: T &lt; 10&#x207B;&#x2074;</text>
<text x="521" y="178" text-anchor="middle" class="label">1 block / tile (16&times;16)</text>
<!-- Output -->
<line x1="611" y1="95" x2="648" y2="95" class="arrow"/>
<rect x="652" y="60" width="56" height="70" rx="6" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="680" y="92" text-anchor="middle" class="detail">RGB</text>
<text x="680" y="107" text-anchor="middle" class="detail">Image</text>
<!-- Bottom annotation -->
<text x="360" y="230" text-anchor="middle" font-size="12" fill="#888">3D Gaussians (P ~ 10&#x2076;) &rarr; screen pixels (W&times;H)</text>
<text x="360" y="248" text-anchor="middle" font-size="11" fill="#aaa" font-style="italic">data-source: illustrative</text>
</svg>
