<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
<style>
  text{font-family:system-ui,sans-serif;font-size:12px;fill:#23272f}
  .title{font-size:11.5px;font-weight:700}
  .label{font-size:11px;fill:#6b7280}
  .code{font-family:ui-monospace,monospace;font-size:10.5px}
  .arrow{stroke:#23272f;stroke-width:1.3;marker-end:url(#ah4)}
</style>
<defs>
  <marker id="ah4" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
    <path d="M0,0 L7,2.5 L0,5z" fill="#23272f"/>
  </marker>
</defs>
<!-- Title -->
<text x="340" y="18" text-anchor="middle" class="title">Tile-Based Rasterization: Shared Memory Batching</text>
<!-- Left: Global memory (sorted list) -->
<rect x="15" y="40" width="130" height="260" rx="5" fill="#f0f9ff" stroke="#3b82f6" stroke-width="1.2"/>
<text x="80" y="60" text-anchor="middle" class="title" fill="#3b82f6">Global Memory</text>
<text x="80" y="78" text-anchor="middle" class="label">sorted Gaussians</text>
<!-- Batches in global -->
<rect x="25" y="90" width="110" height="40" rx="3" fill="#dbeafe"/>
<text x="80" y="115" text-anchor="middle" class="code">batch 0</text>
<rect x="25" y="136" width="110" height="40" rx="3" fill="#bfdbfe"/>
<text x="80" y="161" text-anchor="middle" class="code">batch 1</text>
<rect x="25" y="182" width="110" height="40" rx="3" fill="#93c5fd"/>
<text x="80" y="207" text-anchor="middle" class="code">batch 2</text>
<rect x="25" y="228" width="110" height="30" rx="3" fill="#60a5fa"/>
<text x="80" y="248" text-anchor="middle" class="code" fill="#fff">...</text>
<!-- Arrow: load batch -->
<line x1="150" y1="110" x2="210" y2="110" class="arrow"/>
<text x="178" y="100" class="label" font-size="10">coalesced</text>
<text x="185" y="112" class="label" font-size="10">load</text>
<!-- Middle: Shared memory -->
<rect x="215" y="55" width="190" height="115" rx="6" fill="#fefce8" stroke="#f59e0b" stroke-width="1.5"/>
<text x="310" y="75" text-anchor="middle" class="title" fill="#f59e0b">Shared Memory</text>
<text x="310" y="93" text-anchor="middle" class="label">256 Gaussians / batch</text>
<!-- smem arrays -->
<rect x="225" y="100" width="50" height="22" rx="2" fill="#fef3c7"/>
<text x="250" y="115" text-anchor="middle" class="code" font-size="9.5">xy[256]</text>
<rect x="280" y="100" width="55" height="22" rx="2" fill="#fef3c7"/>
<text x="307" y="115" text-anchor="middle" class="code" font-size="9.5">con[256]</text>
<rect x="340" y="100" width="55" height="22" rx="2" fill="#fef3c7"/>
<text x="367" y="115" text-anchor="middle" class="code" font-size="9.5">col[256]</text>
<text x="310" y="150" text-anchor="middle" class="code">__syncthreads()</text>
<!-- Arrow: process -->
<line x1="310" y1="175" x2="310" y2="210" class="arrow"/>
<!-- Right: Per-pixel processing -->
<rect x="220" y="215" width="185" height="105" rx="6" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.2"/>
<text x="312" y="235" text-anchor="middle" class="title" fill="#ec4899">Per Pixel (register)</text>
<text x="230" y="255" class="code">dx = px - s_xy[j].x</text>
<text x="230" y="272" class="code">G = exp(-0.5 * d&sup2;)</text>
<text x="230" y="289" class="code">C += &alpha; &middot; T &middot; color</text>
<text x="230" y="306" class="code">T *= (1 - &alpha;)</text>
<!-- Right side: diagram of pixel grid -->
<rect x="460" y="55" width="195" height="195" rx="5" fill="#f9fafb" stroke="#d1d5db"/>
<text x="557" y="75" text-anchor="middle" class="title">16&times;16 Tile</text>
<!-- Pixel grid -->
<g transform="translate(472,85)">
  <!-- 8x8 representation of 16x16 -->
  <rect width="168" height="148" fill="none" stroke="#d1d5db" rx="2"/>
  <!-- Some pixels with splat overlap shown -->
  <ellipse cx="85" cy="65" rx="55" ry="35" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-width="0.8" transform="rotate(-15,85,65)"/>
  <ellipse cx="50" cy="95" rx="30" ry="20" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="0.8" transform="rotate(10,50,95)"/>
  <ellipse cx="120" cy="40" rx="35" ry="18" fill="#22c55e" fill-opacity="0.12" stroke="#22c55e" stroke-width="0.8"/>
  <!-- Grid dots for pixels -->
  <g fill="#9ca3af">
    <circle cx="10" cy="10" r="1.5"/><circle cx="31" cy="10" r="1.5"/><circle cx="52" cy="10" r="1.5"/><circle cx="73" cy="10" r="1.5"/>
    <circle cx="94" cy="10" r="1.5"/><circle cx="115" cy="10" r="1.5"/><circle cx="136" cy="10" r="1.5"/><circle cx="157" cy="10" r="1.5"/>
    <circle cx="10" cy="28" r="1.5"/><circle cx="31" cy="28" r="1.5"/><circle cx="52" cy="28" r="1.5"/><circle cx="73" cy="28" r="1.5"/>
    <circle cx="94" cy="28" r="1.5"/><circle cx="115" cy="28" r="1.5"/><circle cx="136" cy="28" r="1.5"/><circle cx="157" cy="28" r="1.5"/>
  </g>
  <!-- Thread annotation -->
  <rect x="4" y="4" width="14" height="14" fill="#ec4899" fill-opacity="0.3" stroke="#ec4899" rx="2"/>
</g>
<text x="557" y="250" text-anchor="middle" class="label">1 thread = 1 pixel</text>
<!-- Early termination annotation -->
<rect x="460" y="260" width="195" height="40" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
<text x="557" y="277" text-anchor="middle" class="code" font-size="10.5">if (T &lt; 1e-4f) done = true;</text>
<text x="557" y="293" text-anchor="middle" class="label" font-size="10">pixel exits loop early</text>
<!-- Bottom -->
<text x="340" y="332" text-anchor="middle" font-size="11" fill="#aaa" font-style="italic">data-source: illustrative</text>
</svg>
