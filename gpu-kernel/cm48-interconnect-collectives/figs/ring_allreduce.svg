<svg viewBox="0 0 720 520" xmlns="http://www.w3.org/2000/svg" class="d-fig">
  <style>
    .d-label { font: 600 13px "Inter", sans-serif; fill: var(--ink, #1a1a1a); }
    .d-note  { font: 400 11px "Inter", sans-serif; fill: var(--ink-2, #4a4a4a); }
    .gpu-c   { fill: none; stroke: var(--ink-3, #8a8a86); stroke-width: 1.5; }
    .chunk-a { fill: #E69F00; opacity: 0.5; }
    .chunk-b { fill: #56B4E9; opacity: 0.5; }
    .chunk-c { fill: #009E73; opacity: 0.5; }
    .chunk-d { fill: #CC79A7; opacity: 0.5; }
    .arrow   { stroke: #D55E00; stroke-width: 1.5; fill: none; marker-end: url(#ah); }
  </style>

  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#D55E00"/>
    </marker>
  </defs>

  <text x="360" y="24" text-anchor="middle" class="d-label">Ring AllReduce：ReduceScatter + AllGather</text>

  <!-- Legend -->
  <g transform="translate(50, 40)">
    <rect x="0" y="0" width="20" height="12" class="chunk-a" rx="2"/>
    <text x="26" y="10" class="d-note" style="font-size:10px">Chunk A</text>
    <rect x="90" y="0" width="20" height="12" class="chunk-b" rx="2"/>
    <text x="116" y="10" class="d-note" style="font-size:10px">Chunk B</text>
    <rect x="180" y="0" width="20" height="12" class="chunk-c" rx="2"/>
    <text x="206" y="10" class="d-note" style="font-size:10px">Chunk C</text>
    <rect x="270" y="0" width="20" height="12" class="chunk-d" rx="2"/>
    <text x="296" y="10" class="d-note" style="font-size:10px">Chunk D</text>
  </g>

  <!-- Initial state: 4 GPUs, each with 4 chunks -->
  <text x="50" y="75" class="d-label" style="font-size:11px">初始状态</text>
  <g transform="translate(130, 62)">
    <!-- GPU 0 -->
    <text x="0" y="12" class="d-note" style="font-size:10px">GPU 0:</text>
    <rect x="42" y="0" width="30" height="16" class="chunk-a" rx="2"/>
    <rect x="74" y="0" width="30" height="16" class="chunk-b" rx="2"/>
    <rect x="106" y="0" width="30" height="16" class="chunk-c" rx="2"/>
    <rect x="138" y="0" width="30" height="16" class="chunk-d" rx="2"/>
    <text x="57" y="12" text-anchor="middle" class="d-note" style="font-size:8px">a₀</text>
    <text x="89" y="12" text-anchor="middle" class="d-note" style="font-size:8px">b₀</text>
    <text x="121" y="12" text-anchor="middle" class="d-note" style="font-size:8px">c₀</text>
    <text x="153" y="12" text-anchor="middle" class="d-note" style="font-size:8px">d₀</text>
    <!-- GPU 1 -->
    <text x="250" y="12" class="d-note" style="font-size:10px">GPU 1:</text>
    <rect x="292" y="0" width="30" height="16" class="chunk-a" rx="2"/>
    <rect x="324" y="0" width="30" height="16" class="chunk-b" rx="2"/>
    <rect x="356" y="0" width="30" height="16" class="chunk-c" rx="2"/>
    <rect x="388" y="0" width="30" height="16" class="chunk-d" rx="2"/>
    <text x="307" y="12" text-anchor="middle" class="d-note" style="font-size:8px">a₁</text>
    <text x="339" y="12" text-anchor="middle" class="d-note" style="font-size:8px">b₁</text>
    <text x="371" y="12" text-anchor="middle" class="d-note" style="font-size:8px">c₁</text>
    <text x="403" y="12" text-anchor="middle" class="d-note" style="font-size:8px">d₁</text>
  </g>
  <g transform="translate(130, 82)">
    <text x="0" y="12" class="d-note" style="font-size:10px">GPU 2:</text>
    <rect x="42" y="0" width="30" height="16" class="chunk-a" rx="2"/>
    <rect x="74" y="0" width="30" height="16" class="chunk-b" rx="2"/>
    <rect x="106" y="0" width="30" height="16" class="chunk-c" rx="2"/>
    <rect x="138" y="0" width="30" height="16" class="chunk-d" rx="2"/>
    <text x="57" y="12" text-anchor="middle" class="d-note" style="font-size:8px">a₂</text>
    <text x="89" y="12" text-anchor="middle" class="d-note" style="font-size:8px">b₂</text>
    <text x="121" y="12" text-anchor="middle" class="d-note" style="font-size:8px">c₂</text>
    <text x="153" y="12" text-anchor="middle" class="d-note" style="font-size:8px">d₂</text>
    <text x="250" y="12" class="d-note" style="font-size:10px">GPU 3:</text>
    <rect x="292" y="0" width="30" height="16" class="chunk-a" rx="2"/>
    <rect x="324" y="0" width="30" height="16" class="chunk-b" rx="2"/>
    <rect x="356" y="0" width="30" height="16" class="chunk-c" rx="2"/>
    <rect x="388" y="0" width="30" height="16" class="chunk-d" rx="2"/>
    <text x="307" y="12" text-anchor="middle" class="d-note" style="font-size:8px">a₃</text>
    <text x="339" y="12" text-anchor="middle" class="d-note" style="font-size:8px">b₃</text>
    <text x="371" y="12" text-anchor="middle" class="d-note" style="font-size:8px">c₃</text>
    <text x="403" y="12" text-anchor="middle" class="d-note" style="font-size:8px">d₃</text>
  </g>

  <!-- Phase 1: ReduceScatter (3 steps for 4 GPUs) -->
  <text x="50" y="130" class="d-label" style="font-size:11px;fill:#D55E00">Phase 1：ReduceScatter（3 步）</text>

  <!-- Step 1 ring diagram -->
  <g transform="translate(80, 145)">
    <text x="0" y="15" class="d-note" style="font-size:10px">Step 1:</text>
    <circle cx="100" cy="30" r="16" class="gpu-c"/>
    <text x="100" y="34" text-anchor="middle" class="d-note" style="font-size:9px">G0</text>
    <circle cx="180" cy="30" r="16" class="gpu-c"/>
    <text x="180" y="34" text-anchor="middle" class="d-note" style="font-size:9px">G1</text>
    <circle cx="180" cy="80" r="16" class="gpu-c"/>
    <text x="180" y="84" text-anchor="middle" class="d-note" style="font-size:9px">G2</text>
    <circle cx="100" cy="80" r="16" class="gpu-c"/>
    <text x="100" y="84" text-anchor="middle" class="d-note" style="font-size:9px">G3</text>
    <!-- Arrows -->
    <path d="M116,30 L162,30" class="arrow"/>
    <path d="M180,46 L180,62" class="arrow"/>
    <path d="M164,80 L118,80" class="arrow"/>
    <path d="M100,64 L100,48" class="arrow"/>

    <!-- Chunk labels on arrows -->
    <rect x="130" y="18" width="20" height="12" class="chunk-a" rx="2"/>
    <text x="140" y="28" text-anchor="middle" style="font-size:7px;fill:var(--ink,#1a1a1a)">a₀</text>
    <rect x="184" y="48" width="20" height="12" class="chunk-b" rx="2"/>
    <rect x="130" y="82" width="20" height="12" class="chunk-c" rx="2"/>
    <rect x="78" y="48" width="20" height="12" class="chunk-d" rx="2"/>
  </g>

  <!-- After ReduceScatter result -->
  <g transform="translate(340, 145)">
    <text x="0" y="15" class="d-note" style="font-size:10px">3 步后每 GPU 持有一个完全归约的 chunk：</text>
    <text x="0" y="35" class="d-note" style="font-size:10px">GPU 0:</text>
    <rect x="42" y="23" width="50" height="16" class="chunk-a" rx="2" style="opacity:0.8"/>
    <text x="67" y="35" text-anchor="middle" class="d-note" style="font-size:8px;font-weight:600">Σaᵢ</text>

    <text x="0" y="55" class="d-note" style="font-size:10px">GPU 1:</text>
    <rect x="42" y="43" width="50" height="16" class="chunk-b" rx="2" style="opacity:0.8"/>
    <text x="67" y="55" text-anchor="middle" class="d-note" style="font-size:8px;font-weight:600">Σbᵢ</text>

    <text x="0" y="75" class="d-note" style="font-size:10px">GPU 2:</text>
    <rect x="42" y="63" width="50" height="16" class="chunk-c" rx="2" style="opacity:0.8"/>
    <text x="67" y="75" text-anchor="middle" class="d-note" style="font-size:8px;font-weight:600">Σcᵢ</text>

    <text x="0" y="95" class="d-note" style="font-size:10px">GPU 3:</text>
    <rect x="42" y="83" width="50" height="16" class="chunk-d" rx="2" style="opacity:0.8"/>
    <text x="67" y="95" text-anchor="middle" class="d-note" style="font-size:8px;font-weight:600">Σdᵢ</text>
  </g>

  <!-- Phase 2: AllGather -->
  <text x="50" y="280" class="d-label" style="font-size:11px;fill:#0072B2">Phase 2：AllGather（3 步）</text>

  <g transform="translate(80, 295)">
    <text x="0" y="15" class="d-note" style="font-size:10px">Step 1:</text>
    <circle cx="100" cy="30" r="16" class="gpu-c"/>
    <text x="100" y="34" text-anchor="middle" class="d-note" style="font-size:9px">G0</text>
    <circle cx="180" cy="30" r="16" class="gpu-c"/>
    <text x="180" y="34" text-anchor="middle" class="d-note" style="font-size:9px">G1</text>
    <circle cx="180" cy="80" r="16" class="gpu-c"/>
    <text x="180" y="84" text-anchor="middle" class="d-note" style="font-size:9px">G2</text>
    <circle cx="100" cy="80" r="16" class="gpu-c"/>
    <text x="100" y="84" text-anchor="middle" class="d-note" style="font-size:9px">G3</text>
    <path d="M116,30 L162,30" class="arrow" style="stroke:#0072B2"/>
    <path d="M180,46 L180,62" class="arrow" style="stroke:#0072B2"/>
    <path d="M164,80 L118,80" class="arrow" style="stroke:#0072B2"/>
    <path d="M100,64 L100,48" class="arrow" style="stroke:#0072B2"/>

    <rect x="128" y="18" width="24" height="12" class="chunk-a" rx="2" style="opacity:0.8"/>
    <text x="140" y="28" text-anchor="middle" style="font-size:7px;fill:var(--ink,#1a1a1a)">Σa</text>
  </g>

  <!-- Final state -->
  <g transform="translate(340, 295)">
    <text x="0" y="15" class="d-note" style="font-size:10px">3 步后每 GPU 都有完整结果：</text>
    <text x="0" y="40" class="d-note" style="font-size:10px">GPU 0–3:</text>
    <rect x="68" y="28" width="40" height="16" class="chunk-a" rx="2" style="opacity:0.8"/>
    <text x="88" y="40" text-anchor="middle" class="d-note" style="font-size:8px;font-weight:600">Σa</text>
    <rect x="110" y="28" width="40" height="16" class="chunk-b" rx="2" style="opacity:0.8"/>
    <text x="130" y="40" text-anchor="middle" class="d-note" style="font-size:8px;font-weight:600">Σb</text>
    <rect x="152" y="28" width="40" height="16" class="chunk-c" rx="2" style="opacity:0.8"/>
    <text x="172" y="40" text-anchor="middle" class="d-note" style="font-size:8px;font-weight:600">Σc</text>
    <rect x="194" y="28" width="40" height="16" class="chunk-d" rx="2" style="opacity:0.8"/>
    <text x="214" y="40" text-anchor="middle" class="d-note" style="font-size:8px;font-weight:600">Σd</text>
  </g>

  <!-- Bandwidth formula -->
  <text x="360" y="430" text-anchor="middle" class="d-note">Ring 总传输量 = 2·(N-1)/N · D，当 N→∞ 趋近 2D（带宽最优）</text>

  <!-- Complexity -->
  <g transform="translate(50, 450)">
    <text x="0" y="0" class="d-note" style="font-size:10px">ReduceScatter：N-1 步 × D/N 数据 = (N-1)/N · D</text>
    <text x="350" y="0" class="d-note" style="font-size:10px">AllGather：N-1 步 × D/N 数据 = (N-1)/N · D</text>
  </g>

  <text x="360" y="495" text-anchor="middle" class="d-note" style="font-size:10px">延迟 = 2(N-1)·α + 2·(N-1)/N · D/B（α = 启动延迟，B = 链路带宽）</text>
</svg>
