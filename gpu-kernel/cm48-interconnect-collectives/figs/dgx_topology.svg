<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" class="d-fig">
  <style>
    .d-label { font: 600 13px "Inter", sans-serif; fill: var(--ink, #1a1a1a); }
    .d-note  { font: 400 11px "Inter", sans-serif; fill: var(--ink-2, #4a4a4a); }
    .d-box   { stroke: var(--rule, #e4e4e0); stroke-width: 1; }
    .gpu-box { fill: #009E73; opacity: 0.2; stroke: #009E73; stroke-width: 1.5; rx: 4; }
    .sw-box  { fill: #D55E00; opacity: 0.15; stroke: #D55E00; stroke-width: 1.5; rx: 4; }
    .nvl-link { stroke: #009E73; stroke-width: 1.5; }
    .ib-link  { stroke: #0072B2; stroke-width: 1.5; stroke-dasharray: 6,3; }
    .pci-link { stroke: #56B4E9; stroke-width: 1; stroke-dasharray: 3,2; }
  </style>

  <text x="360" y="24" text-anchor="middle" class="d-label">DGX H100 拓扑：NVSwitch 全互联</text>

  <!-- NVSwitch layer (4 switches) -->
  <g transform="translate(0, 60)">
    <rect x="145" y="0" width="90" height="30" class="sw-box"/>
    <text x="190" y="20" text-anchor="middle" class="d-note" style="font-size:10px">NVSwitch 0</text>
    <rect x="255" y="0" width="90" height="30" class="sw-box"/>
    <text x="300" y="20" text-anchor="middle" class="d-note" style="font-size:10px">NVSwitch 1</text>
    <rect x="365" y="0" width="90" height="30" class="sw-box"/>
    <text x="410" y="20" text-anchor="middle" class="d-note" style="font-size:10px">NVSwitch 2</text>
    <rect x="475" y="0" width="90" height="30" class="sw-box"/>
    <text x="520" y="20" text-anchor="middle" class="d-note" style="font-size:10px">NVSwitch 3</text>
  </g>

  <!-- GPU layer (8 GPUs) -->
  <g transform="translate(0, 150)">
    <rect x="30" y="0" width="65" height="35" class="gpu-box"/>
    <text x="62" y="22" text-anchor="middle" class="d-label" style="font-size:11px">GPU 0</text>
    <rect x="110" y="0" width="65" height="35" class="gpu-box"/>
    <text x="142" y="22" text-anchor="middle" class="d-label" style="font-size:11px">GPU 1</text>
    <rect x="190" y="0" width="65" height="35" class="gpu-box"/>
    <text x="222" y="22" text-anchor="middle" class="d-label" style="font-size:11px">GPU 2</text>
    <rect x="270" y="0" width="65" height="35" class="gpu-box"/>
    <text x="302" y="22" text-anchor="middle" class="d-label" style="font-size:11px">GPU 3</text>
    <rect x="370" y="0" width="65" height="35" class="gpu-box"/>
    <text x="402" y="22" text-anchor="middle" class="d-label" style="font-size:11px">GPU 4</text>
    <rect x="450" y="0" width="65" height="35" class="gpu-box"/>
    <text x="482" y="22" text-anchor="middle" class="d-label" style="font-size:11px">GPU 5</text>
    <rect x="530" y="0" width="65" height="35" class="gpu-box"/>
    <text x="562" y="22" text-anchor="middle" class="d-label" style="font-size:11px">GPU 6</text>
    <rect x="610" y="0" width="65" height="35" class="gpu-box"/>
    <text x="642" y="22" text-anchor="middle" class="d-label" style="font-size:11px">GPU 7</text>
  </g>

  <!-- NVLink connections: each GPU to all 4 switches -->
  <!-- GPU 0 -->
  <line x1="62" y1="150" x2="190" y2="90" class="nvl-link" opacity="0.3"/>
  <line x1="62" y1="150" x2="300" y2="90" class="nvl-link" opacity="0.3"/>
  <line x1="62" y1="150" x2="410" y2="90" class="nvl-link" opacity="0.3"/>
  <line x1="62" y1="150" x2="520" y2="90" class="nvl-link" opacity="0.3"/>
  <!-- GPU 3 (sample) -->
  <line x1="302" y1="150" x2="190" y2="90" class="nvl-link" opacity="0.3"/>
  <line x1="302" y1="150" x2="300" y2="90" class="nvl-link" opacity="0.3"/>
  <line x1="302" y1="150" x2="410" y2="90" class="nvl-link" opacity="0.3"/>
  <line x1="302" y1="150" x2="520" y2="90" class="nvl-link" opacity="0.3"/>
  <!-- GPU 7 -->
  <line x1="642" y1="150" x2="190" y2="90" class="nvl-link" opacity="0.3"/>
  <line x1="642" y1="150" x2="300" y2="90" class="nvl-link" opacity="0.3"/>
  <line x1="642" y1="150" x2="410" y2="90" class="nvl-link" opacity="0.3"/>
  <line x1="642" y1="150" x2="520" y2="90" class="nvl-link" opacity="0.3"/>

  <!-- "..." for other GPUs' connections -->
  <text x="360" y="130" text-anchor="middle" class="d-note" style="font-size:9px;fill:#009E73">每个 GPU 的 18 条 NVLink 分接到 4 个 NVSwitch</text>

  <!-- InfiniBand NICs below GPUs -->
  <g transform="translate(0, 220)">
    <text x="360" y="10" text-anchor="middle" class="d-label" style="font-size:11px">InfiniBand 网络接口</text>
    <rect x="70" y="20" width="120" height="25" fill="#0072B2" opacity="0.12" stroke="#0072B2" stroke-width="1" rx="3"/>
    <text x="130" y="37" text-anchor="middle" class="d-note" style="font-size:10px">CX-7 NIC ×4</text>
    <rect x="520" y="20" width="120" height="25" fill="#0072B2" opacity="0.12" stroke="#0072B2" stroke-width="1" rx="3"/>
    <text x="580" y="37" text-anchor="middle" class="d-note" style="font-size:10px">CX-7 NIC ×4</text>

    <line x1="130" y1="45" x2="130" y2="70" class="ib-link"/>
    <line x1="580" y1="45" x2="580" y2="70" class="ib-link"/>
  </g>

  <!-- IB Switch -->
  <g transform="translate(0, 310)">
    <rect x="200" y="0" width="320" height="30" fill="#0072B2" opacity="0.1" stroke="#0072B2" stroke-width="1.5" rx="4"/>
    <text x="360" y="20" text-anchor="middle" class="d-label" style="font-size:11px">InfiniBand NDR 交换机（到其他节点）</text>
    <line x1="130" y1="-20" x2="280" y2="0" class="ib-link"/>
    <line x1="580" y1="-20" x2="440" y2="0" class="ib-link"/>
  </g>

  <!-- Bandwidth labels -->
  <text x="360" y="370" text-anchor="middle" class="d-note" style="font-size:10px">节点内：8 GPU × 900 GB/s NVLink 4.0 全互联（via NVSwitch）</text>
  <text x="360" y="386" text-anchor="middle" class="d-note" style="font-size:10px">节点间：8× NDR 400 Gb/s = 3.2 Tb/s（每方向 400 GB/s）</text>

  <!-- Legend -->
  <line x1="130" y1="410" x2="160" y2="410" class="nvl-link"/>
  <text x="168" y="414" class="d-note" style="font-size:10px">NVLink</text>
  <line x1="250" y1="410" x2="280" y2="410" class="ib-link"/>
  <text x="288" y="414" class="d-note" style="font-size:10px">InfiniBand</text>
</svg>
