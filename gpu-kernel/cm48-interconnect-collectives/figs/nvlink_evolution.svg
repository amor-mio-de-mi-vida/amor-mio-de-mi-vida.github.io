<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" class="d-fig">
  <style>
    .d-label { font: 600 13px "Inter", sans-serif; fill: var(--ink, #1a1a1a); }
    .d-note  { font: 400 11px "Inter", sans-serif; fill: var(--ink-2, #4a4a4a); }
    .bar-nvl { fill: #009E73; opacity: 0.7; }
    .bar-pci { fill: #56B4E9; opacity: 0.5; }
    .grid-line { stroke: var(--rule, #e4e4e0); stroke-width: 0.5; }
  </style>

  <text x="360" y="24" text-anchor="middle" class="d-label">NVLink 代际带宽演进（双向峰值 GB/s）</text>

  <!-- Y axis grid lines -->
  <line x1="90" y1="60" x2="690" y2="60" class="grid-line"/>
  <line x1="90" y1="110" x2="690" y2="110" class="grid-line"/>
  <line x1="90" y1="160" x2="690" y2="160" class="grid-line"/>
  <line x1="90" y1="210" x2="690" y2="210" class="grid-line"/>
  <line x1="90" y1="260" x2="690" y2="260" class="grid-line"/>

  <!-- Y axis labels (0, 450, 900, 1350, 1800 GB/s) -->
  <text x="85" y="264" text-anchor="end" class="d-note">0</text>
  <text x="85" y="214" text-anchor="end" class="d-note">450</text>
  <text x="85" y="164" text-anchor="end" class="d-note">900</text>
  <text x="85" y="114" text-anchor="end" class="d-note">1350</text>
  <text x="85" y="64" text-anchor="end" class="d-note">1800</text>

  <!-- Baseline axis -->
  <line x1="90" y1="260" x2="690" y2="260" stroke="var(--ink-3,#8a8a86)" stroke-width="1"/>

  <!-- NVLink 1.0 (P100, 2016): 160 GB/s bidir -->
  <rect x="110" y="242" width="50" height="18" class="bar-nvl" rx="2"/>
  <text x="135" y="238" text-anchor="middle" class="d-note" style="font-size:10px;fill:#009E73">160</text>
  <text x="135" y="278" text-anchor="middle" class="d-note" style="font-size:10px">NVL 1.0</text>
  <text x="135" y="292" text-anchor="middle" class="d-note" style="font-size:9px">P100</text>

  <!-- NVLink 2.0 (V100, 2017): 300 GB/s bidir -->
  <rect x="200" y="227" width="50" height="33" class="bar-nvl" rx="2"/>
  <text x="225" y="222" text-anchor="middle" class="d-note" style="font-size:10px;fill:#009E73">300</text>
  <text x="225" y="278" text-anchor="middle" class="d-note" style="font-size:10px">NVL 2.0</text>
  <text x="225" y="292" text-anchor="middle" class="d-note" style="font-size:9px">V100</text>

  <!-- NVLink 3.0 (A100, 2020): 600 GB/s bidir -->
  <rect x="290" y="193" width="50" height="67" class="bar-nvl" rx="2"/>
  <text x="315" y="188" text-anchor="middle" class="d-note" style="font-size:10px;fill:#009E73">600</text>
  <text x="315" y="278" text-anchor="middle" class="d-note" style="font-size:10px">NVL 3.0</text>
  <text x="315" y="292" text-anchor="middle" class="d-note" style="font-size:9px">A100</text>

  <!-- NVLink 4.0 (H100, 2022): 900 GB/s bidir -->
  <rect x="380" y="160" width="50" height="100" class="bar-nvl" rx="2"/>
  <text x="405" y="155" text-anchor="middle" class="d-note" style="font-size:10px;fill:#009E73">900</text>
  <text x="405" y="278" text-anchor="middle" class="d-note" style="font-size:10px">NVL 4.0</text>
  <text x="405" y="292" text-anchor="middle" class="d-note" style="font-size:9px">H100</text>

  <!-- NVLink 5.0 (B200, 2024): 1800 GB/s bidir -->
  <rect x="470" y="60" width="50" height="200" class="bar-nvl" rx="2"/>
  <text x="495" y="55" text-anchor="middle" class="d-note" style="font-size:10px;fill:#009E73">1800</text>
  <text x="495" y="278" text-anchor="middle" class="d-note" style="font-size:10px">NVL 5.0</text>
  <text x="495" y="292" text-anchor="middle" class="d-note" style="font-size:9px">B200</text>

  <!-- PCIe reference bars -->
  <rect x="575" y="253" width="35" height="7" class="bar-pci" rx="2"/>
  <text x="592" y="249" text-anchor="middle" class="d-note" style="font-size:9px;fill:#56B4E9">64</text>
  <text x="592" y="278" text-anchor="middle" class="d-note" style="font-size:10px">PCIe 4</text>

  <rect x="625" y="246" width="35" height="14" class="bar-pci" rx="2"/>
  <text x="642" y="241" text-anchor="middle" class="d-note" style="font-size:9px;fill:#56B4E9">128</text>
  <text x="642" y="278" text-anchor="middle" class="d-note" style="font-size:10px">PCIe 5</text>

  <!-- Legend -->
  <rect x="110" y="320" width="12" height="12" class="bar-nvl" rx="1"/>
  <text x="128" y="331" class="d-note">NVLink 双向带宽</text>
  <rect x="260" y="320" width="12" height="12" class="bar-pci" rx="1"/>
  <text x="278" y="331" class="d-note">PCIe x16 双向带宽</text>

  <text x="360" y="352" text-anchor="middle" class="d-note" style="font-size:10px">双向口径：NVLink 4.0 ≈ 7× PCIe 5.0 x16；NVLink 5.0 ≈ 14× PCIe 5.0 x16</text>
</svg>
