<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" class="d-fig">
  <style>
    .d-label { font: 600 13px "Inter", sans-serif; fill: var(--ink, #1a1a1a); }
    .d-note  { font: 400 11px "Inter", sans-serif; fill: var(--ink-2, #4a4a4a); }
    .tray-box { fill: var(--bg-2, #f5f5f2); stroke: var(--ink-3, #8a8a86); stroke-width: 1; rx: 6; }
    .gpu-sm  { fill: #009E73; opacity: 0.25; stroke: #009E73; stroke-width: 1; rx: 3; }
    .sw-box  { fill: #D55E00; opacity: 0.15; stroke: #D55E00; stroke-width: 1.5; rx: 4; }
    .nvl-link { stroke: #009E73; stroke-width: 1.5; }
    .nvl-cross { stroke: #CC79A7; stroke-width: 2; }
    .egm-zone { fill: #56B4E9; opacity: 0.08; stroke: #56B4E9; stroke-width: 1; stroke-dasharray: 4,2; rx: 8; }
  </style>

  <text x="360" y="24" text-anchor="middle" class="d-label">MNNVL：跨节点 NVLink 域（GB200 NVL72 示意）</text>

  <!-- Tray 1 (node-like unit, 2 GPUs) -->
  <rect x="40" y="60" width="140" height="140" class="tray-box"/>
  <text x="110" y="80" text-anchor="middle" class="d-label" style="font-size:10px">Compute Tray 1</text>
  <rect x="55" y="90" width="50" height="30" class="gpu-sm"/>
  <text x="80" y="110" text-anchor="middle" class="d-note" style="font-size:9px">B200</text>
  <rect x="115" y="90" width="50" height="30" class="gpu-sm"/>
  <text x="140" y="110" text-anchor="middle" class="d-note" style="font-size:9px">B200</text>
  <line x1="105" y1="105" x2="115" y2="105" class="nvl-link"/>

  <!-- Tray 2 -->
  <rect x="200" y="60" width="140" height="140" class="tray-box"/>
  <text x="270" y="80" text-anchor="middle" class="d-label" style="font-size:10px">Compute Tray 2</text>
  <rect x="215" y="90" width="50" height="30" class="gpu-sm"/>
  <text x="240" y="110" text-anchor="middle" class="d-note" style="font-size:9px">B200</text>
  <rect x="275" y="90" width="50" height="30" class="gpu-sm"/>
  <text x="300" y="110" text-anchor="middle" class="d-note" style="font-size:9px">B200</text>

  <!-- ... -->
  <text x="385" y="110" text-anchor="middle" class="d-label" style="font-size:16px">···</text>

  <!-- Tray N -->
  <rect x="420" y="60" width="140" height="140" class="tray-box"/>
  <text x="490" y="80" text-anchor="middle" class="d-label" style="font-size:10px">Compute Tray 36</text>
  <rect x="435" y="90" width="50" height="30" class="gpu-sm"/>
  <text x="460" y="110" text-anchor="middle" class="d-note" style="font-size:9px">B200</text>
  <rect x="495" y="90" width="50" height="30" class="gpu-sm"/>
  <text x="520" y="110" text-anchor="middle" class="d-note" style="font-size:9px">B200</text>

  <!-- NVLink Switch layer -->
  <rect x="80" y="230" width="480" height="35" class="sw-box"/>
  <text x="320" y="252" text-anchor="middle" class="d-label" style="font-size:11px">NVLink Switch System（跨节点 NVSwitch 组）</text>

  <!-- NVLink connections from trays to switch -->
  <line x1="80" y1="200" x2="160" y2="230" class="nvl-link" opacity="0.5"/>
  <line x1="140" y1="200" x2="240" y2="230" class="nvl-link" opacity="0.5"/>
  <line x1="240" y1="200" x2="320" y2="230" class="nvl-link" opacity="0.5"/>
  <line x1="300" y1="200" x2="400" y2="230" class="nvl-link" opacity="0.5"/>
  <line x1="460" y1="200" x2="440" y2="230" class="nvl-link" opacity="0.5"/>
  <line x1="520" y1="200" x2="520" y2="230" class="nvl-link" opacity="0.5"/>

  <!-- Cross-node NVLink label -->
  <text x="600" y="215" class="d-note" style="font-size:10px;fill:#CC79A7">NVLink 5.0</text>
  <text x="600" y="230" class="d-note" style="font-size:10px;fill:#CC79A7">跨节点</text>

  <!-- EGM zone -->
  <rect x="30" y="48" width="545" height="230" class="egm-zone"/>
  <text x="590" y="155" class="d-label" style="font-size:11px;fill:#56B4E9">EGM 域</text>
  <text x="590" y="172" class="d-note" style="font-size:10px;fill:#56B4E9">任意 GPU 可</text>
  <text x="590" y="186" class="d-note" style="font-size:10px;fill:#56B4E9">load/store</text>
  <text x="590" y="200" class="d-note" style="font-size:10px;fill:#56B4E9">远端显存</text>

  <!-- Key specs -->
  <g transform="translate(50, 295)">
    <text x="0" y="0" class="d-label" style="font-size:11px">GB200 NVL72 关键参数</text>
    <text x="0" y="20" class="d-note" style="font-size:10px">· 36 个 Grace CPU + 72 个 B200 GPU（36 Compute Trays）</text>
    <text x="0" y="36" class="d-note" style="font-size:10px">· NVLink 5.0：每 GPU 1800 GB/s 双向</text>
    <text x="0" y="52" class="d-note" style="font-size:10px">· 全部 72 GPU 通过 NVSwitch 全互联 → 单一 NVLink 域</text>
    <text x="0" y="68" class="d-note" style="font-size:10px">· EGM：任意 GPU 可通过 load/store 指令访问任意 GPU 的显存</text>
    <text x="0" y="84" class="d-note" style="font-size:10px">· 总 GPU 显存：72 × 192 GB = 13.8 TB（单一可寻址空间）</text>
  </g>
</svg>
