<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280">
<style>
  text{font-family:system-ui,sans-serif;font-size:12px;fill:#23272f}
  .title{font-size:12px;font-weight:700}
  .label{font-size:11px;fill:#6b7280}
  .code{font-family:ui-monospace,monospace;font-size:10.5px}
</style>
<text x="350" y="18" text-anchor="middle" class="title">Conditional Rescale: Skip When Row Max Is Stable</text>

<!-- Timeline with tiles -->
<text x="35" y="50" class="title">Tile index:</text>
<text x="35" y="70" class="label">row max (m):</text>
<text x="35" y="90" class="label">rescale?</text>

<!-- Tile 0 -->
<rect x="140" y="38" width="70" height="25" rx="3" fill="#fef9c3" stroke="#eab308"/>
<text x="175" y="55" text-anchor="middle" class="code">t=0</text>
<text x="175" y="70" text-anchor="middle" class="code">3.2</text>
<text x="175" y="90" text-anchor="middle" class="label" fill="#dc2626">YES</text>

<!-- Tile 1 -->
<rect x="220" y="38" width="70" height="25" rx="3" fill="#fef9c3" stroke="#eab308"/>
<text x="255" y="55" text-anchor="middle" class="code">t=1</text>
<text x="255" y="70" text-anchor="middle" class="code">5.8</text>
<text x="255" y="90" text-anchor="middle" class="label" fill="#dc2626">YES</text>

<!-- Tile 2 -->
<rect x="300" y="38" width="70" height="25" rx="3" fill="#dcfce7" stroke="#22c55e"/>
<text x="335" y="55" text-anchor="middle" class="code">t=2</text>
<text x="335" y="70" text-anchor="middle" class="code">5.8</text>
<text x="335" y="90" text-anchor="middle" class="label" fill="#16a34a">SKIP</text>

<!-- Tile 3 -->
<rect x="380" y="38" width="70" height="25" rx="3" fill="#dcfce7" stroke="#22c55e"/>
<text x="415" y="55" text-anchor="middle" class="code">t=3</text>
<text x="415" y="70" text-anchor="middle" class="code">5.8</text>
<text x="415" y="90" text-anchor="middle" class="label" fill="#16a34a">SKIP</text>

<!-- Tile 4 -->
<rect x="460" y="38" width="70" height="25" rx="3" fill="#dcfce7" stroke="#22c55e"/>
<text x="495" y="55" text-anchor="middle" class="code">t=4</text>
<text x="495" y="70" text-anchor="middle" class="code">5.9</text>
<text x="495" y="90" text-anchor="middle" class="label" fill="#16a34a">SKIP</text>

<!-- Tile 5 -->
<rect x="540" y="38" width="70" height="25" rx="3" fill="#dcfce7" stroke="#22c55e"/>
<text x="575" y="55" text-anchor="middle" class="code">t=5</text>
<text x="575" y="70" text-anchor="middle" class="code">5.9</text>
<text x="575" y="90" text-anchor="middle" class="label" fill="#16a34a">SKIP</text>

<!-- Tile 6 -->
<rect x="620" y="38" width="60" height="25" rx="3" fill="#dcfce7" stroke="#22c55e"/>
<text x="650" y="55" text-anchor="middle" class="code">...</text>
<text x="650" y="90" text-anchor="middle" class="label" fill="#16a34a">SKIP</text>

<!-- Explanation -->
<rect x="20" y="115" width="315" height="150" rx="5" fill="#fef2f2" stroke="#ef4444"/>
<text x="177" y="135" text-anchor="middle" class="title" fill="#dc2626">Without Conditional Rescale</text>
<text x="35" y="158" class="code">for each tile t:</text>
<text x="35" y="176" class="code">  scale = exp(m_old - m_new)</text>
<text x="35" y="194" class="code">  for j in 0..d: acc_o[j] *= scale</text>
<text x="35" y="218" class="label">Every tile: d multiplications (d=128 &#x2192; 128 FMA)</text>
<text x="35" y="236" class="label">6 tiles &#xd7; 128 = 768 FMA for rescale alone</text>
<text x="35" y="252" class="label" fill="#dc2626">&#x2717; Most are multiply-by-1 (wasted)</text>

<rect x="365" y="115" width="315" height="150" rx="5" fill="#dcfce7" stroke="#22c55e"/>
<text x="522" y="135" text-anchor="middle" class="title" fill="#16a34a">With Conditional Rescale (FA4)</text>
<text x="380" y="158" class="code">for each tile t:</text>
<text x="380" y="176" class="code">  if |m_old - m_new| &gt; &#x3b5;:</text>
<text x="380" y="194" class="code">    scale = exp(m_old - m_new)</text>
<text x="380" y="212" class="code">    for j in 0..d: acc_o[j] *= scale</text>
<text x="380" y="236" class="label">Only 2/6 tiles rescale: 2 &#xd7; 128 = 256 FMA</text>
<text x="380" y="252" class="label" fill="#16a34a">&#x2713; 67% fewer non-matrix FMA</text>

<text x="350" y="278" text-anchor="middle" font-size="10.5" fill="#aaa" font-style="italic">data-source: illustrative &#x2014; values are conceptual</text>
</svg>
