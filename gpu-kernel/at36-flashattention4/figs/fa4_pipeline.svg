<svg viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', sans-serif">
  <style>
    .title { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
    .label { font-size: 12px; fill: #1a1a1a; }
    .sublabel { font-size: 10px; fill: #666; }
    .box { rx: 4; ry: 4; }
  </style>
  <defs>
    <marker id="ah10" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#999"/>
    </marker>
  </defs>

  <text x="360" y="22" text-anchor="middle" class="title">FA4 Pipeline 时间线（多 tile 流水）</text>

  <!-- Time axis -->
  <line x1="60" y1="250" x2="700" y2="250" stroke="#999" stroke-width="1" marker-end="url(#ah10)"/>
  <text x="705" y="255" class="sublabel">time</text>

  <!-- Row labels -->
  <text x="10" y="65" class="sublabel" font-weight="600">Load</text>
  <text x="10" y="110" class="sublabel" font-weight="600">MMA</text>
  <text x="10" y="155" class="sublabel" font-weight="600">Softmax</text>
  <text x="10" y="200" class="sublabel" font-weight="600">Rescale</text>

  <!-- Tile 0 -->
  <rect x="70" y="48" width="80" height="25" class="box" fill="#1976D2" opacity="0.7"/>
  <text x="110" y="65" text-anchor="middle" class="sublabel" fill="white">K₀V₀</text>

  <rect x="155" y="93" width="100" height="25" class="box" fill="#388E3C" opacity="0.85"/>
  <text x="205" y="110" text-anchor="middle" class="sublabel" fill="white">GEMM₀ (t0)</text>

  <rect x="260" y="138" width="70" height="25" class="box" fill="#D55E00" opacity="0.85"/>
  <text x="295" y="155" text-anchor="middle" class="sublabel" fill="white">smax(t0)</text>

  <rect x="335" y="93" width="100" height="25" class="box" fill="#388E3C" opacity="0.85"/>
  <text x="385" y="110" text-anchor="middle" class="sublabel" fill="white">GEMM₁ (t0)</text>

  <!-- Tile 1 (pipelined) -->
  <rect x="155" y="48" width="80" height="25" class="box" fill="#1976D2" opacity="0.7"/>
  <text x="195" y="65" text-anchor="middle" class="sublabel" fill="white">K₁V₁</text>

  <rect x="260" y="93" width="100" height="25" class="box" fill="#388E3C" opacity="0.6"/>
  <text x="310" y="110" text-anchor="middle" class="sublabel" fill="white">GEMM₀ (t1)</text>

  <rect x="365" y="138" width="70" height="25" class="box" fill="#D55E00" opacity="0.6"/>
  <text x="400" y="155" text-anchor="middle" class="sublabel" fill="white">smax(t1)</text>

  <rect x="440" y="93" width="100" height="25" class="box" fill="#388E3C" opacity="0.6"/>
  <text x="490" y="110" text-anchor="middle" class="sublabel" fill="white">GEMM₁ (t1)</text>

  <!-- Tile 2 -->
  <rect x="240" y="48" width="80" height="25" class="box" fill="#1976D2" opacity="0.5"/>
  <text x="280" y="65" text-anchor="middle" class="sublabel" fill="white">K₂V₂</text>

  <rect x="365" y="93" width="100" height="25" class="box" fill="#388E3C" opacity="0.4"/>
  <text x="415" y="110" text-anchor="middle" class="sublabel" fill="white">GEMM₀ (t2)</text>

  <!-- Conditional rescale (sparse) -->
  <rect x="440" y="183" width="55" height="25" class="box" fill="#7B1FA2" opacity="0.5"/>
  <text x="467" y="200" text-anchor="middle" class="sublabel" fill="white">rescale</text>

  <!-- No rescale annotation -->
  <text x="350" y="200" class="sublabel" fill="#7B1FA2">跳过</text>
  <text x="520" y="200" class="sublabel" fill="#7B1FA2">跳过</text>

  <!-- Legend -->
  <rect x="70" y="262" width="30" height="10" rx="2" fill="#1976D2" opacity="0.7"/>
  <text x="105" y="272" class="sublabel">TMA load</text>
  <rect x="180" y="262" width="30" height="10" rx="2" fill="#388E3C" opacity="0.85"/>
  <text x="215" y="272" class="sublabel">tcgen05 MMA</text>
  <rect x="310" y="262" width="30" height="10" rx="2" fill="#D55E00" opacity="0.85"/>
  <text x="345" y="272" class="sublabel">softmax (sw exp2)</text>
  <rect x="450" y="262" width="30" height="10" rx="2" fill="#7B1FA2" opacity="0.5"/>
  <text x="485" y="272" class="sublabel">条件 rescale（仅 max 变化大时）</text>
</svg>
