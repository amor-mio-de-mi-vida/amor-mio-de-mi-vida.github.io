<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300">
<style>
  text{font-family:system-ui,sans-serif;font-size:12px;fill:#23272f}
  .title{font-size:12px;font-weight:700}
  .label{font-size:11px;fill:#6b7280}
  .code{font-family:ui-monospace,monospace;font-size:10.5px}
</style>
<text x="350" y="18" text-anchor="middle" class="title">Software exp2 vs MUFU exp: Throughput Comparison</text>

<!-- MUFU path -->
<rect x="20" y="35" width="310" height="120" rx="5" fill="#fef2f2" stroke="#ef4444"/>
<text x="175" y="55" text-anchor="middle" class="title" fill="#dc2626">MUFU (Hardware SFU)</text>
<text x="35" y="80" class="code">exp(x) &#x2192; 1 MUFU instruction</text>
<text x="35" y="100" class="label">Throughput: ~256 ops/clk/SM</text>
<text x="35" y="118" class="label">Shared with sin, cos, rsqrt &#x2014; contention</text>
<text x="35" y="136" class="label" fill="#dc2626">&#x2717; Bottleneck: 16x slower than Tensor Core</text>

<!-- SW exp2 path -->
<rect x="370" y="35" width="310" height="120" rx="5" fill="#dcfce7" stroke="#22c55e"/>
<text x="525" y="55" text-anchor="middle" class="title" fill="#16a34a">Software exp2 (6th-order Polynomial)</text>
<text x="385" y="80" class="code">2^x &#x2248; c6&#xb7;x&#x2076;+c5&#xb7;x&#x2075;+...+c0</text>
<text x="385" y="100" class="label">Throughput: 6 FMA on CUDA cores</text>
<text x="385" y="118" class="label">Uses FP32 units &#x2014; no MUFU contention</text>
<text x="385" y="136" class="label" fill="#16a34a">&#x2713; Frees MUFU for other ops</text>

<!-- Polynomial detail -->
<rect x="20" y="175" width="660" height="110" rx="5" fill="#f3f4f6" stroke="#d1d5db"/>
<text x="350" y="195" text-anchor="middle" class="title">Horner&#x2019;s Method: 6 FMA Chain</text>

<text x="35" y="220" class="code">r = c6;</text>
<text x="35" y="238" class="code">r = r*x + c5;  r = r*x + c4;  r = r*x + c3;</text>
<text x="35" y="256" class="code">r = r*x + c2;  r = r*x + c1;  r = r*x + c0;</text>
<text x="35" y="274" class="label">6 dependent FMA &#x2014; sequential per element, but ILP across rows.</text>
<text x="430" y="274" class="label">Max relative error &#x2248; 10&#x207b;&#x2077; on [-0.5, 0]</text>

<text x="350" y="298" text-anchor="middle" font-size="10.5" fill="#aaa" font-style="italic">data-source: illustrative &#x2014; coefficients are approximate</text>
</svg>
