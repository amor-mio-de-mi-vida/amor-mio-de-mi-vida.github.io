<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320">
<style>
  text{font-family:system-ui,sans-serif;font-size:12px;fill:#23272f}
  .title{font-size:12px;font-weight:700}
  .label{font-size:11px;fill:#6b7280}
  .code{font-family:ui-monospace,monospace;font-size:10.5px}
  .box{rx:5;ry:5;stroke-width:1.2}
</style>
<text x="350" y="18" text-anchor="middle" class="title">Winograd F(2&#xd7;2, 3&#xd7;3): 16 Batched GEMMs</text>

<!-- Input tiles -->
<rect x="20" y="35" width="150" height="90" class="box" fill="#eff6ff" stroke="#3b82f6"/>
<text x="95" y="55" text-anchor="middle" class="title" fill="#2563eb">Input Tiles</text>
<text x="35" y="75" class="code">4&#xd7;4 patch per tile</text>
<text x="35" y="92" class="code">tiles = H_out/2 &#xd7; W_out/2</text>
<text x="35" y="109" class="label">&#xd7; N_batch</text>

<!-- Arrow 1 -->
<line x1="170" y1="80" x2="195" y2="80" stroke="#888" stroke-width="1.2" marker-end="url(#arr3)"/>
<text x="183" y="72" class="label">B<tspan font-size="8" baseline-shift="super">T</tspan>dB</text>

<!-- V matrices -->
<rect x="200" y="35" width="130" height="90" class="box" fill="#dbeafe" stroke="#93c5fd"/>
<text x="265" y="55" text-anchor="middle" class="title" fill="#2563eb">V[k]</text>
<text x="215" y="75" class="code">[C_in, tiles]</text>
<text x="215" y="92" class="code">k = 0..15</text>
<text x="215" y="109" class="label">16 matrices</text>

<!-- Filter -->
<rect x="20" y="145" width="150" height="60" class="box" fill="#fef3c7" stroke="#f59e0b"/>
<text x="95" y="165" text-anchor="middle" class="title" fill="#d97706">Filter [C_out, C_in, 3, 3]</text>
<text x="35" y="185" class="label">GgG<tspan font-size="8" baseline-shift="super">T</tspan> pre-computed</text>

<!-- Arrow 2 -->
<line x1="170" y1="175" x2="195" y2="175" stroke="#888" stroke-width="1.2" marker-end="url(#arr3)"/>

<!-- U matrices -->
<rect x="200" y="145" width="130" height="60" class="box" fill="#fde68a" stroke="#f59e0b"/>
<text x="265" y="165" text-anchor="middle" class="title" fill="#d97706">U[k]</text>
<text x="215" y="185" class="code">[C_out, C_in] &#xd7;16</text>

<!-- Batched GEMM -->
<rect x="370" y="60" width="180" height="120" class="box" fill="#dcfce7" stroke="#22c55e"/>
<text x="460" y="85" text-anchor="middle" class="title" fill="#16a34a">16&#xd7; Batched GEMM</text>
<text x="385" y="108" class="code">M[k] = U[k] &#xd7; V[k]</text>
<text x="385" y="128" class="code">[C_out, tiles]</text>
<text x="385" y="148" class="label">Tensor Core accelerated</text>
<text x="385" y="165" class="label">cuBLAS batched GEMM</text>

<line x1="330" y1="80" x2="370" y2="100" stroke="#22c55e" stroke-width="1.2" marker-end="url(#arr3)"/>
<line x1="330" y1="170" x2="370" y2="140" stroke="#22c55e" stroke-width="1.2" marker-end="url(#arr3)"/>

<!-- Output transform -->
<rect x="585" y="75" width="100" height="90" class="box" fill="#fce7f3" stroke="#ec4899"/>
<text x="635" y="98" text-anchor="middle" class="title" fill="#db2777">A<tspan font-size="8" baseline-shift="super">T</tspan>MA</text>
<text x="595" y="118" class="code">2&#xd7;2 output</text>
<text x="595" y="135" class="code">per tile</text>
<text x="595" y="152" class="label">inverse transform</text>

<line x1="550" y1="120" x2="585" y2="120" stroke="#ec4899" stroke-width="1.2" marker-end="url(#arr3)"/>

<!-- FLOP comparison -->
<rect x="20" y="230" width="660" height="60" class="box" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="35" y="250" class="title">FLOP Comparison (C_in=C_out=128, 56&#xd7;56 output, 3&#xd7;3 filter):</text>
<text x="35" y="270" class="code">Direct GEMM: 128&#xb7;128&#xb7;9&#xb7;56&#xb7;56&#xb7;2 = 587M FLOP</text>
<text x="390" y="270" class="code">Winograd: 16&#xb7;128&#xb7;128&#xb7;784&#xb7;2 = 411M FLOP</text>
<text x="35" y="285" class="label" fill="#16a34a">Winograd saves ~30% multiply FLOPs, but adds ~100M transform FLOPs &#x2192; net ~20% faster</text>

<defs><marker id="arr3" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
  <path d="M0,0 L6,2.5 L0,5" fill="#888"/>
</marker></defs>
<text x="350" y="315" text-anchor="middle" font-size="10.5" fill="#aaa" font-style="italic">data-source: computed (ResNet layer3, batch=1)</text>
</svg>
