<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300">
<style>
  text{font-family:system-ui,sans-serif;font-size:12px;fill:#23272f}
  .title{font-size:12px;font-weight:700}
  .label{font-size:11px;fill:#6b7280}
  .code{font-family:ui-monospace,monospace;font-size:10.5px}
</style>
<text x="350" y="18" text-anchor="middle" class="title">NVLS (NVLink SHARP): Ring AllReduce vs In-Network Reduction</text>

<!-- Left: Ring AllReduce -->
<rect x="20" y="32" width="310" height="230" rx="5" fill="#fef2f2" stroke="#ef4444" stroke-width="1.2"/>
<text x="175" y="52" text-anchor="middle" class="title" fill="#dc2626">传统 Ring AllReduce</text>

<circle cx="85" cy="95" r="16" fill="#fee2e2" stroke="#ef4444"/>
<text x="85" y="99" text-anchor="middle" class="code">G0</text>
<circle cx="175" cy="95" r="16" fill="#fee2e2" stroke="#ef4444"/>
<text x="175" y="99" text-anchor="middle" class="code">G1</text>
<circle cx="265" cy="95" r="16" fill="#fee2e2" stroke="#ef4444"/>
<text x="265" y="99" text-anchor="middle" class="code">G2</text>
<circle cx="175" cy="155" r="16" fill="#fee2e2" stroke="#ef4444"/>
<text x="175" y="159" text-anchor="middle" class="code">G3</text>

<!-- Ring arrows -->
<line x1="101" y1="90" x2="157" y2="90" stroke="#ef4444" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="191" y1="90" x2="247" y2="90" stroke="#ef4444" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="258" y1="110" x2="192" y2="145" stroke="#ef4444" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="159" y1="149" x2="92" y2="110" stroke="#ef4444" stroke-width="1.2" marker-end="url(#ar)"/>

<text x="40" y="190" class="label">步数: 2(N-1) = 6</text>
<text x="40" y="208" class="label">延迟: 6 × (α + D/4B)</text>
<text x="40" y="226" class="label" fill="#dc2626">每步都要等上一步完成</text>
<text x="40" y="244" class="label" fill="#dc2626">数据在 GPU 之间逐跳传递</text>

<!-- Right: NVLS SHARP -->
<rect x="370" y="32" width="310" height="230" rx="5" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2"/>
<text x="525" y="52" text-anchor="middle" class="title" fill="#16a34a">NVLS In-Network Reduction</text>

<!-- NVSwitch in center -->
<rect x="460" y="100" width="130" height="40" rx="8" fill="#86efac" stroke="#22c55e" stroke-width="1.5"/>
<text x="525" y="118" text-anchor="middle" class="code" fill="#16a34a">NVSwitch</text>
<text x="525" y="132" text-anchor="middle" font-size="9" fill="#16a34a">SHARP engine</text>

<!-- GPUs around NVSwitch -->
<circle cx="410" cy="85" r="16" fill="#bbf7d0" stroke="#22c55e"/>
<text x="410" y="89" text-anchor="middle" class="code">G0</text>
<circle cx="640" cy="85" r="16" fill="#bbf7d0" stroke="#22c55e"/>
<text x="640" y="89" text-anchor="middle" class="code">G1</text>
<circle cx="410" cy="170" r="16" fill="#bbf7d0" stroke="#22c55e"/>
<text x="410" y="174" text-anchor="middle" class="code">G2</text>
<circle cx="640" cy="170" r="16" fill="#bbf7d0" stroke="#22c55e"/>
<text x="640" y="174" text-anchor="middle" class="code">G3</text>

<!-- Lines to NVSwitch (bidirectional) -->
<line x1="425" y1="90" x2="460" y2="108" stroke="#22c55e" stroke-width="1.2"/>
<line x1="624" y1="90" x2="590" y2="108" stroke="#22c55e" stroke-width="1.2"/>
<line x1="425" y1="165" x2="460" y2="135" stroke="#22c55e" stroke-width="1.2"/>
<line x1="624" y1="165" x2="590" y2="135" stroke="#22c55e" stroke-width="1.2"/>

<text x="390" y="205" class="label">步数: 1 (写入) + 1 (读回) = 2</text>
<text x="390" y="223" class="label">延迟: 2α + D/B</text>
<text x="390" y="241" class="label" fill="#16a34a">NVSwitch 硬件归约, 无多步传递</text>

<!-- Comparison -->
<rect x="20" y="270" width="660" height="22" rx="4" fill="#f0fdf4" stroke="#22c55e"/>
<text x="350" y="285" text-anchor="middle" class="label" fill="#16a34a">NVLS 延迟降低 3-5×: 从 O(N) 步降到 O(1) 步, 特别适合小到中等消息的 AllReduce</text>

<defs>
<marker id="ar" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto"><path d="M0,0 L6,2.5 L0,5" fill="#ef4444"/></marker>
</defs>
<text x="350" y="298" text-anchor="middle" font-size="10.5" fill="#aaa" font-style="italic">data-source: illustrative</text>
</svg>
