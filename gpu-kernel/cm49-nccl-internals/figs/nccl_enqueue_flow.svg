<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320">
<style>
  text{font-family:system-ui,sans-serif;font-size:12px;fill:#23272f}
  .title{font-size:12px;font-weight:700}
  .label{font-size:11px;fill:#6b7280}
  .code{font-family:ui-monospace,monospace;font-size:10.5px}
</style>
<text x="350" y="18" text-anchor="middle" class="title">NCCL 运行时 Enqueue 流程</text>

<!-- Step 1: API call -->
<rect x="20" y="35" width="130" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/>
<text x="85" y="55" text-anchor="middle" class="code" fill="#2563eb">ncclAllReduce()</text>
<text x="85" y="72" text-anchor="middle" class="label">用户 API 调用</text>

<!-- Arrow -->
<line x1="150" y1="60" x2="182" y2="60" stroke="#6b7280" stroke-width="1.2" marker-end="url(#a1)"/>

<!-- Step 2: Enqueue -->
<rect x="185" y="35" width="130" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
<text x="250" y="55" text-anchor="middle" class="code" fill="#a16207">ncclEnqueueCheck</text>
<text x="250" y="72" text-anchor="middle" class="label">参数检查 + 入队</text>

<!-- Arrow -->
<line x1="315" y1="60" x2="347" y2="60" stroke="#6b7280" stroke-width="1.2" marker-end="url(#a1)"/>

<!-- Step 3: Algo/Proto select -->
<rect x="350" y="35" width="145" height="50" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2"/>
<text x="422" y="55" text-anchor="middle" class="code" fill="#16a34a">tuning 代价模型</text>
<text x="422" y="72" text-anchor="middle" class="label">选择 algo + proto</text>

<!-- Arrow -->
<line x1="495" y1="60" x2="527" y2="60" stroke="#6b7280" stroke-width="1.2" marker-end="url(#a1)"/>

<!-- Step 4: Kernel launch -->
<rect x="530" y="35" width="150" height="50" rx="6" fill="#fce7f3" stroke="#ec4899" stroke-width="1.2"/>
<text x="605" y="55" text-anchor="middle" class="code" fill="#be185d">ncclKernel&lt;&gt;</text>
<text x="605" y="72" text-anchor="middle" class="label">GPU kernel 启动</text>

<!-- Detail boxes below -->
<!-- Algo selection details -->
<rect x="20" y="110" width="320" height="90" rx="5" fill="#f9fafb" stroke="#d1d5db"/>
<text x="180" y="130" text-anchor="middle" class="title">算法选择逻辑</text>
<text x="30" y="150" class="label">1. 输入：拓扑图、channel 数、消息大小</text>
<text x="30" y="168" class="label">2. 对每个 (algo, proto) 估算 延迟 + 字节数 / 带宽</text>
<text x="30" y="186" class="label">3. 取估算时间最小的组合（没有固定字节阈值）</text>

<!-- Proto selection details -->
<rect x="360" y="110" width="320" height="90" rx="5" fill="#f9fafb" stroke="#d1d5db"/>
<text x="520" y="130" text-anchor="middle" class="title">协议选择逻辑</text>
<text x="370" y="150" class="label">LL：带宽效率 50%，延迟最低</text>
<text x="370" y="168" class="label">LL128：效率 120/128，需平台支持</text>
<text x="370" y="186" class="label">Simple：效率 100%，每步固定开销最大</text>

<!-- Kernel template -->
<rect x="20" y="220" width="660" height="85" rx="5" fill="#fef2f2" stroke="#ef4444"/>
<text x="350" y="240" text-anchor="middle" class="title" fill="#dc2626">设备代码生成与分派</text>
<text x="30" y="262" class="code" fill="#dc2626">设备函数按 (coll, redop, type, algo, proto) 生成</text>
<text x="30" y="280" class="label">例：AllReduce · Sum · bf16 · RING · LL128 是一个独立的设备函数</text>
<text x="30" y="296" class="label">kernel 入口较少，运行时按 work 中的函数 ID 分派到对应设备函数</text>

<defs><marker id="a1" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto"><path d="M0,0 L6,2.5 L0,5" fill="#6b7280"/></marker></defs>
<text x="350" y="318" text-anchor="middle" font-size="10.5" fill="#aaa" font-style="italic">data-source: illustrative</text>
</svg>
