<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" class="d-fig">
  <style>
    .d-label { font: 600 13px "Inter", sans-serif; fill: var(--ink, #1a1a1a); }
    .d-note  { font: 400 11px "Inter", sans-serif; fill: var(--ink-2, #4a4a4a); }
    .gpu-c   { fill: none; stroke: var(--ink-3, #8a8a86); stroke-width: 1.5; }
    .ring0   { stroke: #009E73; stroke-width: 2; fill: none; marker-end: url(#ra0); }
    .ring1   { stroke: #56B4E9; stroke-width: 2; fill: none; marker-end: url(#ra1); stroke-dasharray: 6,3; }
    .ring2   { stroke: #D55E00; stroke-width: 2; fill: none; marker-end: url(#ra2); stroke-dasharray: 3,3; }
    .ch-fill { opacity: 0.15; rx: 3; }
  </style>

  <defs>
    <marker id="ra0" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#009E73"/>
    </marker>
    <marker id="ra1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#56B4E9"/>
    </marker>
    <marker id="ra2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#D55E00"/>
    </marker>
  </defs>

  <text x="360" y="24" text-anchor="middle" class="d-label">NCCL Channel 与多 Ring 并行</text>

  <!-- 8 GPUs in a circle -->
  <g transform="translate(200, 185)">
    <!-- GPU positions on circle r=110 -->
    <circle cx="0" cy="-110" r="22" class="gpu-c" fill="var(--bg,#fff)"/>
    <text x="0" y="-106" text-anchor="middle" class="d-label" style="font-size:10px">GPU 0</text>

    <circle cx="78" cy="-78" r="22" class="gpu-c" fill="var(--bg,#fff)"/>
    <text x="78" y="-74" text-anchor="middle" class="d-label" style="font-size:10px">GPU 1</text>

    <circle cx="110" cy="0" r="22" class="gpu-c" fill="var(--bg,#fff)"/>
    <text x="110" y="4" text-anchor="middle" class="d-label" style="font-size:10px">GPU 2</text>

    <circle cx="78" cy="78" r="22" class="gpu-c" fill="var(--bg,#fff)"/>
    <text x="78" y="82" text-anchor="middle" class="d-label" style="font-size:10px">GPU 3</text>

    <circle cx="0" cy="110" r="22" class="gpu-c" fill="var(--bg,#fff)"/>
    <text x="0" y="114" text-anchor="middle" class="d-label" style="font-size:10px">GPU 4</text>

    <circle cx="-78" cy="78" r="22" class="gpu-c" fill="var(--bg,#fff)"/>
    <text x="-78" y="82" text-anchor="middle" class="d-label" style="font-size:10px">GPU 5</text>

    <circle cx="-110" cy="0" r="22" class="gpu-c" fill="var(--bg,#fff)"/>
    <text x="-110" y="4" text-anchor="middle" class="d-label" style="font-size:10px">GPU 6</text>

    <circle cx="-78" cy="-78" r="22" class="gpu-c" fill="var(--bg,#fff)"/>
    <text x="-78" y="-74" text-anchor="middle" class="d-label" style="font-size:10px">GPU 7</text>

    <!-- Ring 0 (green): 0→1→2→3→4→5→6→7→0 -->
    <path d="M16,-100 L62,-90" class="ring0"/>
    <path d="M92,-62 L102,-16" class="ring0"/>
    <path d="M102,16 L92,62" class="ring0"/>
    <path d="M62,90 L16,102" class="ring0"/>
    <path d="M-16,102 L-62,90" class="ring0"/>
    <path d="M-92,62 L-102,16" class="ring0"/>
    <path d="M-102,-16 L-92,-62" class="ring0"/>
    <path d="M-62,-90 L-16,-102" class="ring0"/>

    <!-- Ring 1 (blue, dashed): 0→3→6→1→4→7→2→5→0 (different order) -->
    <!-- Shown as offset arcs -->
    <path d="M8,-88 C50,-20 70,40 72,58" class="ring1"/>
    <path d="M60,90 C-20,70 -80,40 -98,-12" class="ring1"/>
    <path d="M-98,12 C-60,-50 20,-70 60,-82" class="ring1"/>
  </g>

  <!-- Right side: Channel explanation -->
  <g transform="translate(420, 55)">
    <text x="0" y="0" class="d-label" style="font-size:12px">Channel 概念</text>

    <rect x="0" y="15" width="260" height="55" fill="#009E73" class="ch-fill" stroke="#009E73" stroke-width="1"/>
    <text x="10" y="33" class="d-label" style="font-size:11px;fill:#009E73">Channel 0（Ring 0）</text>
    <text x="10" y="50" class="d-note" style="font-size:10px">顺序: 0→1→2→3→4→5→6→7→0</text>
    <text x="10" y="64" class="d-note" style="font-size:10px">处理数据的前 1/N_CH</text>

    <rect x="0" y="80" width="260" height="55" fill="#56B4E9" class="ch-fill" stroke="#56B4E9" stroke-width="1"/>
    <text x="10" y="98" class="d-label" style="font-size:11px;fill:#56B4E9">Channel 1（Ring 1）</text>
    <text x="10" y="115" class="d-note" style="font-size:10px">顺序: 0→3→6→1→4→7→2→5→0</text>
    <text x="10" y="129" class="d-note" style="font-size:10px">处理数据的 1/N_CH ~ 2/N_CH</text>

    <rect x="0" y="145" width="260" height="55" fill="#D55E00" class="ch-fill" stroke="#D55E00" stroke-width="1"/>
    <text x="10" y="163" class="d-label" style="font-size:11px;fill:#D55E00">Channel 2（Ring 2）</text>
    <text x="10" y="180" class="d-note" style="font-size:10px">不同的 ring 顺序</text>
    <text x="10" y="194" class="d-note" style="font-size:10px">处理数据的 2/N_CH ~ 3/N_CH</text>

    <text x="0" y="225" class="d-note" style="font-size:10px">多 channel 并行传输同一集合操作的</text>
    <text x="0" y="241" class="d-note" style="font-size:10px">不同数据分片，聚合所有 NVLink 带宽。</text>
    <text x="0" y="261" class="d-note" style="font-size:10px">H100: 默认 NCCL_NCHANNELS=32</text>
    <text x="0" y="277" class="d-note" style="font-size:10px">每 channel 独立 ring + 独立 buffer。</text>
  </g>

  <!-- Bottom note -->
  <text x="360" y="348" text-anchor="middle" class="d-note" style="font-size:10px">不同 ring 走不同 NVLink 路径，最大化链路利用率；图搜索确保 ring 间负载均衡</text>
</svg>
