<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" class="d-fig">
  <style>
    .d-label { font: 600 13px "Inter", sans-serif; fill: var(--ink, #1a1a1a); }
    .d-note  { font: 400 11px "Inter", sans-serif; fill: var(--ink-2, #4a4a4a); }
    .bar     { fill: #56B4E9; opacity: 0.7; }
    .bar-new { fill: #D55E00; opacity: 0.7; }
  </style>

  <text x="360" y="22" text-anchor="middle" class="d-label">MLC 优化阶梯：B200 上 FP16 GEMM（M=N=K=4096）</text>
  <text x="360" y="38" text-anchor="middle" class="d-note">数据来自 MLC 教程 "End-to-End Results" 表，锁频单次运行</text>

  <!-- Y axis -->
  <line x1="60" y1="50" x2="60" y2="280" stroke="var(--ink-3,#8a8a86)" stroke-width="1"/>
  <text x="24" y="168" text-anchor="middle" class="d-label" transform="rotate(-90,24,168)">% 峰值</text>

  <!-- Y ticks -->
  <text x="52" y="278" text-anchor="end" class="d-note">0</text>
  <text x="52" y="255" text-anchor="end" class="d-note">10</text>
  <text x="52" y="232" text-anchor="end" class="d-note">20</text>
  <text x="52" y="209" text-anchor="end" class="d-note">30</text>
  <text x="52" y="186" text-anchor="end" class="d-note">40</text>
  <text x="52" y="163" text-anchor="end" class="d-note">50</text>
  <text x="52" y="140" text-anchor="end" class="d-note">60</text>
  <text x="52" y="117" text-anchor="end" class="d-note">70</text>
  <text x="52" y="94" text-anchor="end" class="d-note">80</text>
  <text x="52" y="71" text-anchor="end" class="d-note">90</text>
  <text x="52" y="58" text-anchor="end" class="d-note">100</text>

  <!-- Grid lines -->
  <line x1="60" y1="252" x2="690" y2="252" stroke="var(--rule,#e4e4e0)" stroke-width="0.5"/>
  <line x1="60" y1="206" x2="690" y2="206" stroke="var(--rule,#e4e4e0)" stroke-width="0.5"/>
  <line x1="60" y1="160" x2="690" y2="160" stroke="var(--rule,#e4e4e0)" stroke-width="0.5"/>
  <line x1="60" y1="114" x2="690" y2="114" stroke="var(--rule,#e4e4e0)" stroke-width="0.5"/>
  <line x1="60" y1="68" x2="690" y2="68" stroke="var(--rule,#e4e4e0)" stroke-width="0.5"/>

  <!-- X axis -->
  <line x1="60" y1="275" x2="690" y2="275" stroke="var(--ink-3,#8a8a86)" stroke-width="1"/>

  <!-- Bars: 9 steps, each ~68px wide, 4px gap -->
  <!-- Step 1: ~3% → 6.9px height from bottom -->
  <rect x="72" y="268" width="56" height="7" class="bar-new"/>
  <text x="100" y="264" text-anchor="middle" class="d-note" style="font-size:9px">3%</text>
  <text x="100" y="293" text-anchor="middle" class="d-note" style="font-size:9px">S1</text>
  <text x="100" y="304" text-anchor="middle" class="d-note" style="font-size:8px">单 tile</text>

  <!-- Step 2: ~12% → 27.6px -->
  <rect x="140" y="247" width="56" height="28" class="bar"/>
  <rect x="140" y="268" width="56" height="7" class="bar-new"/>
  <text x="168" y="243" text-anchor="middle" class="d-note" style="font-size:9px">12%</text>
  <text x="168" y="293" text-anchor="middle" class="d-note" style="font-size:9px">S2</text>
  <text x="168" y="304" text-anchor="middle" class="d-note" style="font-size:8px">K 循环</text>

  <!-- Step 3: ~25% → 57.5px -->
  <rect x="208" y="217" width="56" height="58" class="bar"/>
  <text x="236" y="213" text-anchor="middle" class="d-note" style="font-size:9px">25%</text>
  <text x="236" y="293" text-anchor="middle" class="d-note" style="font-size:9px">S3</text>
  <text x="236" y="304" text-anchor="middle" class="d-note" style="font-size:8px">多 CTA</text>

  <!-- Step 4: ~40% → 92px -->
  <rect x="276" y="183" width="56" height="92" class="bar"/>
  <text x="304" y="179" text-anchor="middle" class="d-note" style="font-size:9px">40%</text>
  <text x="304" y="293" text-anchor="middle" class="d-note" style="font-size:9px">S4</text>
  <text x="304" y="304" text-anchor="middle" class="d-note" style="font-size:8px">TMA</text>

  <!-- Step 5: ~55% → 126.5px -->
  <rect x="344" y="148" width="56" height="127" class="bar"/>
  <text x="372" y="144" text-anchor="middle" class="d-note" style="font-size:9px">55%</text>
  <text x="372" y="293" text-anchor="middle" class="d-note" style="font-size:9px">S5</text>
  <text x="372" y="304" text-anchor="middle" class="d-note" style="font-size:8px">流水线</text>

  <!-- Step 6: ~65% → 149.5px -->
  <rect x="412" y="125" width="56" height="150" class="bar"/>
  <text x="440" y="121" text-anchor="middle" class="d-note" style="font-size:9px">65%</text>
  <text x="440" y="293" text-anchor="middle" class="d-note" style="font-size:9px">S6</text>
  <text x="440" y="304" text-anchor="middle" class="d-note" style="font-size:8px">persistent</text>

  <!-- Step 7: ~80% → 184px -->
  <rect x="480" y="91" width="56" height="184" class="bar"/>
  <text x="508" y="87" text-anchor="middle" class="d-note" style="font-size:9px">80%</text>
  <text x="508" y="293" text-anchor="middle" class="d-note" style="font-size:9px">S7</text>
  <text x="508" y="304" text-anchor="middle" class="d-note" style="font-size:8px">warp spec</text>

  <!-- Step 8: ~88% → 202.4px -->
  <rect x="548" y="72" width="56" height="203" class="bar"/>
  <text x="576" y="68" text-anchor="middle" class="d-note" style="font-size:9px">88%</text>
  <text x="576" y="293" text-anchor="middle" class="d-note" style="font-size:9px">S8</text>
  <text x="576" y="304" text-anchor="middle" class="d-note" style="font-size:8px">2-CTA</text>

  <!-- Step 9: ~93% → 213.9px -->
  <rect x="616" y="61" width="56" height="214" class="bar-new"/>
  <text x="644" y="57" text-anchor="middle" class="d-note" style="font-size:9px">93%</text>
  <text x="644" y="293" text-anchor="middle" class="d-note" style="font-size:9px">S9</text>
  <text x="644" y="304" text-anchor="middle" class="d-note" style="font-size:8px">多 consumer</text>

  <text x="375" y="330" text-anchor="middle" class="d-note">来源：MLC "End-to-End Results"，B200 FP16，M=N=K=4096</text>
</svg>
