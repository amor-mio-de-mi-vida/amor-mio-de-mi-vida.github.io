<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" class="d-fig">
  <style>
    .d-label { font: 600 13px "Inter", sans-serif; fill: var(--ink, #1a1a1a); }
    .d-note  { font: 400 11px "Inter", sans-serif; fill: var(--ink-2, #4a4a4a); }
    .fill-blue  { fill: #56B4E9; opacity: 0.7; }
    .fill-green { fill: #009E73; opacity: 0.7; }
    .fill-acc   { fill: #D55E00; opacity: 0.7; }
    .fill-gray  { fill: #CCCCCC; opacity: 0.5; }
    .d-arrow { stroke: var(--ink-3, #8a8a86); stroke-width: 1; fill: none; marker-end: url(#ah4); }
  </style>
  <defs>
    <marker id="ah4" viewBox="0 0 8 6" refX="8" refY="3" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--ink-3, #8a8a86)"/>
    </marker>
  </defs>

  <text x="360" y="22" text-anchor="middle" class="d-label">Blackwell GEMM 全流水时序（Step 9，tile k 到 k+2）</text>

  <!-- Lane labels -->
  <text x="14" y="68" class="d-label" style="font-size:11px">Producer 0</text>
  <text x="14" y="82" class="d-note">(CTA0: A)</text>
  <text x="14" y="118" class="d-label" style="font-size:11px">Producer 1</text>
  <text x="14" y="132" class="d-note">(CTA1: B)</text>
  <text x="14" y="170" class="d-label" style="font-size:11px">Consumer 0</text>
  <text x="14" y="184" class="d-note">(tcgen05)</text>
  <text x="14" y="222" class="d-label" style="font-size:11px">Consumer 1</text>
  <text x="14" y="236" class="d-note">(tcgen05)</text>
  <text x="14" y="274" class="d-label" style="font-size:11px">Epilogue</text>

  <!-- Lane lines -->
  <line x1="100" y1="50" x2="700" y2="50" stroke="var(--rule,#e4e4e0)" stroke-width="0.5"/>
  <line x1="100" y1="95" x2="700" y2="95" stroke="var(--rule,#e4e4e0)" stroke-width="0.5"/>
  <line x1="100" y1="145" x2="700" y2="145" stroke="var(--rule,#e4e4e0)" stroke-width="0.5"/>
  <line x1="100" y1="198" x2="700" y2="198" stroke="var(--rule,#e4e4e0)" stroke-width="0.5"/>
  <line x1="100" y1="250" x2="700" y2="250" stroke="var(--rule,#e4e4e0)" stroke-width="0.5"/>
  <line x1="100" y1="290" x2="700" y2="290" stroke="var(--rule,#e4e4e0)" stroke-width="0.5"/>

  <!-- Tile k labels -->
  <text x="220" y="44" class="d-note" text-anchor="middle">tile k</text>
  <text x="420" y="44" class="d-note" text-anchor="middle">tile k+1</text>
  <text x="620" y="44" class="d-note" text-anchor="middle">tile k+2</text>

  <!-- Producer 0 (CTA0 loads A) -->
  <rect x="120" y="58" width="80" height="26" rx="3" class="fill-blue"/>
  <text x="160" y="76" text-anchor="middle" class="d-note" style="fill:white;font-size:9px">TMA A[k]</text>
  <rect x="320" y="58" width="80" height="26" rx="3" class="fill-blue"/>
  <text x="360" y="76" text-anchor="middle" class="d-note" style="fill:white;font-size:9px">TMA A[k+1]</text>
  <rect x="520" y="58" width="80" height="26" rx="3" class="fill-blue"/>
  <text x="560" y="76" text-anchor="middle" class="d-note" style="fill:white;font-size:9px">TMA A[k+2]</text>

  <!-- Producer 1 (CTA1 loads B) -->
  <rect x="140" y="105" width="80" height="26" rx="3" class="fill-blue"/>
  <text x="180" y="123" text-anchor="middle" class="d-note" style="fill:white;font-size:9px">TMA B[k]</text>
  <rect x="340" y="105" width="80" height="26" rx="3" class="fill-blue"/>
  <text x="380" y="123" text-anchor="middle" class="d-note" style="fill:white;font-size:9px">TMA B[k+1]</text>
  <rect x="540" y="105" width="80" height="26" rx="3" class="fill-blue"/>
  <text x="580" y="123" text-anchor="middle" class="d-note" style="fill:white;font-size:9px">TMA B[k+2]</text>

  <!-- Consumer 0: MMA on tile k, k+2 -->
  <rect x="220" y="155" width="120" height="32" rx="3" class="fill-green"/>
  <text x="280" y="176" text-anchor="middle" class="d-note" style="fill:white;font-size:9px">MMA tile k → TMEM₀</text>
  <rect x="420" y="155" width="120" height="32" rx="3" class="fill-green"/>
  <text x="480" y="176" text-anchor="middle" class="d-note" style="fill:white;font-size:9px">MMA k+1 → TMEM₁</text>
  <rect x="620" y="155" width="75" height="32" rx="3" class="fill-green"/>
  <text x="657" y="176" text-anchor="middle" class="d-note" style="fill:white;font-size:9px">MMA k+2</text>

  <!-- Consumer 1: MMA offset -->
  <rect x="230" y="207" width="120" height="32" rx="3" class="fill-green"/>
  <text x="290" y="228" text-anchor="middle" class="d-note" style="fill:white;font-size:9px">MMA tile k → TMEM₀</text>
  <rect x="430" y="207" width="120" height="32" rx="3" class="fill-green"/>
  <text x="490" y="228" text-anchor="middle" class="d-note" style="fill:white;font-size:9px">MMA k+1 → TMEM₁</text>

  <!-- Epilogue: overlaps with next tile's MMA -->
  <rect x="420" y="260" width="100" height="24" rx="3" class="fill-acc"/>
  <text x="470" y="277" text-anchor="middle" class="d-note" style="fill:white;font-size:9px">Epi TMEM₀ → C</text>
  <rect x="620" y="260" width="75" height="24" rx="3" class="fill-acc"/>
  <text x="657" y="277" text-anchor="middle" class="d-note" style="fill:white;font-size:9px">Epi TMEM₁</text>

  <!-- Legend -->
  <rect x="130" y="302" width="36" height="12" rx="2" class="fill-blue"/>
  <text x="172" y="312" class="d-note">TMA 加载</text>
  <rect x="250" y="302" width="36" height="12" rx="2" class="fill-green"/>
  <text x="292" y="312" class="d-note">tcgen05.mma</text>
  <rect x="380" y="302" width="36" height="12" rx="2" class="fill-acc"/>
  <text x="422" y="312" class="d-note">Epilogue</text>
  <text x="530" y="312" class="d-note">TMEM 双缓冲使 epilogue 与下一 tile MMA 重叠</text>

  <!-- Time arrow -->
  <line x1="120" y1="330" x2="690" y2="330" class="d-arrow"/>
  <text x="700" y="334" class="d-note">time</text>
</svg>
