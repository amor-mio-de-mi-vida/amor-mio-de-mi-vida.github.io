<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', sans-serif">
  <style>
    .title { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
    .label { font-size: 12px; fill: #1a1a1a; }
    .sublabel { font-size: 10px; fill: #666; }
    .box { rx: 6; ry: 6; stroke-width: 1.5; }
    .arrow { stroke-width: 1.5; fill: none; marker-end: url(#ah2); }
    .bidir { stroke-width: 1.5; stroke-dasharray: 4,3; }
  </style>
  <defs>
    <marker id="ah2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>

  <text x="360" y="24" text-anchor="middle" class="title">2-CTA Cluster：分工搬运 + mapa 共享</text>

  <!-- Cluster boundary -->
  <rect x="50" y="40" width="620" height="240" rx="10" fill="none" stroke="#CC79A7" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="360" y="60" text-anchor="middle" class="label" fill="#CC79A7">Cluster (CLUSTER_M=2)</text>

  <!-- CTA 0 -->
  <rect x="70" y="75" width="270" height="185" class="box" fill="#E8F5E9" stroke="#009E73"/>
  <text x="205" y="96" text-anchor="middle" class="label" font-weight="600">CTA 0 (SM₀)</text>

  <rect x="90" y="110" width="110" height="30" rx="4" fill="white" stroke="#009E73"/>
  <text x="145" y="129" text-anchor="middle" class="sublabel">Producer: TMA A</text>

  <rect x="210" y="110" width="110" height="30" rx="4" fill="white" stroke="#009E73"/>
  <text x="265" y="129" text-anchor="middle" class="sublabel">SMEM: sA</text>

  <rect x="90" y="155" width="230" height="30" rx="4" fill="#E8F4FD" stroke="#0072B2"/>
  <text x="205" y="174" text-anchor="middle" class="sublabel">Consumer: tcgen05.mma &rarr; TMEM₀</text>

  <rect x="90" y="200" width="230" height="30" rx="4" fill="#FCE4EC" stroke="#CC79A7"/>
  <text x="205" y="219" text-anchor="middle" class="sublabel">C₀ [m₀..m₀+BM, n]</text>

  <!-- CTA 1 -->
  <rect x="380" y="75" width="270" height="185" class="box" fill="#FFF3E0" stroke="#D55E00"/>
  <text x="515" y="96" text-anchor="middle" class="label" font-weight="600">CTA 1 (SM₁)</text>

  <rect x="400" y="110" width="110" height="30" rx="4" fill="white" stroke="#D55E00"/>
  <text x="455" y="129" text-anchor="middle" class="sublabel">Producer: TMA B</text>

  <rect x="520" y="110" width="110" height="30" rx="4" fill="white" stroke="#D55E00"/>
  <text x="575" y="129" text-anchor="middle" class="sublabel">SMEM: sB</text>

  <rect x="400" y="155" width="230" height="30" rx="4" fill="#E8F4FD" stroke="#0072B2"/>
  <text x="515" y="174" text-anchor="middle" class="sublabel">Consumer: tcgen05.mma &rarr; TMEM₁</text>

  <rect x="400" y="200" width="230" height="30" rx="4" fill="#FCE4EC" stroke="#CC79A7"/>
  <text x="515" y="219" text-anchor="middle" class="sublabel">C₁ [m₁..m₁+BM, n]</text>

  <!-- mapa bidirectional arrow -->
  <line x1="340" y1="125" x2="380" y2="125" class="bidir" stroke="#CC79A7"/>
  <text x="360" y="148" text-anchor="middle" class="sublabel" fill="#CC79A7">mapa</text>
  <line x1="340" y1="170" x2="380" y2="170" class="bidir" stroke="#0072B2"/>
</svg>
