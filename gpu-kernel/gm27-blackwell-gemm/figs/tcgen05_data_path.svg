<svg viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', sans-serif">
  <style>
    .title { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
    .label { font-size: 12px; fill: #1a1a1a; }
    .sublabel { font-size: 10px; fill: #666; }
    .box { rx: 6; ry: 6; stroke-width: 1.5; }
    .arrow { stroke-width: 1.5; fill: none; marker-end: url(#ah); }
  </style>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>

  <text x="360" y="24" text-anchor="middle" class="title">Blackwell GEMM 数据通路</text>

  <!-- HBM -->
  <rect x="20" y="55" width="90" height="50" class="box" fill="#E8F4FD" stroke="#0072B2"/>
  <text x="65" y="77" text-anchor="middle" class="label">HBM3e</text>
  <text x="65" y="92" text-anchor="middle" class="sublabel">A, B</text>

  <!-- TMA -->
  <rect x="150" y="55" width="80" height="50" class="box" fill="#FFF3E0" stroke="#D55E00"/>
  <text x="190" y="77" text-anchor="middle" class="label">TMA</text>
  <text x="190" y="92" text-anchor="middle" class="sublabel">1 线程</text>

  <!-- SMEM -->
  <rect x="270" y="55" width="100" height="50" class="box" fill="#E8F5E9" stroke="#009E73"/>
  <text x="320" y="77" text-anchor="middle" class="label">SMEM</text>
  <text x="320" y="92" text-anchor="middle" class="sublabel">sA + sB</text>

  <!-- tcgen05 -->
  <rect x="410" y="55" width="100" height="50" class="box" fill="#F3E5F5" stroke="#CC79A7"/>
  <text x="460" y="72" text-anchor="middle" class="label">tcgen05</text>
  <text x="460" y="87" text-anchor="middle" class="label">.mma</text>
  <text x="460" y="100" text-anchor="middle" class="sublabel">1 线程发射</text>

  <!-- TMEM -->
  <rect x="550" y="55" width="100" height="50" class="box" fill="#FCE4EC" stroke="#D55E00"/>
  <text x="600" y="77" text-anchor="middle" class="label" font-weight="600">TMEM</text>
  <text x="600" y="92" text-anchor="middle" class="sublabel">256 KB/SM</text>

  <!-- Register -->
  <rect x="550" y="150" width="100" height="40" class="box" fill="#FFF8E1" stroke="#F0E442"/>
  <text x="600" y="174" text-anchor="middle" class="label">寄存器</text>

  <!-- C output -->
  <rect x="410" y="210" width="100" height="40" class="box" fill="#E8F4FD" stroke="#0072B2"/>
  <text x="460" y="234" text-anchor="middle" class="label">C (HBM)</text>

  <!-- Arrows -->
  <path d="M110,80 L145,80" class="arrow" stroke="#0072B2"/>
  <path d="M230,80 L265,80" class="arrow" stroke="#D55E00"/>
  <path d="M370,80 L405,80" class="arrow" stroke="#009E73"/>
  <path d="M510,80 L545,80" class="arrow" stroke="#CC79A7"/>
  <text x="528" y="73" text-anchor="middle" class="sublabel">acc</text>

  <path d="M600,105 L600,145" class="arrow" stroke="#D55E00"/>
  <text x="618" y="130" class="sublabel">tcgen05.st</text>

  <path d="M550,175 L512,220" class="arrow" stroke="#666"/>
  <text x="540" y="200" class="sublabel">store</text>

  <!-- New vs Hopper annotation -->
  <rect x="20" y="140" width="200" height="60" rx="4" fill="#FFFDE7" stroke="#F0E442" stroke-width="1"/>
  <text x="30" y="158" class="sublabel" fill="#D55E00" font-weight="600">对比 Hopper：</text>
  <text x="30" y="174" class="sublabel" fill="#333">累加器：寄存器 &rarr; TMEM (专用)</text>
  <text x="30" y="190" class="sublabel" fill="#333">发射：warpgroup &rarr; 单线程</text>
</svg>
