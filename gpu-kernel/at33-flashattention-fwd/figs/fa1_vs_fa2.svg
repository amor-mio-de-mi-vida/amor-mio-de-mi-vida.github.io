<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', sans-serif">
  <style>
    .title { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
    .label { font-size: 12px; fill: #1a1a1a; }
    .sublabel { font-size: 10px; fill: #666; }
    .box { rx: 6; ry: 6; stroke-width: 1.5; }
  </style>

  <text x="360" y="22" text-anchor="middle" class="title">FA1 vs FA2：外层循环的选择</text>

  <!-- FA1 -->
  <rect x="20" y="40" width="330" height="210" class="box" fill="#E3F2FD" stroke="#1976D2"/>
  <text x="185" y="62" text-anchor="middle" class="label" fill="#1976D2" font-weight="600">FlashAttention-1（外层 KV）</text>

  <text x="30" y="85" class="sublabel">for j in KV_blocks:&emsp;&emsp;&emsp;← 外层</text>
  <text x="30" y="102" class="sublabel">&emsp;load K_j, V_j to SRAM</text>
  <text x="30" y="119" class="sublabel">&emsp;for i in Q_blocks:&emsp;← 内层</text>
  <text x="30" y="136" class="sublabel">&emsp;&emsp;load Q_i to SRAM</text>
  <text x="30" y="153" class="sublabel">&emsp;&emsp;S_ij = Q_i @ K_j.T</text>
  <text x="30" y="170" class="sublabel">&emsp;&emsp;online softmax + O_i update</text>

  <text x="30" y="195" class="sublabel" fill="#D55E00">问题 1：O_i 写回 HBM T_c 次</text>
  <text x="30" y="210" class="sublabel" fill="#D55E00">问题 2：warp 间 split-K，经 smem 合并</text>
  <text x="30" y="225" class="sublabel" fill="#D55E00">问题 3：非 matmul FLOP 更多</text>
  <text x="30" y="240" class="sublabel" fill="#D55E00">只在 batch &times; head 上并行</text>

  <!-- FA2 -->
  <rect x="370" y="40" width="330" height="210" class="box" fill="#E8F5E9" stroke="#388E3C"/>
  <text x="535" y="62" text-anchor="middle" class="label" fill="#388E3C" font-weight="600">FlashAttention-2（外层 Q）</text>

  <text x="380" y="85" class="sublabel">for i in Q_blocks:&emsp;&emsp;&emsp;← 外层</text>
  <text x="380" y="102" class="sublabel">&emsp;load Q_i（常驻片上）</text>
  <text x="380" y="119" class="sublabel">&emsp;for j in KV_blocks:&emsp;← 内层</text>
  <text x="380" y="136" class="sublabel">&emsp;&emsp;load K_j, V_j to SRAM</text>
  <text x="380" y="153" class="sublabel">&emsp;&emsp;S_ij = Q_i @ K_j.T</text>
  <text x="380" y="170" class="sublabel">&emsp;&emsp;online softmax + O_i update</text>

  <text x="380" y="195" class="sublabel" fill="#388E3C">改进 1：O_i 只写回 HBM 一次</text>
  <text x="380" y="210" class="sublabel" fill="#388E3C">改进 2：warp 间 split-Q，无需通信</text>
  <text x="380" y="225" class="sublabel" fill="#388E3C">改进 3：减少非 matmul FLOP</text>
  <text x="380" y="240" class="sublabel" fill="#388E3C">grid = (batch, head, Q_block)</text>
</svg>
