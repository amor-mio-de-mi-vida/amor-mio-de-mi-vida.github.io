<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290">
<style>
  text{font-family:system-ui,sans-serif;font-size:12px;fill:#23272f}
  .title{font-size:12px;font-weight:700}
  .label{font-size:11px;fill:#6b7280}
  .code{font-family:ui-monospace,monospace;font-size:10.5px}
  .box{rx:5;ry:5;stroke-width:1.2}
</style>
<text x="350" y="18" text-anchor="middle" class="title">Online Softmax: Incremental Rescale Across KV Blocks</text>

<!-- Block 0 -->
<rect x="20" y="40" width="200" height="90" class="box" fill="#dcfce7" stroke="#22c55e"/>
<text x="120" y="60" text-anchor="middle" class="title" fill="#16a34a">KV Block j=0</text>
<text x="35" y="80" class="code">S&#x2080; = Q&#x1D62; K&#x2080;&#x1D40; / &#x221A;d</text>
<text x="35" y="97" class="code">m&#x2080; = rowmax(S&#x2080;)</text>
<text x="35" y="114" class="code">&#x2113;&#x2080; = &#x2211;exp(S&#x2080; - m&#x2080;)</text>

<!-- Arrow -->
<line x1="220" y1="85" x2="250" y2="85" stroke="#888" stroke-width="1.2" marker-end="url(#arr6)"/>

<!-- Block 1 -->
<rect x="250" y="40" width="200" height="90" class="box" fill="#eff6ff" stroke="#3b82f6"/>
<text x="350" y="60" text-anchor="middle" class="title" fill="#2563eb">KV Block j=1</text>
<text x="265" y="80" class="code">S&#x2081; = Q&#x1D62; K&#x2081;&#x1D40; / &#x221A;d</text>
<text x="265" y="97" class="code">m&#x2081; = max(m&#x2080;, rowmax(S&#x2081;))</text>
<text x="265" y="114" class="code" fill="#dc2626">&#x2113;&#x2081; = &#x2113;&#x2080;&#xb7;e^(m&#x2080;-m&#x2081;) + &#x2211;e^(S&#x2081;-m&#x2081;)</text>

<!-- Arrow -->
<line x1="450" y1="85" x2="480" y2="85" stroke="#888" stroke-width="1.2" marker-end="url(#arr6)"/>

<!-- Block 2 -->
<rect x="480" y="40" width="200" height="90" class="box" fill="#fef9c3" stroke="#eab308"/>
<text x="580" y="60" text-anchor="middle" class="title" fill="#a16207">KV Block j=2</text>
<text x="495" y="80" class="code">S&#x2082; = Q&#x1D62; K&#x2082;&#x1D40; / &#x221A;d</text>
<text x="495" y="97" class="code">m&#x2082; = max(m&#x2081;, rowmax(S&#x2082;))</text>
<text x="495" y="114" class="code" fill="#dc2626">&#x2113;&#x2082; = &#x2113;&#x2081;&#xb7;e^(m&#x2081;-m&#x2082;) + &#x2211;e^(S&#x2082;-m&#x2082;)</text>

<!-- O accumulation -->
<rect x="20" y="150" width="660" height="50" class="box" fill="#fef2f2" stroke="#ef4444"/>
<text x="350" y="170" text-anchor="middle" class="title" fill="#dc2626">O Rescale (the key trick)</text>
<text x="35" y="190" class="code">O&#x1D62; = e^(m_old - m_new) &#xb7; O&#x1D62; + diag(e^(S - m_new)) &#xb7; V_j</text>

<!-- Final step -->
<rect x="20" y="215" width="660" height="55" class="box" fill="#f3f4f6" stroke="#d1d5db"/>
<text x="350" y="235" text-anchor="middle" class="title">After all KV blocks processed:</text>
<text x="35" y="255" class="code">O&#x1D62; = O&#x1D62; / &#x2113;_final</text>
<text x="300" y="255" class="code">LSE&#x1D62; = m_final + log(&#x2113;_final)</text>
<text x="540" y="255" class="label">(saved for backward)</text>

<defs><marker id="arr6" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
  <path d="M0,0 L8,3 L0,6" fill="#888"/>
</marker></defs>
<text x="350" y="288" text-anchor="middle" font-size="10.5" fill="#aaa" font-style="italic">data-source: illustrative</text>
</svg>
