<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250">
<style>
  text{font-family:system-ui,sans-serif;font-size:12px;fill:#23272f}
  .title{font-size:12px;font-weight:700}
  .label{font-size:11px;fill:#6b7280}
  .code{font-family:ui-monospace,monospace;font-size:10.5px}
  .box{rx:5;ry:5;stroke-width:1.2}
</style>
<text x="350" y="18" text-anchor="middle" class="title">Standard vs FlashAttention: Where S and P Live</text>

<!-- Standard attention -->
<rect x="20" y="35" width="310" height="185" class="box" fill="#fef2f2" stroke="#ef4444"/>
<text x="175" y="55" text-anchor="middle" class="title" fill="#dc2626">Standard Attention</text>

<rect x="35" y="65" width="130" height="65" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
<text x="100" y="83" text-anchor="middle" class="title" font-size="11">HBM (slow)</text>
<text x="100" y="100" text-anchor="middle" class="code" font-size="10">S [N,N] + P [N,N]</text>
<text x="100" y="115" text-anchor="middle" class="label" font-size="9">~64 MB (N=4096)</text>

<rect x="180" y="65" width="130" height="65" rx="4" fill="#dcfce7" stroke="#86efac"/>
<text x="245" y="83" text-anchor="middle" class="title" font-size="11">SRAM (fast)</text>
<text x="245" y="100" text-anchor="middle" class="code" font-size="10">partial row only</text>
<text x="245" y="115" text-anchor="middle" class="label" font-size="9">~192 KB</text>

<text x="100" y="148" text-anchor="middle" class="code" fill="#dc2626" font-size="10">S write &#x2192; read &#x2192;</text>
<text x="100" y="163" text-anchor="middle" class="code" fill="#dc2626" font-size="10">softmax &#x2192; P write</text>
<text x="100" y="178" text-anchor="middle" class="code" fill="#dc2626" font-size="10">&#x2192; read &#x2192; PV GEMM</text>
<text x="245" y="155" text-anchor="middle" class="label" font-size="10">4 round-trips</text>
<text x="245" y="170" text-anchor="middle" class="label" font-size="10">to HBM for S/P</text>

<text x="175" y="210" text-anchor="middle" class="title accent" font-size="11">Memory-bound!</text>

<!-- FlashAttention -->
<rect x="370" y="35" width="310" height="185" class="box" fill="#dcfce7" stroke="#22c55e"/>
<text x="525" y="55" text-anchor="middle" class="title" fill="#16a34a">FlashAttention</text>

<rect x="385" y="65" width="130" height="65" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
<text x="450" y="83" text-anchor="middle" class="title" font-size="11">HBM</text>
<text x="450" y="100" text-anchor="middle" class="code" font-size="10">Q,K,V,O,LSE only</text>
<text x="450" y="115" text-anchor="middle" class="label" font-size="9">~4 MB (N=4096)</text>

<rect x="530" y="65" width="130" height="65" rx="4" fill="#dcfce7" stroke="#86efac"/>
<text x="595" y="83" text-anchor="middle" class="title" font-size="11">SRAM (fast)</text>
<text x="595" y="100" text-anchor="middle" class="code" font-size="10">S [Br,Bc] block</text>
<text x="595" y="115" text-anchor="middle" class="label" font-size="9">~16 KB tile</text>

<text x="450" y="148" text-anchor="middle" class="code" fill="#16a34a" font-size="10">Load K,V tile once</text>
<text x="450" y="163" text-anchor="middle" class="code" fill="#16a34a" font-size="10">S stays in SRAM</text>
<text x="595" y="155" text-anchor="middle" class="label" font-size="10">S never touches</text>
<text x="595" y="170" text-anchor="middle" class="label" font-size="10">HBM at all!</text>

<text x="525" y="210" text-anchor="middle" class="title" fill="#16a34a" font-size="11">no N&#xb2; term in HBM traffic</text>

<text x="350" y="245" text-anchor="middle" font-size="10.5" fill="#aaa" font-style="italic">data-source: computed (N=4096, d=128, FP16; sizes, not traffic)</text>
</svg>
