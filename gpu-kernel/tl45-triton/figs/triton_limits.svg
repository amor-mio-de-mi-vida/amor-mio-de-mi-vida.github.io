<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260">
<style>
  text{font-family:system-ui,sans-serif;font-size:12px;fill:#23272f}
  .title{font-size:11.5px;font-weight:700}
  .label{font-size:11px;fill:#6b7280}
  .code{font-family:ui-monospace,monospace;font-size:10.5px}
</style>
<text x="340" y="18" text-anchor="middle" class="title">When Triton Is Enough vs When You Need CUDA</text>

<!-- Triton sweet spot -->
<rect x="20" y="30" width="310" height="200" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2"/>
<text x="175" y="50" text-anchor="middle" class="title" fill="#22c55e">Triton Works Well</text>

<text x="35" y="75" class="code" font-size="10">&check; Fused elementwise (RMSNorm, softmax)</text>
<text x="35" y="95" class="code" font-size="10">&check; Standard GEMM / attention</text>
<text x="35" y="115" class="code" font-size="10">&check; Reduction kernels (mean, variance)</text>
<text x="35" y="135" class="code" font-size="10">&check; Regular tile-based access patterns</text>
<text x="35" y="155" class="code" font-size="10">&check; Rapid prototyping (10x less code)</text>

<text x="35" y="185" class="label" fill="#22c55e">~90% of ML kernel needs</text>
<text x="35" y="203" class="label" fill="#22c55e">Performance within 5-15% of expert CUDA</text>
<text x="35" y="221" class="label" fill="#22c55e">Python syntax, easy debugging</text>

<!-- CUDA needed -->
<rect x="350" y="30" width="310" height="200" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.2"/>
<text x="505" y="50" text-anchor="middle" class="title" fill="#ef4444">Need CUDA</text>

<text x="365" y="75" class="code" font-size="10">&cross; Warp-level primitives (custom shuffle)</text>
<text x="365" y="95" class="code" font-size="10">&cross; Cross-block communication</text>
<text x="365" y="115" class="code" font-size="10">&cross; Irregular memory patterns (hash table)</text>
<text x="365" y="135" class="code" font-size="10">&cross; Fine-grained register control</text>
<text x="365" y="155" class="code" font-size="10">&cross; Custom TMA / async patterns</text>

<text x="365" y="185" class="label" fill="#ef4444">~10% of cases (but highest perf impact)</text>
<text x="365" y="203" class="label" fill="#ef4444">FlashAttention, custom comm kernels</text>
<text x="365" y="221" class="label" fill="#ef4444">Full Hopper/Blackwell feature access</text>

<text x="340" y="255" text-anchor="middle" font-size="11" fill="#aaa" font-style="italic">data-source: illustrative</text>
</svg>
