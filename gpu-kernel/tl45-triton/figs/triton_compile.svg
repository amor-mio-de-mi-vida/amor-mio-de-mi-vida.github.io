<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240">
<style>
  text{font-family:system-ui,sans-serif;font-size:12px;fill:#23272f}
  .title{font-size:11.5px;font-weight:700}
  .label{font-size:11px;fill:#6b7280}
  .code{font-family:ui-monospace,monospace;font-size:10.5px}
  .arrow{stroke:#23272f;stroke-width:1.5;marker-end:url(#ah1)}
</style>
<defs>
  <marker id="ah1" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
    <path d="M0,0 L7,2.5 L0,5z" fill="#23272f"/>
  </marker>
</defs>
<text x="340" y="18" text-anchor="middle" class="title">Triton Compilation Pipeline</text>

<!-- Stage boxes -->
<rect x="20" y="35" width="110" height="55" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
<text x="75" y="55" text-anchor="middle" class="title" fill="#3b82f6">Python</text>
<text x="75" y="72" text-anchor="middle" class="code" font-size="9">@triton.jit</text>

<line x1="135" y1="62" x2="155" y2="62" class="arrow"/>

<rect x="160" y="35" width="100" height="55" rx="5" fill="#fef9c3" stroke="#eab308" stroke-width="1.2"/>
<text x="210" y="55" text-anchor="middle" class="title" fill="#854d0e">Triton IR</text>
<text x="210" y="72" text-anchor="middle" class="code" font-size="9">SSA + types</text>

<line x1="265" y1="62" x2="285" y2="62" class="arrow"/>

<rect x="290" y="35" width="100" height="55" rx="5" fill="#fef2f2" stroke="#ef4444" stroke-width="1.2"/>
<text x="340" y="55" text-anchor="middle" class="title" fill="#ef4444">TTGIR</text>
<text x="340" y="72" text-anchor="middle" class="code" font-size="9">layout encoding</text>

<line x1="395" y1="62" x2="415" y2="62" class="arrow"/>

<rect x="420" y="35" width="100" height="55" rx="5" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.2"/>
<text x="470" y="55" text-anchor="middle" class="title" fill="#8b5cf6">LLVM IR</text>
<text x="470" y="72" text-anchor="middle" class="code" font-size="9">optimized</text>

<line x1="525" y1="62" x2="545" y2="62" class="arrow"/>

<rect x="550" y="35" width="110" height="55" rx="5" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2"/>
<text x="605" y="55" text-anchor="middle" class="title" fill="#22c55e">PTX / cubin</text>
<text x="605" y="72" text-anchor="middle" class="code" font-size="9">GPU binary</text>

<!-- Annotations below -->
<rect x="20" y="110" width="640" height="110" rx="5" fill="#f3f4f6" stroke="#d1d5db"/>
<text x="340" y="130" text-anchor="middle" class="title">Key Compiler Decisions</text>
<text x="40" y="150" class="code" font-size="10">Triton IR &rarr; TTGIR: decide data layout (blocked, mma, shared, dot_op)</text>
<text x="40" y="170" class="code" font-size="10">TTGIR &rarr; LLVM: lower tl.dot to WMMA/MMA, insert cp.async, software pipeline</text>
<text x="40" y="190" class="code" font-size="10">LLVM &rarr; PTX: standard LLVM backend optimizations (register allocation, scheduling)</text>
<text x="40" y="210" class="label">Layout encoding determines smem allocation, swizzle pattern, and Tensor Core instruction</text>

<text x="340" y="235" text-anchor="middle" font-size="11" fill="#aaa" font-style="italic">data-source: illustrative (after Triton compiler docs)</text>
</svg>
