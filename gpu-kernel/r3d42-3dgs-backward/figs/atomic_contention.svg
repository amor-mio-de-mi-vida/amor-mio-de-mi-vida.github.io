<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
<style>
  text{font-family:system-ui,sans-serif;font-size:12px;fill:#23272f}
  .title{font-size:11.5px;font-weight:700}
  .label{font-size:11px;fill:#6b7280}
  .code{font-family:ui-monospace,monospace;font-size:10.5px}
  .arrow{stroke:#23272f;stroke-width:1.3;marker-end:url(#ah3)}
</style>
<defs>
  <marker id="ah3" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
    <path d="M0,0 L7,2.5 L0,5z" fill="#23272f"/>
  </marker>
</defs>
<text x="340" y="18" text-anchor="middle" class="title">Atomic Contention: Naive vs Warp-Reduced</text>
<!-- Left: Naive -->
<text x="170" y="45" text-anchor="middle" class="title" fill="#ef4444">Naive: 256 atomicAdd / Gaussian</text>
<rect x="30" y="55" width="280" height="120" rx="5" fill="#fef2f2" stroke="#ef4444"/>
<!-- Pixel threads -->
<g transform="translate(45,70)">
  <rect width="30" height="18" rx="2" fill="#fecaca"/><text x="15" y="13" text-anchor="middle" class="code" font-size="9">pix0</text>
  <rect x="35" width="30" height="18" rx="2" fill="#fecaca"/><text x="50" y="13" text-anchor="middle" class="code" font-size="9">pix1</text>
  <rect x="70" width="30" height="18" rx="2" fill="#fecaca"/><text x="85" y="13" text-anchor="middle" class="code" font-size="9">pix2</text>
  <text x="110" y="13" class="code" font-size="9">...</text>
  <rect x="130" width="40" height="18" rx="2" fill="#fecaca"/><text x="150" y="13" text-anchor="middle" class="code" font-size="9">pix255</text>
</g>
<!-- All arrows point to same target -->
<line x1="60" y1="95" x2="170" y2="140" stroke="#ef4444" stroke-width="0.8" marker-end="url(#ah3)"/>
<line x1="95" y1="95" x2="170" y2="140" stroke="#ef4444" stroke-width="0.8" marker-end="url(#ah3)"/>
<line x1="130" y1="95" x2="170" y2="140" stroke="#ef4444" stroke-width="0.8" marker-end="url(#ah3)"/>
<line x1="215" y1="95" x2="170" y2="140" stroke="#ef4444" stroke-width="0.8" marker-end="url(#ah3)"/>
<rect x="130" y="140" width="80" height="24" rx="3" fill="#fee2e2" stroke="#ef4444"/>
<text x="170" y="157" text-anchor="middle" class="code" font-size="10">dL/dG_i</text>
<text x="170" y="184" text-anchor="middle" class="label">256 serialized atomics</text>
<!-- Right: Warp-reduced -->
<text x="510" y="45" text-anchor="middle" class="title" fill="#22c55e">Warp-Reduced: 8 atomicAdd / Gaussian</text>
<rect x="370" y="55" width="280" height="120" rx="5" fill="#f0fdf4" stroke="#22c55e"/>
<!-- Warp groups -->
<g transform="translate(385,70)">
  <rect width="55" height="18" rx="2" fill="#bbf7d0"/><text x="27" y="13" text-anchor="middle" class="code" font-size="9">warp 0</text>
  <rect x="60" width="55" height="18" rx="2" fill="#bbf7d0"/><text x="87" y="13" text-anchor="middle" class="code" font-size="9">warp 1</text>
  <text x="125" y="13" class="code" font-size="9">...</text>
  <rect x="140" width="55" height="18" rx="2" fill="#bbf7d0"/><text x="167" y="13" text-anchor="middle" class="code" font-size="9">warp 7</text>
</g>
<!-- Shuffle reduction inside each warp -->
<text x="510" y="106" text-anchor="middle" class="code" font-size="10">__shfl_down_sync (5 steps)</text>
<!-- Only lane 0 does atomic -->
<g transform="translate(385,112)">
  <rect width="55" height="18" rx="2" fill="#86efac"/><text x="27" y="13" text-anchor="middle" class="code" font-size="9">lane0</text>
  <rect x="60" width="55" height="18" rx="2" fill="#86efac"/><text x="87" y="13" text-anchor="middle" class="code" font-size="9">lane0</text>
  <text x="125" y="13" class="code" font-size="9">...</text>
  <rect x="140" width="55" height="18" rx="2" fill="#86efac"/><text x="167" y="13" text-anchor="middle" class="code" font-size="9">lane0</text>
</g>
<line x1="412" y1="137" x2="510" y2="148" stroke="#22c55e" stroke-width="0.8" marker-end="url(#ah3)"/>
<line x1="472" y1="137" x2="510" y2="148" stroke="#22c55e" stroke-width="0.8" marker-end="url(#ah3)"/>
<line x1="552" y1="137" x2="510" y2="148" stroke="#22c55e" stroke-width="0.8" marker-end="url(#ah3)"/>
<rect x="470" y="145" width="80" height="24" rx="3" fill="#dcfce7" stroke="#22c55e"/>
<text x="510" y="162" text-anchor="middle" class="code" font-size="10">dL/dG_i</text>
<text x="510" y="184" text-anchor="middle" class="label">8 atomics (32&times; fewer)</text>
<!-- Bottom comparison -->
<rect x="80" y="210" width="520" height="75" rx="5" fill="#f9fafb" stroke="#d1d5db"/>
<text x="340" y="232" text-anchor="middle" class="title">Contention Impact</text>
<text x="100" y="252" class="label">Large Gaussian covering many tiles: hundreds of pixels atomically update the same dL/d&mu;</text>
<text x="100" y="270" class="label">Warp reduction: 32 threads &rarr; 1 atomic &rArr; contention reduced 32&times; per warp</text>
<text x="340" y="308" text-anchor="middle" font-size="11" fill="#aaa" font-style="italic">data-source: illustrative</text>
</svg>
