<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
<style>
  text{font-family:system-ui,sans-serif;font-size:12px;fill:#23272f}
  .title{font-size:11.5px;font-weight:700}
  .label{font-size:11px;fill:#6b7280}
  .code{font-family:ui-monospace,monospace;font-size:10.5px}
  .arrow{stroke:#23272f;stroke-width:1.3;marker-end:url(#ah1)}
</style>
<defs>
  <marker id="ah1" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
    <path d="M0,0 L7,2.5 L0,5z" fill="#23272f"/>
  </marker>
</defs>
<text x="340" y="18" text-anchor="middle" class="title">3DGS Backward: Data Flow</text>
<!-- Loss -->
<rect x="265" y="30" width="150" height="35" rx="5" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
<text x="340" y="52" text-anchor="middle" class="title" fill="#ef4444">dL/dPixel (H&times;W&times;3)</text>
<!-- Arrow down -->
<line x1="340" y1="68" x2="340" y2="95" class="arrow"/>
<!-- Rasterize backward -->
<rect x="195" y="98" width="290" height="70" rx="6" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.5"/>
<text x="340" y="118" text-anchor="middle" class="title" fill="#ec4899">Rasterize Backward Kernel</text>
<text x="205" y="136" class="code">back-to-front replay (r = rounds-1..0)</text>
<text x="205" y="152" class="code">T recovery: T = T / (1 - &alpha;)</text>
<!-- Outputs of rasterize backward -->
<rect x="20" y="195" width="120" height="30" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
<text x="80" y="215" text-anchor="middle" class="code">dL/dmean2d</text>
<rect x="155" y="195" width="110" height="30" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
<text x="210" y="215" text-anchor="middle" class="code">dL/dconic</text>
<rect x="280" y="195" width="110" height="30" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
<text x="335" y="215" text-anchor="middle" class="code">dL/dcolor</text>
<rect x="405" y="195" width="120" height="30" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
<text x="465" y="215" text-anchor="middle" class="code">dL/dopacity</text>
<rect x="540" y="195" width="120" height="30" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
<text x="600" y="215" text-anchor="middle" class="code">atomicAdd</text>
<!-- Arrows from rasterize backward to outputs -->
<line x1="250" y1="170" x2="80" y2="193" class="arrow"/>
<line x1="300" y1="170" x2="210" y2="193" class="arrow"/>
<line x1="380" y1="170" x2="335" y2="193" class="arrow"/>
<line x1="430" y1="170" x2="465" y2="193" class="arrow"/>
<!-- Arrow down to preprocess backward -->
<line x1="210" y1="228" x2="210" y2="258" class="arrow"/>
<!-- Preprocess backward -->
<rect x="60" y="260" width="300" height="55" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.2"/>
<text x="210" y="282" text-anchor="middle" class="title" fill="#22c55e">Preprocess Backward Kernel</text>
<text x="70" y="300" class="code">chain rule: conic &rarr; cov2d &rarr; cov3d &rarr; (q, s, &mu;)</text>
<!-- Final outputs -->
<rect x="400" y="265" width="100" height="22" rx="3" fill="#dcfce7" stroke="#86efac"/>
<text x="450" y="281" text-anchor="middle" class="code">dL/d&mu;</text>
<rect x="510" y="265" width="80" height="22" rx="3" fill="#dcfce7" stroke="#86efac"/>
<text x="550" y="281" text-anchor="middle" class="code">dL/dq</text>
<rect x="600" y="265" width="70" height="22" rx="3" fill="#dcfce7" stroke="#86efac"/>
<text x="635" y="281" text-anchor="middle" class="code">dL/ds</text>
<line x1="362" y1="288" x2="398" y2="278" class="arrow"/>
<line x1="362" y1="288" x2="508" y2="278" class="arrow"/>
<line x1="362" y1="288" x2="598" y2="278" class="arrow"/>
<text x="340" y="332" text-anchor="middle" font-size="11" fill="#aaa" font-style="italic">data-source: illustrative</text>
</svg>
